<div class="nojs" id="nojs"><div class="box"><p class="badge">shautech labs</p><h2>This simulator needs JavaScript.</h2><p class="muted">It runs entirely in your browser, nothing is sent anywhere. Enable JavaScript, or <a href="index.html" style="color:var(--accent2)">go back to all labs</a>.</p></div></div>

<script>
/* © 2026 shautech. Breach Day — game logic. */
(function(){
'use strict';
const { icon, say, sev, scoreAt, addScore, show, toast, mood, util } = Lab;
const { esc, pick, clamp } = util;
const $ = s => document.querySelector(s);

/* ---------------- timers (always cleared when a level starts) ---------------- */
const timers = { to: [], iv: [] };
function later(fn, ms){ const id = setTimeout(fn, ms); timers.to.push(id); return id; }
function every(fn, ms){ const id = setInterval(fn, ms); timers.iv.push(id); return id; }
function clearTimers(){ timers.to.forEach(clearTimeout); timers.iv.forEach(clearInterval); timers.to = []; timers.iv = []; }
function sc(k, v){ if (Lab.scene) Lab.scene.set(k, v); }

/* ---------------- ambient scene: attacker rack (left) firing at the company rack (right) ---------------- */
const FLOWS = {
  phish:  { glyphs:['mail'],               hostile:true,  dir:1 },
  urls:   { glyphs:['bug','mail'],         hostile:true,  dir:1 },
  attach: { glyphs:['file'],               hostile:true,  dir:1 },
  creds:  { glyphs:['key'],                hostile:true,  dir:1 },
  exfil:  { glyphs:['mail','file'],        hostile:true,  dir:-1 },
  storm:  { glyphs:['mail','bug'],         hostile:true,  dir:1, fast:true },
  clean:  { glyphs:['lock','shield','mail'], hostile:false, dir:1 }
};
const scene = {
  state: { level: 0, mood: '', flow: 'phish', contained: false, clean: false },
  init(s, W, H){
    const small = W < 640;
    const rw = small ? 34 : 46, rh = Math.min(H * .5, 360), ry = (H - rh) / 2 + 24;
    s.g = { rw, rh, ry, lx: 14, rx: W - 14 - rw, ax: 14 + rw, bx: W - 14 - rw, cy: ry + rh / 2 };
    const lanes = small ? 4 : 6;
    s.lanes = [];
    for (let i = 0; i < lanes; i++) {
      const ya = ry + rh * (.1 + .8 * i / (lanes - 1));
      const yb = ry + rh * (.1 + .8 * Math.random());
      s.lanes.push(Lab.draw.curve(
        [s.g.ax, ya],
        [W * (.3 + Math.random() * .1), ya + (Math.random() * 2 - 1) * H * .18],
        [W * (.6 + Math.random() * .1), yb + (Math.random() * 2 - 1) * H * .18],
        [s.g.bx, yb], 120));
    }
    const n = clamp(Math.round(W / 40), 14, 36);
    s.parts = Array.from({ length: n }, () => ({ lane: Math.floor(Math.random() * lanes), t: Math.random(), v: .05 + Math.random() * .07, sz: 3.2 + Math.random() * 1.8, k: null }));
    s.pulses = []; s.flash = 0;
  },
  draw(ctx, s, W, H, t, dt){
    if (!s.g) return;
    const C = Lab.colors, D = Lab.draw, g = s.g;
    const flowName = (s.clean || s.mood === 'calm' || s.level >= 7) ? 'clean' : (FLOWS[s.flow] ? s.flow : 'phish');
    const F = FLOWS[flowName];
    const night = s.mood === 'night';
    const coCol = F.hostile ? (night ? C.violet : C.accent) : C.mint;
    s.flash = Math.max(0, s.flash - dt * 1.2);

    // racks
    D.rack(ctx, g.lx, g.ry, g.rw, g.rh, { color: Lab.rgba(C.red, .45), label: 'ATTACKER', led: i => Lab.rgba(C.red, .25 + .5 * (Math.sin(t * 2 + i * 1.7) * .5 + .5)) });
    D.rack(ctx, g.rx, g.ry, g.rw, g.rh, { color: Lab.rgba(coCol, .5), label: 'PIXELSOFT', led: i => Lab.rgba(coCol, .25 + .5 * (Math.sin(t * 1.6 + i * 2.1) * .5 + .5)) });

    // lanes (slow dash crawl)
    ctx.lineDashOffset = -t * 7;
    s.lanes.forEach(pts => D.path(ctx, pts, 'rgba(255,255,255,.05)', 1, [2, 7]));
    ctx.lineDashOffset = 0;

    // shield in front of the company rack (only once containment is done)
    const BLOCK = .84;
    if (s.contained) {
      ctx.save();
      ctx.strokeStyle = Lab.rgba(F.hostile ? C.accent : C.mint, .28 + s.flash * .45);
      ctx.lineWidth = 2; ctx.shadowBlur = 14; ctx.shadowColor = Lab.rgba(F.hostile ? C.accent : C.mint, .7);
      ctx.beginPath(); ctx.ellipse(g.bx + 8, g.cy, 40, g.rh * .58, 0, Math.PI * .55, Math.PI * 1.45); ctx.stroke();
      ctx.restore();
    }

    // packets
    const speed = F.fast ? 1.8 : 1;
    for (const p of s.parts) {
      if (!p.k || !F.glyphs.includes(p.k)) p.k = pick(F.glyphs);
      p.t += p.v * dt * speed * F.dir;
      const pts = s.lanes[p.lane];
      if (F.dir === 1 && F.hostile && s.contained && p.t >= BLOCK) {
        const [hx, hy] = D.posOn(pts, BLOCK);
        s.pulses.push({ x: hx, y: hy, r: 2, a: .35, col: C.red });
        s.flash = Math.min(1, s.flash + .4);
        p.t = 0; p.lane = Math.floor(Math.random() * s.lanes.length); p.k = pick(F.glyphs);
        continue;
      }
      if (F.dir === 1 && p.t >= 1) {
        const [ex, ey] = D.posOn(pts, 1);
        if (Math.random() < .5) s.pulses.push({ x: ex, y: ey, r: 2, a: .3, col: F.hostile ? C.red : C.mint });
        p.t = 0; p.lane = Math.floor(Math.random() * s.lanes.length); p.v = .05 + Math.random() * .07; p.k = pick(F.glyphs);
      }
      if (F.dir === -1 && p.t <= 0) {
        const [ex, ey] = D.posOn(pts, 0);
        if (Math.random() < .5) s.pulses.push({ x: ex, y: ey, r: 2, a: .3, col: C.red });
        p.t = 1; p.lane = Math.floor(Math.random() * s.lanes.length); p.v = .05 + Math.random() * .07; p.k = pick(F.glyphs);
      }
      const lane = s.lanes[p.lane];
      const col = F.hostile ? C.red : (p.k === 'mail' ? C.accent2 : C.mint);
      for (let k = 4; k >= 1; k--) {
        const [qx, qy] = D.posOn(lane, p.t - F.dir * k * .012);
        ctx.fillStyle = Lab.rgba(col, .14 * (1 - k / 5));
        ctx.beginPath(); ctx.arc(qx, qy, Math.max(p.sz * .5 * (1 - k * .15), .3), 0, 7); ctx.fill();
      }
      const [hx, hy] = D.posOn(lane, p.t);
      ctx.save(); ctx.globalAlpha = .85; D.glyph(ctx, p.k, hx, hy, p.sz, Lab.rgba(col, .9)); ctx.restore();
    }

    // impact / arrival pulses
    s.pulses = s.pulses.filter(q => q.a > .01);
    for (const q of s.pulses) {
      q.r += 34 * dt; q.a -= .5 * dt;
      ctx.strokeStyle = Lab.rgba(q.col, Math.max(q.a, 0)); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.stroke();
    }
  }
};

/* ---------------- L0 : briefing ---------------- */
function L0(){
  clearTimers(); mood('');
  sc('flow', 'phish');
  show(`
    ${Lab.badge('Level 0 · Monday, 09:02', 'play')}
    <h1>Something <em>phishy</em> just landed in the inbox.</h1>
    ${say('the boss', `Quick question. I got an email from <b>"Microsoft Support"</b> saying my mailbox gets deleted in 2 hours unless I verify my password. I clicked the link and, well, typed it in. It looked <i>completely</i> real. That's fine, right?`, 'alert')}
    ${say('your guide', `Welcome to <b>Breach Day</b> at PixelSoft (the same team from the migration lab; trouble follows them). What the boss just described is a <b>phishing attack</b>, and those typed-in credentials are now in someone else's hands. No panic: incidents are won with a <b>plan</b>, not with adrenaline. Detect, investigate, contain, clean up, recover, learn. Step by step.`, 'tip')}
    <div class="spacer"></div>
    <button class="btn blue" onclick="L.goto(1)">${icon('arrow-right')}Take the incident</button>
  `);
}

/* ---------------- L1 : spot the phish ---------------- */
const clues = [
  { t:'The sender address', ex:'"micros0ft-helpdesk.com", with a zero. The display name says Microsoft; the actual domain says scam. Always read the part after the @.', flow:'phish' },
  { t:'Panic plus a deadline', ex:'"URGENT", "2 hours", capitals everywhere. Fear and time pressure switch off careful thinking; that is the whole trick. Real providers do not threaten to delete your mailbox by lunch.', flow:'phish' },
  { t:'The generic greeting', ex:'"Dear valued user": they do not know your name, because this exact mail went to thousands of people.', flow:'phish' },
  { t:'The broken grammar', ex:'"Please to verify you account": large companies employ proofreaders. Attackers often do not. Odd phrasing is a gift; accept it.', flow:'phish' },
  { t:'The link', ex:'"portal-micr0soft-secure.com" is not microsoft.com. Hover before you click and the true destination shows up. A lookalike domain is the number one tell.', flow:'urls' },
  { t:'The attachment', ex:'A "mailbox_backup.html" file: an HTML attachment that opens a fake login page right on your computer. Unexpected attachments from strangers: never open them.', flow:'attach' }
];
let cluesFound = 0;
function L1(){
  clearTimers(); mood('');
  cluesFound = 0;
  show(`
    ${Lab.badge('Level 1 · detect', 'mail')}
    <h2>Spot the <em>phish</em></h2>
    ${say('your guide', `Here is the exact email the boss received. It fooled him, but it would not fool someone who knows the tells. Find and click all <b>6 red flags</b> (+10 each).`, 'tip')}
    <div class="mail" role="group" aria-label="Suspicious email, click the parts that look wrong">
      <div class="mail__bar"><i></i><i></i><i></i><span>inbox · boss@pixelsoft.com</span></div>
      <div class="mail__head">
        <div><span class="k">FROM</span><b>Microsoft Support</b> &lt;<button class="clue" id="cl0" onclick="L.clue(0,event)">security-alert@micros0ft-helpdesk.com</button>&gt;</div>
        <div><span class="k">TO</span>boss@pixelsoft.com</div>
        <div><span class="k">SUBJECT</span><button class="clue" id="cl1" onclick="L.clue(1,event)">URGENT!!! Your mailbox will be DELETED in 2 hours</button></div>
      </div>
      <div class="mail__body">
        <button class="clue" id="cl2" onclick="L.clue(2,event)">Dear valued user,</button><br><br>
        We detected unusual activity on your mailbox. <button class="clue" id="cl3" onclick="L.clue(3,event)">Please to verify you account immediately</button>
        or your mailbox will be permanently deleted and all emails lost forever.<br><br>
        Verify here: <button class="clue link" id="cl4" onclick="L.clue(4,event)">portal-micr0soft-secure.com/verify</button><br>
        <span class="fake-btn" aria-hidden="true">Verify my account</span><br>
        <button class="clue attach" id="cl5" onclick="L.clue(5,event)">${icon('file')}mailbox_backup.html (2 KB)</button><br><br>
        Thank you for your cooperation,<br>
        <span class="muted">The IT Team</span>
      </div>
    </div>
    <div class="inv" id="clueLog">${icon('search')} <b>Red flags found: 0/6</b> — click the suspicious parts of the email above.</div>
    <div class="spacer"></div>
    <button class="btn blue" id="l1next" style="display:none" onclick="L.goto(2)">${icon('arrow-right')}All flags found. To triage</button>
  `);
}
function clue(i, e){
  const el = $('#cl' + i); if (!el || el.classList.contains('hit')) return;
  el.classList.add('hit');
  cluesFound++;
  sc('flow', clues[i].flow);
  scoreAt(10, e);
  const log = $('#clueLog'); if (!log) return;
  if (cluesFound === clues.length) {
    Lab.patch('#clueLog', `${icon('check-circle')} <b>All 6 flags found.</b> One golden rule covers most of them: <b>slow down</b>. Phishing only works at high speed; the moment you pause and read, the costume falls apart.`);
    const n = $('#l1next'); if (n) n.style.display = 'inline-flex';
  } else {
    Lab.patch('#clueLog', `${icon('search')} <b>Red flags found: ${cluesFound}/6</b><br>${sev('crit', 'flag')} <b>${esc(clues[i].t)}</b> — ${esc(clues[i].ex)}`);
  }
}

/* ---------------- L2 : triage decisions + toolbox ---------------- */
const decisions = [
  { q:'The boss clicked and typed his password. Your very first move?',
    opts:[
      { t:'Reset his password and kill every active session', s:'Make the stolen credentials worthless, right now.', v:'good', pts:10,
        fb:'Exactly. Every minute those credentials work, the attacker is reading email as the boss. Revoke sessions too: a password change alone does not kick out someone already logged in. (+10)' },
      { t:'Send a company-wide warning email', s:'Warn everyone before somebody else clicks.', v:'meh', pts:5,
        fb:'Good instinct, wrong order. While you are wordsmithing the announcement, the attacker is inside. Lock the door first, then warn people. (+5)' },
      { t:'Unplug the server and the Wi-Fi', s:'No network, no hacker. Problem solved?', v:'bad', pts:0,
        fb:'Dramatic, but the mailbox lives in the cloud. Pulling office cables stops your business, not the attacker, who is connecting from somewhere else entirely. (0)' }
    ] },
  { q:'Is it just the boss? How do you find out?',
    opts:[
      { t:'Search the logs: who received it, who clicked, who signed in', s:'Facts from the systems, not from memory.', v:'good', pts:10,
        fb:'Scope first. The same mail went to 14 people. Message trace shows who received it, sign-in logs show who got harvested. Facts beat feelings during an incident. (+10)' },
      { t:'Ask everyone to raise a hand if they clicked', s:'Honesty poll in the hallway.', v:'meh', pts:5,
        fb:'People are embarrassed to admit clicking; you will get silence and half-truths. Ask anyway (kindly), but verify in the logs. (+5)' },
      { t:'Assume it is only him; nobody else said anything', s:'No news is good news, right?', v:'bad', pts:0,
        fb:'The quiet clickers are the dangerous ones. "Nobody said anything" is exactly what a spreading incident sounds like. (0)' }
    ] },
  { q:'Who needs to know, right now?',
    opts:[
      { t:'Management plus whoever handles your security, calm and factual', s:'Short briefing: what happened, what you are doing.', v:'good', pts:10,
        fb:'Yes. Decision-makers must hear it from you, early, without drama. If personal data might be involved, this also starts the compliance clock; more on that tonight. (+10)' },
      { t:'Everyone, subject: "WE HAVE BEEN HACKED!!!"', s:'Total transparency, maximum volume.', v:'meh', pts:5,
        fb:'Transparency yes, panic no. That subject line generates 50 helpdesk calls and three rumours per hour. Inform people with instructions, not sirens. (+5)' },
      { t:'Nobody. Fix it quietly, tell no one', s:'What they do not know cannot scare them.', v:'bad', pts:0,
        fb:'Silence feels safe and ages terribly. If personal data leaked, staying quiet can even be illegal (GDPR says 72 hours). Secrets and incidents do not mix. (0)' }
    ] }
];
const tools = [
  { ic:'shield-check', t:'The built-in security tools', s:'Microsoft Defender and friends, already in many M365 licences.',
    fb:'Great default: alerts, message trace, sign-in logs and quarantine actions are already there. Many companies just never open the console. Today you will. (+10)' },
  { ic:'radar', t:'A SIEM, the control tower', s:'Microsoft Sentinel or similar: every log, one screen.',
    fb:'The control tower: all logs in one place, hunting queries, automation. Overkill for a tiny office, priceless once you have real infrastructure. (+10)' },
  { ic:'phone', t:'Call in specialists', s:'A security partner or MSSP who does this every week.',
    fb:'No shame in this one: during an incident, speed beats pride. The best setups combine it: your tools plus someone on speed-dial who has seen this before. (+10)' }
];
let di = 0;
function L2(){
  clearTimers(); mood('');
  di = 0;
  sc('flow', 'creds');
  show(`
    ${Lab.badge('Level 2 · triage', 'bolt')}
    <h2>First moves <em>matter most</em></h2>
    ${say('your guide', `The first hour of an incident decides how the whole week goes. Three quick calls to make; choose wisely.`, 'tip')}
    <div id="dzone"></div>
  `);
  renderDecision();
}
function renderDecision(){
  const d = decisions[di];
  Lab.patch('#dzone', `
    <h3 style="margin-top:14px">Decision ${di + 1}/${decisions.length}: ${esc(d.q)}</h3>
    <div class="choices">
      ${d.opts.map((o, i) => `<button class="choice" id="ch${i}" onclick="L.decide(${i},event)"><b>${esc(o.t)}</b><small>${esc(o.s)}</small></button>`).join('')}
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="spacer"></div>
    <button class="btn blue" id="dnext" style="display:none" onclick="L.nextDecision()"></button>
  `);
}
function decide(i, e){
  const d = decisions[di], o = d.opts[i];
  d.opts.forEach((x, j) => { const el = $('#ch' + j); if (!el) return; el.disabled = true; if (j === i) el.classList.add(o.v); });
  if (o.pts > 0) scoreAt(o.pts, e);
  Lab.patch('#verdict', say(o.v === 'good' ? 'nice' : 'hmm', esc(o.fb), o.v === 'good' ? 'tip' : 'warn'));
  const v = $('#verdict'); if (v) v.classList.add('show');

          <div class="tx">${icon('ticket')}<span><b>${esc(tk.t)}</b><small>${esc(tk.who)}</small></span></div>
          <div class="choices">
            ${tk.opts.map((op, j) => `<button class="choice" id="tk${i}o${j}" onclick="L.solve(${i},${j},event)">${esc(op.o)}</button>`).join('')}
          </div>
          <div class="verdict" id="tk${i}v"></div>
        </div>`).join('')}
    </div>
    <div class="spacer"></div>
    <div id="finale"></div>
  `);
}
function solve(i, j, e){
  const tk = tickets[i], card = $('#tk' + i);
  if (!card || card.classList.contains('done')) return;
  const btn = $(`#tk${i}o${j}`); if (!btn) return;
  if (tk.opts[j].ok) {
    card.classList.add('done');
    tk.opts.forEach((op, k) => { const b = $(`#tk${i}o${k}`); if (!b) return; b.disabled = true; if (k === j) b.classList.add('good'); });
    scoreAt(firstTry[i] === undefined ? 10 : 5, e);
    Lab.patch('#tk' + i + 'v', say('solved', esc(tk.ex), 'tip'));
    const v = $('#tk' + i + 'v'); if (v) v.classList.add('show');
    tdone++;
    if (tdone === tickets.length) Lab.finale({ into: '#finale', heading: 'Breach Day: survived.' });
  } else {
    firstTry[i] = false;
    btn.classList.add('bad'); btn.disabled = true;
  }
}

/* expose handlers used by inline onclick="" */
window.L = { goto: n => { clearTimers(); Lab.goto(n); }, clue, decide, nextDecision, tool, ev, act, rudy, flip, recNext, solve };
