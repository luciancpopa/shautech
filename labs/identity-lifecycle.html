<script>
/* © 2026 shautech. The Revolving Door — game logic. */
(function(){
'use strict';
const { icon, say, btn, avatar, sev, scoreAt, addScore, show, goto, toast, mood, util } = Lab;
const { esc, pick, shuffle, clamp } = util;
const D = Lab.draw, C = Lab.colors, rgba = Lab.rgba;
const $ = id => document.getElementById(id);

/* ---------------- timers (cleared on every level change) ---------------- */
let timers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
const every = (fn, ms) => { const id = setInterval(fn, ms); timers.push(id); return id; };
const clearAll = () => { timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers = []; };
const sc = (k, v) => { if (Lab.scene) Lab.scene.set(k, v); };
const sget = k => Lab.scene ? Lab.scene.state[k] : undefined;

/* ---------------- ambient scene: the identity conveyor ---------------- */
const RACKS = [
  { f: .36, label: 'SALES',   col: C.amber },
  { f: .52, label: 'FINANCE', col: C.accent },
  { f: .68, label: 'IT',      col: C.mint }
];
const LANES = 5;
const laneY = (s, i) => s.g.dy + s.g.dh * (.12 + .76 * i / (LANES - 1));
const rackT = (s, ri) => (s.W * RACKS[ri].f - s.g.ax) / (s.g.bx - s.g.ax);
const posOf = (s, p, t) => { const tt = t === undefined ? p.t : t; return [s.g.ax + (s.g.bx - s.g.ax) * tt, laneY(s, p.lane) + Math.sin(tt * 7.5 + p.ph) * 5]; };
const staleChance = s => s.automated ? 0 : ((s.reviewed || s.level >= 4) ? .1 : .3);
function newPart(s) {
  return { t: 0, v: .045 + Math.random() * .06, lane: Math.floor(Math.random() * LANES), ph: Math.random() * 6.28,
    s: 1.3 + Math.random() * 1.3, dept: Math.floor(Math.random() * RACKS.length), rings: [], got: [false, false, false],
    stale: Math.random() < staleChance(s) };
}
const ghostPos = (s, i) => [s.g.xR - 26 - (i % 3) * 26, s.g.dy + s.g.dh - 18 - Math.floor(i / 3) * 28];

const scene = {
  state: { level: 0, mood: '', ghosts: 4, automated: false, reviewed: false },
  init(s, W, H) {
    s.W = W; s.H = H;
    const dw = 42, dh = Math.min(H * .5, 360), dy = (H - dh) / 2;
    s.g = { dw, dh, dy, xL: 12, xR: W - 12 - dw, ax: 12 + dw + 6, bx: W - 12 - dw - 6 };
    const n = clamp(Math.round(W / 44), 14, 32);
    s.parts = [];
    for (let i = 0; i < n; i++) {
      const p = newPart(s); p.t = Math.random();
      RACKS.forEach((r, ri) => { if (p.t >= rackT(s, ri)) { p.got[ri] = true; if (ri === p.dept) p.rings.push(r.col); } });
      s.parts.push(p);
    }
    s.pulses = []; s.lastSweep = 0; s.dash = 0;
  },
  draw(ctx, s, W, H, t, dt) {
    if (!s.g || s.W !== W) this.init(s, W, H);
    const g = s.g;
    s.dash -= 10 * dt;
    const base = s.automated ? C.mint : (s.mood === 'night' ? C.violet : C.accent2);

    /* lanes */
    ctx.save(); ctx.strokeStyle = rgba(C.accent2, .06); ctx.lineWidth = 1; ctx.setLineDash([2, 7]); ctx.lineDashOffset = s.dash;
    for (let i = 0; i < LANES; i++) { const y = laneY(s, i); ctx.beginPath(); ctx.moveTo(g.ax, y); ctx.lineTo(g.bx, y); ctx.stroke(); }
    ctx.restore();

    /* department racks */
    RACKS.forEach((r, ri) => {
      const x = W * r.f;
      ctx.save(); ctx.strokeStyle = rgba(r.col, .12); ctx.setLineDash([2, 6]); ctx.beginPath(); ctx.moveTo(x, g.dy); ctx.lineTo(x, g.dy + g.dh + 30); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.globalAlpha = .4;
      D.rack(ctx, x - 20, g.dy + g.dh + 30, 40, 46, { label: r.label, color: rgba(r.col, .55), slots: 2, led: i => rgba(r.col, .35 + .35 * (Math.sin(t * 1.8 + i * 1.7 + ri * 3) * .5 + .5)) });
      ctx.restore();
    });

    /* doors */
    const rightCol = s.automated ? C.mint : (s.reviewed ? C.amber : (s.ghosts > 0 ? C.red : C.accent2));
    [{ x: g.xL, label: 'J O I N E R S', col: C.mint, right: false }, { x: g.xR, label: 'L E A V E R S', col: rightCol, right: true }].forEach(d => {
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.fillStyle = 'rgba(16,19,23,.55)';
      D.rr(ctx, d.x, g.dy, g.dw, g.dh, 10); ctx.fill(); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const ph = (t * .35 + i / 4) % 1, bx = d.x + 5 + ph * (g.dw - 14);
        ctx.fillStyle = rgba(d.col, .08 + .24 * Math.sin(ph * Math.PI)); ctx.fillRect(bx, g.dy + 10, 4, g.dh - 20);
      }
      ctx.translate(d.right ? d.x - 8 : d.x + g.dw + 14, g.dy + g.dh / 2); ctx.rotate(-Math.PI / 2);
      D.text(ctx, d.label, 0, 0, { color: rgba(d.col, .55), size: 9, baseline: 'middle' });
      ctx.restore();
    });

    /* ghosts piling up at the exit */
    for (let i = 0; i < Math.min(s.ghosts, 9); i++) {
      const [gx, gy] = ghostPos(s, i), a = .35 + .22 * Math.sin(t * 2.6 + i * 1.7);
      D.glyph(ctx, 'user', gx, gy, 5, rgba(C.red, Math.max(a, .1)));
    }
    /* the sweep: review and automation remove ghosts, one by one */
    if ((s.automated || s.reviewed) && s.ghosts > 0 && t - s.lastSweep > (s.automated ? .8 : 1.6)) {
      s.lastSweep = t; s.ghosts--;
      const [gx, gy] = ghostPos(s, s.ghosts); s.pulses.push({ x: gx, y: gy, r: 2, a: .4, col: C.mint });
    }

    /* accounts flowing through */
    for (const p of s.parts) {
      p.t += p.v * dt;
      for (let ri = 0; ri < RACKS.length; ri++) {
        if (p.got[ri] || p.t < rackT(s, ri)) continue;
        p.got[ri] = true;
        if (ri === p.dept || p.stale) { p.rings.push(RACKS[ri].col); const [px, py] = posOf(s, p); s.pulses.push({ x: px, y: py, r: 2, a: .28, col: RACKS[ri].col }); }
      }
      if (p.stale && p.t >= .86) {
        if (!s.automated && !s.reviewed && s.ghosts < 9) s.ghosts++;
        const [px, py] = posOf(s, p); s.pulses.push({ x: px, y: py, r: 3, a: .4, col: C.red });
        Object.assign(p, newPart(s)); continue;
      }
      if (p.t >= 1) { const [px, py] = posOf(s, p); s.pulses.push({ x: px, y: py, r: 2, a: .3, col: base }); Object.assign(p, newPart(s)); continue; }
      const col = (p.stale && p.t > .65) ? C.red : base;
      const [px, py] = posOf(s, p);
      for (let k = 4; k >= 1; k--) {
        const [qx, qy] = posOf(s, p, Math.max(p.t - k * .012, 0));
        ctx.beginPath(); ctx.arc(qx, qy, Math.max(p.s * .6 * (1 - k * .15), .2), 0, 7); ctx.fillStyle = rgba(col, .14 * (1 - k / 5)); ctx.fill();
      }
      ctx.save(); ctx.lineWidth = 1;
      p.rings.forEach((rc, i) => { ctx.beginPath(); ctx.arc(px, py, p.s * 2.3 + i * 2.6, 0, 7); ctx.strokeStyle = rgba(rc, .45); ctx.stroke(); });
      ctx.restore();
      D.glyph(ctx, 'user', px, py, p.s * 1.6, rgba(col, .8));
    }

    /* pulses */
    s.pulses = s.pulses.filter(p => p.a > .01);
    ctx.save(); ctx.lineWidth = 1;
    for (const p of s.pulses) { p.r += 34 * dt; p.a -= .5 * dt; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.strokeStyle = rgba(p.col, Math.max(p.a, 0)); ctx.stroke(); }
    ctx.restore();
  }
};

/* ---------------- L0 : briefing ---------------- */
function L0(){
  mood('');
  show(`
    ${Lab.badge('Level 0 · the door that never closes','play')}
    <h1>People come. People go.<br>Their <em>accounts</em> stay.</h1>
    ${say('the boss', `Odd one for you. Accounting just received an out-of-office reply from <b>Dan</b>. Dan left the company <b>eight months ago</b>. Why does Dan still have email? And the sign-in log says he <b>signed in on Tuesday</b>.`)}
    ${say('your guide', `Meet the <b>ghost account</b>. Every company has them. Every person who joins, changes jobs or leaves spins the same revolving door; identity people call it <b>Joiner – Mover – Leaver</b>. When the door works, access appears on day one, changes when the job changes, and ends the day the badge is handed back. When it does not, you get Dan.<br><br>Look at the background: accounts enter at <b>JOINERS</b>, pick up coloured access rings at the department racks, and should dissolve at <b>LEAVERS</b>. The red ones piling up at the exit are ghosts. Let us go hunting.`, 'tip')}
    <div class="spacer"></div>
    <button class="btn blue" onclick="L.goto(1)">${icon('arrow-right')}Show me the ghosts</button>
  `);
}

/* ---------------- L1 : the ghost hunt ---------------- */
const objects = [
  { ic: avatar('DA', 350, 'ghost'), nm: "Dan's account", found: "Left 8 months ago. Status: <b>Active</b>. Password: still works. Mailbox, files, VPN: all reachable. Nobody told IT, and the door never closed. This is the single most common finding in any identity audit." },
  { ic: icon('file-text'), nm: 'Sticky note', found: "The shared-mailbox password for office@, on paper, known by everyone who ever worked here, including the people who left. A shared password never leaves with the person. Shared mailboxes should not have a password people type at all; access is granted to each person's own account." },
  { ic: avatar('CM', 20, 'ghost'), nm: 'consultant-mike', found: "The contractor finished his project last spring and is still an <b>Owner</b> on three SharePoint sites. External accounts need an expiry date set on day one, not a memory of one." },
  { ic: icon('robot'), nm: 'svc-backup (2018)', found: "A service account with <b>Global Admin</b> and a password nobody dares change because «something might break». Highest privilege, oldest password, no owner: the jackpot for an attacker." },
  { ic: icon('phone'), nm: "Dan's old phone", found: "Dan's number is still registered as his second factor, and Dan still has the phone. MFA approval codes going to an ex-employee's pocket. Offboarding must clean up sign-in methods too, not just the password." },
  { ic: icon('users'), nm: '23 group memberships', found: "Dan is still in Finance-Approvers, VPN-Users and 21 more. Groups grant access: disable the account but keep the groups, and a single re-enable brings everything back at once." }
];
let foundCount = 0;
function L1(){
  mood(''); foundCount = 0;
  show(`
    ${Lab.badge('Level 1 · the ghost hunt','search')}
    <h2>Six things hiding in your own admin centre</h2>
    ${say('your guide', `This is a mock-up of your admin console. Six problems, hiding in plain sight. Click each one to expose it; every ghost teaches a rule. (+10 each)`, 'tip')}
    <div class="grid grid--auto">
      ${objects.map((o, i) => `
        <button class="tile" id="obj${i}" onclick="L.discover(${i},event)">${o.ic}<span class="nm">${o.nm}</span></button>`).join('')}
    </div>
    <div class="inv" id="inv">${icon('search')} <b>Ghosts found: 0/6</b> — click to inspect.</div>
    <div class="spacer"></div>
    <button class="btn blue" id="l1next" style="display:none" onclick="L.goto(2)">${icon('arrow-right')}Ghosts logged. Now do joiners right</button>
  `);
}
function discover(i, e){
  const el = $('obj' + i); if (!el || el.classList.contains('found')) return;
  el.classList.add('found'); el.insertAdjacentHTML('beforeend', `<span class="ok-mark">${icon('check')}</span>`);
  foundCount++; scoreAt(10, e);
  Lab.patch('#inv', `${icon('search')} <b>Ghost ${foundCount}/${objects.length}:</b> ${objects[i].found}`);
  if (foundCount === objects.length) {
    Lab.patch('#inv', `${icon('check-circle')} <b>All six found.</b> Notice that none of these were «hacks». They were all simply nobody's job. The fix is not another security tool; it is a <b>lifecycle</b>: every account gets a beginning, a middle and a guaranteed end. Next stop: the beginning.`);
    const n = $('l1next'); if (n) n.style.display = 'inline-flex';
  }
}

/* ---------------- L2 : joiner day ---------------- */
const decisions = [
  { q: "How does Maria's account get created?", opts: [
    { t: 'Provisioned from the HR record', s: 'HR enters Maria once; Entra creates the account automatically, with a start date.', v: 'good', pts: 10,
      fb: 'HR-driven provisioning: the HR system is the single source of truth. The account exists before day one, name spelled right, department set, and the same wire later handles her move and, one day, her exit. One entry, whole lifecycle. (+10)' },
    { t: 'IT creates it by hand from the welcome email', s: 'Works every time. Well, most times.', v: 'meh', pts: 5,
      fb: "Works for 10 people. Then someone is on holiday, a surname gets a typo, and a new starter spends day one watching other people work. Manual means «someone must remember», and Level 1 showed you what remembering looks like. (+5)" },
    { t: "She can share Bogdan's login the first week", s: 'Team players share, right?', v: 'bad', pts: 0,
      fb: 'Shared logins destroy accountability forever: every action is now «Bogdan, or Maria, or whoever». And that password is known by two people for the rest of time. Auditors have a special face for this one. (0)' }
  ]},
  { q: 'What access does Maria get?', opts: [
    { t: 'The «Sales starter pack»: role-based groups', s: 'What a salesperson needs, defined once, granted in one move.', v: 'good', pts: 10,
      fb: 'Role-based access: decide what the role needs once, put it in groups, and every joiner, mover and leaver becomes a clean group operation. Auditable, repeatable, boring: the good kind of boring. (+10)' },
    { t: 'Copy whatever her colleague Radu has', s: 'He does the same job, so, same access?', v: 'bad', pts: 0,
      fb: 'Radu has six years of accumulated crust: a project from 2021, an admin right «for that one migration», two mystery groups. Copy-the-last-person duplicates every mistake ever made; it is the number one way access sprawl breeds. (0)' },
    { t: 'Grant broadly now, trim it later', s: 'Better too much than a ticket, no?', v: 'meh', pts: 5,
      fb: '«Later» is doing a lot of work in that sentence. Access is easy to grant and painful to remove; nobody ever files a ticket saying «I have too much access». Start minimal; adding is the cheap direction. (+5)' }
  ]},
  { q: 'How does she get her Microsoft 365 licence?', opts: [
    { t: 'The Sales group carries the licence', s: 'Join the group, get the licence. Leave it, give it back.', v: 'good', pts: 10,
      fb: 'Group-based licensing: joiners get licensed the second they land in the group, and leavers hand the seat back automatically when they are removed. No spreadsheet, no paying for ghosts. (+10)' },
    { t: 'Assign it manually, track it in a spreadsheet', s: 'The spreadsheet is very colour-coded.', v: 'meh', pts: 5,
      fb: 'The spreadsheet starts lying within a month, and every ghost from Level 1 was probably still holding a paid licence. Manual licensing is how you pay monthly rent for people who left. (+5)' },
    { t: 'Buy the biggest licence for everyone', s: 'Simplest possible policy.', v: 'bad', pts: 0,
      fb: 'Simple, yes, and you are now paying premium per month for warehouse staff who need email and one Teams channel. Licence right-sizing usually funds the entire identity project by itself. (0)' }
  ]},
  { q: 'MFA: when does Maria set it up?', opts: [
    { t: 'Day one, at the welcome desk, with a Temporary Access Pass', s: 'A short-lived pass to register her authenticator before lunch.', v: 'good', pts: 10,
      fb: 'A Temporary Access Pass is a time-limited code that lets Maria enrol her authenticator app on day one: no password-only window, no «I will do it later». The account is born protected. (+10)' },
    { t: 'Email her the instructions; she will register when prompted', s: 'People read onboarding emails. Eventually.', v: 'meh', pts: 5,
      fb: 'That leaves a password-only account for days or weeks, and attackers specifically hunt the gap between «account created» and «MFA registered». Fresh accounts are the soft ones. (+5)' },
    { t: 'Skip MFA the first month; less friction for the newcomer', s: 'Let her settle in first.', v: 'bad', pts: 0,
      fb: 'Backwards: a brand-new account with a just-issued password is at its most vulnerable in week one. Day one is not too early for MFA; it is the last safe moment. (0)' }
  ]},
  { q: 'And the basics: email lists, intranet, the right Teams?', opts: [
    { t: 'Automatic: «department = Sales» sorts her in by itself', s: 'Dynamic groups read her profile and do the rest.', v: 'good', pts: 10,
      fb: 'Dynamic groups run on rules over attributes: department, country, job title. HR set «Sales», so the Sales groups claim her automatically. And when that attribute ever changes, the access follows. Remember this one. (+10)' },

    ex: 'Guests never expire on their own: someone invited them once, and the invitation outlived the relationship. Entra access reviews can ask each site or team owner «still yours?» periodically and automatically remove guests who are denied, or whose owner never answers. Set once, cleans forever.' },
  { t: '«svc-invoice runs the invoicing job. Its password is from 2019 and it is pasted in three scripts»', who: 'The audit finding',
    opts: [
      { o: 'Rotate it to a new password and paste that into the scripts', ok: false },

    ],
    ex: 'Passwords in scripts get copied, committed to repositories and forgotten. A managed identity means the Azure workload authenticates as itself: nothing to rotate, nothing to paste, nothing for an attacker to find. Where a managed identity cannot reach, the fallback is a vaulted secret with automatic rotation, never a string in a script.' },
  { t: "«We have 340 Teams. 'Project Phoenix 2021' has 9 owners and its last message is from 2022»", who: 'The Teams jungle',
    opts: [

function solve(i, j, e){
  const tk = tickets[i], card = $('tk' + i), b = $('tk' + i + 'o' + j);
  if (!card || !b || card.classList.contains('done')) return;
  if (tk.opts[j].ok) {
    card.classList.add('done');
    tk.opts.forEach((op, k) => { const x = $('tk' + i + 'o' + k); if (!x) return; x.disabled = true; if (k === j) x.classList.add('good'); });
    scoreAt(firstTry[i] === undefined ? 10 : 5, e);
    const v = $('tk' + i + 'v'); if (v) { v.innerHTML = say('solved', tk.ex, 'tip'); v.classList.add('show'); }
    tdone++;
    if (tdone === tickets.length) later(() => Lab.finale({ into: '#finale', heading: 'The door revolves, and closes.' }), 400);
  } else {
    firstTry[i] = false; b.classList.add('bad'); b.disabled = true;
    later(() => b.classList.remove('bad'), 450);
  }
}
