<div class="nojs" id="nojs"><div class="box"><p class="badge">shautech labs</p><h2>This simulator needs JavaScript.</h2><p class="muted">It runs entirely in your browser, nothing is sent anywhere. Enable JavaScript, or <a href="index.html" style="color:var(--accent2)">go back to all labs</a>.</p></div></div>

<script>
/* © 2026 shautech. Open Secrets (Microsoft 365 Copilot readiness) — game logic. */
(function(){
'use strict';
const { icon, say, avatar, sev, scoreAt, addScore, show, goto, toast, mood, util } = Lab;
const { esc, pick, $ } = util;
const D = Lab.draw, C = Lab.colors;

const reveal = id => { const el = document.getElementById(id); if (el) el.style.display = 'inline-flex'; };
const setFixed = r => { if (Lab.scene) Lab.scene.set('fixed', Math.max(0, Math.min(1, r))); };

/* ---------------- ambient scene ----------------
   A Copilot "query" hub in the centre sends thin beams to document nodes around it.
   Overshared documents are red; they turn mint as the player fixes them (s.fixed 0..1). */
const N_DOCS = 12;
const scene = {
  state: { level: 0, mood: '', fixed: 0 },
  init(s, W, H) {
    const cx = W * 0.5, cy = H * 0.53;
    const rx = Math.min(W * 0.40, 540), ry = Math.min(H * 0.33, 300);
    s.hub = [cx, cy];
    s.docs = [];
    let riskRank = 0;
    for (let i = 0; i < N_DOCS; i++) {
      const a = -Math.PI / 2 + (i / N_DOCS) * Math.PI * 2 + 0.17;
      const wob = 0.86 + 0.14 * ((i * 7) % 3) / 2;
      const x = cx + Math.cos(a) * rx * wob, y = cy + Math.sin(a) * ry * wob;
      const risky = i % 3 !== 1;                          // 8 of 12 are overshared
      const mx = (cx + x) / 2, my = (cy + y) / 2;
      const nx = -(y - cy), ny = (x - cx);                // perpendicular for a gentle bow
      const len = Math.hypot(nx, ny) || 1, k = (i % 2 ? 1 : -1) * 0.18;
      const c1 = [mx + nx / len * len * k, my + ny / len * len * k];
      s.docs.push({ x, y, risky, rank: risky ? riskRank++ : -1, pts: D.curve(s.hub, c1, c1, [x, y], 36), glyph: i % 4 === 0 ? 'mail' : (i % 4 === 2 ? 'user' : 'file') });
    }
    s.riskyTotal = riskRank;
    s.pk = [];
    const n = Math.max(18, Math.min(34, Math.round(W / 40)));
    for (let i = 0; i < n; i++) s.pk.push({ d: Math.floor(Math.random() * N_DOCS), t: Math.random(), v: 0.10 + Math.random() * 0.12, out: i % 2 === 0, s: 2.2 + Math.random() * 1.4 });
  },
  onChange(s, k, v) { if (k === 'mood' && v === 'calm') s.fixed = 1; },
  draw(ctx, s, W, H, t, dt) {
    if (!s.docs) return;
    D.grid(ctx, W, H, 64, 'rgba(255,255,255,.025)');
    const fixedN = Math.round(s.fixed * s.riskyTotal);
    const speed = s.level === 5 ? 1.9 : (s.mood === 'night' ? 0.55 : 1);
    const docCol = d => d.risky ? (d.rank < fixedN ? C.mint : C.red) : C.accent;
    const [hx, hy] = s.hub;

    /* beams */
    ctx.save(); ctx.lineDashOffset = -t * 18;
    s.docs.forEach(d => {
      const col = docCol(d);
      D.path(ctx, d.pts, Lab.rgba(col, d.risky && d.rank >= fixedN ? .20 : .13), 1, [3, 7]);
    });
    ctx.restore();

    /* document nodes */
    s.docs.forEach((d, i) => {
      const col = docCol(d);
      const pulse = 0.5 + 0.5 * Math.sin(t * 1.6 + i);
      ctx.save(); ctx.globalAlpha = .10 + pulse * .06; ctx.fillStyle = col; D.rr(ctx, d.x - 16, d.y - 16, 32, 32, 9); ctx.fill(); ctx.restore();
      ctx.save(); ctx.globalAlpha = .4; ctx.strokeStyle = Lab.rgba(col, .55); ctx.lineWidth = 1; D.rr(ctx, d.x - 16, d.y - 16, 32, 32, 9); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.globalAlpha = .6; D.glyph(ctx, d.glyph, d.x, d.y, 6, Lab.rgba(col, .9)); ctx.restore();
      if (d.risky && d.rank >= fixedN) { ctx.save(); ctx.globalAlpha = .55 + pulse * .3; D.glowDot(ctx, d.x + 13, d.y - 13, 1.6, Lab.rgba(C.red, .9)); ctx.restore(); }
    });

    /* packets: violet queries outbound, answers inbound coloured by document state */
    s.pk.forEach(p => {
      p.t += p.v * dt * speed;
      if (p.t >= 1) { p.t = 0; p.out = !p.out; p.d = Math.floor(Math.random() * N_DOCS); }
      const d = s.docs[p.d];
      const pos = D.posOn(d.pts, p.out ? p.t : 1 - p.t);
      const col = p.out ? C.violet : docCol(d);
      ctx.save(); ctx.globalAlpha = .75;
      if (p.out) D.glowDot(ctx, pos[0], pos[1], 1.4, Lab.rgba(col, .9));
      else D.glyph(ctx, 'bit', pos[0], pos[1], p.s, Lab.rgba(col, .9));
      ctx.restore();
    });

    /* Copilot hub */
    const spin = t * 0.35;
    ctx.save();
    ctx.globalAlpha = .12; ctx.fillStyle = C.violet; ctx.beginPath(); ctx.arc(hx, hy, 34, 0, 7); ctx.fill();
    ctx.globalAlpha = .45; ctx.strokeStyle = Lab.rgba(C.violet, .7); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(hx, hy, 34, 0, 7); ctx.stroke();
    ctx.setLineDash([2, 6]); ctx.lineDashOffset = -t * 12; ctx.globalAlpha = .35; ctx.beginPath(); ctx.arc(hx, hy, 46, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.translate(hx, hy); ctx.rotate(spin);
    ctx.globalAlpha = .85; ctx.strokeStyle = Lab.rgba(C.violet, .95); ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); }
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 6, Math.sin(a) * 6); }
    ctx.stroke();
    ctx.restore();
    D.text(ctx, 'COPILOT', hx, hy + 64, { color: 'rgba(169,177,192,.55)', size: 10 });
    const left = s.riskyTotal - fixedN;
    D.text(ctx, left ? left + ' OVERSHARED' : 'TENANT READY', hx, hy + 78, { color: left ? Lab.rgba(C.red, .6) : Lab.rgba(C.mint, .7), size: 9, weight: 500 });
  }
};

/* ---------------- shared state / timers ---------------- */
const A = { timer: null, live: false, flagged: 0, slipped: 0, eventFired: false, lane: 0 };
const LANES = () => innerWidth < 640 ? [33, 61] : [30, 50, 70];   // % from the arena top; one item per lane
function stopArcade() { if (A.timer) { clearInterval(A.timer); A.timer = null; } A.live = false; }
function enter(m) { stopArcade(); mood(m || ''); }

/* ================= L0 : THE DEMO SHOCK ================= */
function L0() {
  enter();
  show(`
    ${Lab.badge('Level 0 · the demo shock', 'play')}
    <h1>The boss wants <em>Copilot</em>.<br>By Monday.</h1>
    ${say('the boss', 'I saw a demo at a conference. You type <i>“summarise this contract”</i> and it just does it. We are buying Microsoft 365 Copilot for everyone. Switch it on by Monday, yes? Great meeting.')}
    <div class="panel chat" aria-label="Copilot chat, recorded in the demo tenant">
      <div class="chat__bar">${icon('sparkles')} Copilot · demo tenant · recorded on stage</div>
      <div class="msg msg--user">${avatar('DM', 200)}<div class="bubble-tx">Summarise everything about salaries.</div></div>
      <div class="msg msg--ai"><span class="avatar avatar--ai" aria-hidden="true">${icon('sparkles')}</span>
        <div class="bubble-tx">Certainly. Based on <b>salaries_2026.xlsx</b> on the HR site (shared with <b>Everyone</b>), here are all 48 salaries, sorted by amount:
          <div class="sheet"><table>
            <tr><th>Name</th><th>Role</th><th>Annual</th></tr>
            <tr class="bad"><td>M. Ionescu</td><td>Managing director</td><td>184,000</td></tr>
            <tr class="bad"><td>A. Weber</td><td>Head of sales</td><td>121,500</td></tr>
            <tr class="bad"><td>R. Popescu</td><td>Finance lead</td><td>98,200</td></tr>
            <tr><td colspan="3" class="small">… 45 more rows</td></tr>
          </table></div>
          <span class="src">${icon('file-lock')} 1 source · HR-Salaries / salaries_2026.xlsx · Everyone except external users</span>
        </div>
      </div>
    </div>
    ${say('your guide', 'That is the whole story of this mission. Copilot did not hack anything: it <b>respects permissions perfectly</b>. It searches Microsoft Graph with the permissions of whoever is asking. The problem is that those permissions were wrong for years and nobody noticed, because no human had time to read 12,000 files. Copilot has time. <b>Copilot does not leak data. It finds what was already leaked.</b> Let us get PixelSoft ready for it. Properly.', 'tip')}
    <div class="spacer"></div>
    <button class="btn blue" onclick="L.goto(1)">${icon('arrow-right')}Challenge accepted</button>
  `);
}

/* ================= L1 : THE OVERSHARING HUNT ================= */
const objects = [
  { ic: 'sheet', nm: 'The HR site', found: '“HR-Salaries” has been shared with <b>Everyone except external users</b> since 2019. Copilot would happily summarise it for the intern. The SharePoint data access governance report would have listed this site on page one.' },
  { ic: 'link', nm: '“Anyone” links', found: '83 files carry anonymous <b>“Anyone with the link”</b> access, including the price list your competitor would love to read. Anyone links are not indexed for other users, but every forwarded link is a door with no lock.' },
  { ic: 'user-x', nm: 'The ghost accounts', found: '3 ex-employees still have <b>enabled accounts</b> with access to everything. One of them works for a competitor now. Their Copilot would answer from your tenant.' },
  { ic: 'folder', nm: 'The “final_FINAL” chaos', found: '9 copies of the same contract in 9 places, each with different permissions. Which one would Copilot quote? Exactly. Nobody knows, and the oldest copy is the one shared the widest.' },
  { ic: 'hard-drive', nm: 'The 2016 archive site', found: 'An old project site, open to everyone, full of scanned IDs and contracts. Nobody remembered it exists. Copilot never forgets; an inactive-site policy would have flagged it years ago.' },
  { ic: 'users', nm: 'External sharing', found: '37 folders still shared with former vendors, an old accountant and one mystery Gmail guest nobody recognises. Guests do not get Copilot, but your people can still be asked to “summarise what is in the vendor folder”.' }
];
let foundCount = 0;
function L1() {
  enter(); foundCount = 0;
  show(`
    ${Lab.badge('Level 1 · discover', 'search')}
    <h2>Find what <em>Copilot</em> would find</h2>
    ${say('your guide', 'Before switching Copilot on, we ask one question: <b>what can people already see that they should not?</b> That is exactly what Copilot will surface, politely and instantly. Walk the tenant: click each corner. (+10 per finding)', 'tip')}
    <div class="grid grid--auto">
      ${objects.map((o, i) => `
        <button class="tile" id="obj${i}" onclick="L.discover(${i},event)">${icon(o.ic)}<span class="nm">${o.nm}</span></button>`).join('')}
    </div>
    <div class="inv" id="inv"><b>Findings:</b> none yet. Start clicking.</div>
    <div class="spacer"></div>
    <button class="btn blue" id="l1next" style="display:none" onclick="L.goto(2)">${icon('arrow-right')}Oversharing catalogued. Now decide</button>
  `);
}
function discover(i, e) {
  const el = document.getElementById('obj' + i);
  if (!el || el.classList.contains('bad')) return;
  el.classList.add('bad');
  el.insertAdjacentHTML('beforeend', `<span class="ok-mark" style="color:var(--red)">${icon('flag')}</span>`);
  foundCount++;
  scoreAt(10, e);
  Lab.patch('#inv', `<b>Finding ${foundCount}/${objects.length}:</b> ${objects[i].found}`);
  if (foundCount === objects.length) {
    Lab.patch('#inv', `<b>All 6 found.</b> Scary? A little. Normal? Completely: every tenant older than a year looks like this. The difference between companies is not whether this exists; it is whether someone looked before turning the AI loose on it.`);
    reveal('l1next');
    toast('Discovery complete', 'check-circle');
  }
}

/* ================= L2 : DECISIONS ================= */
const decisions = [
  { q: '12,000 files, one you. Where do we start cleaning?',
    opts: [
      { t: 'Where it hurts most: HR, finance, contracts', s: 'Protect the crown jewels first, then work outward.', v: 'good', pts: 10,
        fb: 'Right. Risk-first beats alphabetical. The party menu being public is fine; the salary sheet being public is a crisis. Rank by damage, not by folder name. (+10)' },
      { t: 'All 12,000 files, one by one, A to Z', s: 'Thorough. Very, very thorough.', v: 'meh', pts: 5,
        fb: 'Admirably complete. You would finish around retirement. Perfection is the enemy of Monday: prioritise, automate, iterate. (+5)' },
      { t: 'Nowhere. Does Copilot not have filters?', s: 'Surely the AI knows what is sensitive.', v: 'bad', pts: 0,
        fb: 'Copilot’s “filter” is your permissions. If those say the intern can read salaries, Copilot agrees. There is no magic layer that fixes years of oversharing. (0)' }
    ] },
  { q: 'Who decides what counts as “sensitive”?',
    opts: [
      { t: 'The data owners: each department, with IT enabling', s: 'HR knows HR data. Finance knows finance data.', v: 'good', pts: 10,
        fb: 'Exactly. IT can find files; only their owners know which ones can hurt. IT builds the labels and the tooling, departments make the calls. (+10)' },
      { t: 'IT decides everything, alone, at night', s: 'Fewer meetings, more spreadsheets.', v: 'meh', pts: 5,
        fb: 'Faster, but IT guessing what is sensitive in legal contracts ends badly in both directions: locked-out lawyers or public payslips. (+5)' },
      { t: 'Everything is secret. Lock it all down', s: 'Cannot leak what nobody can open.', v: 'bad', pts: 0,
        fb: 'Also cannot work when nobody can open anything. Total lockdown lasts about four hours before the exceptions start, and the exceptions are worse than the original mess. (0)' }
    ] },
  { q: 'The boss still wants Copilot on Monday. You say…',
    opts: [
      { t: '“Monday: yes, for a pilot group, while we clean”', s: 'Ten people now, everyone in waves after. Restricted SharePoint Search on as a seatbelt.', v: 'good', pts: 10,
        fb: 'The consultant’s answer: the boss hears “yes”, you get a controlled rollout. The pilot finds problems while the blast radius is ten curious people, not the whole company. And while cleanup runs, Restricted SharePoint Search limits Copilot’s org-wide results to a curated allow-list of sites (up to 100). A seatbelt, not a destination. (+10)' },
      { t: '“Sure, everyone Monday, fingers crossed”', s: 'What is the worst that could happen?', v: 'bad', pts: 0,
        fb: 'You have seen the HR site. The worst that could happen is a summarised salary sheet in the all-hands chat by 9:15. (0)' },
      { t: '“Never. AI is too dangerous for us”', s: 'Just say no.', v: 'meh', pts: 5,
        fb: 'Caution is healthy, but “never” does not stop AI. It sends people to free chatbots with company data and zero governance. Shadow AI is worse than governed AI. (+5)' }
    ] }
];
const tools = [
  { ic: 'shield-check', t: 'The built-in reports and Purview', s: 'SharePoint data access governance reports, Entra access reviews, Purview sensitivity labels and DLP. Already in the tenant.',
    fb: 'The honest default: most of what you need for readiness is already licensed and switched off. The oversharing reports find the problem, Purview labels what matters, access reviews keep it clean. (+10)' },
  { ic: 'chart', t: 'A dedicated governance tool', s: 'Purpose-built oversharing scanners and cleanup automation.',
    fb: 'Great at scale: when it is 12 sites it is a weekend, when it is 1,200 sites you want automation with dashboards and scheduled re-scans. (+10)' },
  { ic: 'briefcase', t: 'A partner-led readiness assessment', s: 'Someone who has done this before runs the discovery with you.',
    fb: 'Speed and pattern-matching: a partner has seen fifty tenants’ worth of skeletons and knows exactly which closets to open first. Pairs nicely with either toolset. (+10)' }
];
let di = 0;
function L2() {
  enter(); di = 0;
  show(`
    ${Lab.badge('Level 2 · decide', 'list-check')}
    <h2>The <em>readiness</em> plan</h2>
    ${say('your guide', 'Now we know what is exposed. Three calls to make before anyone touches a rollout button, then pick your toolkit.', 'tip')}
    <div id="dzone"></div>
  `);
  renderDecision();
}
function renderDecision() {
  const d = decisions[di];
  Lab.patch('#dzone', `
    <h3 style="margin-top:14px">Decision ${di + 1}/${decisions.length}: ${d.q}</h3>

  `);
  A.timer = setInterval(spawnPrompt, Lab.reduced ? 1600 : 1300);
  spawnPrompt();
}
function spawnPrompt() {
  const arena = document.getElementById('arena');
  if (!arena || !arena.isConnected) { stopArcade(); return; }
  if (!A.live) return;
  const lanes = LANES();
  if (arena.querySelectorAll('.item.live').length >= lanes.length) return;
  const risky = Math.random() < 0.65;
  const p = risky ? pick(RISKY) : pick(SAFE);
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'item item--prompt live';
  el.setAttribute('aria-label', (risky ? 'Risky prompt: ' : 'Prompt: ') + p.t);
  el.innerHTML = icon(p.ic) + '<span>' + esc(p.t) + '</span>';
  A.lane = (A.lane + 1) % lanes.length;
  el.style.top = lanes[A.lane] + '%';
  const retire = () => { if (!el.isConnected || !el.classList.contains('live')) return; el.remove(); if (risky) { A.slipped++; updateBar(); } };
  if (Lab.reduced) {
    el.style.left = (14 + Math.random() * 46) + '%';
    setTimeout(retire, 6500);
  } else {
    const dur = 7.5 + Math.random() * 2.5;
    el.style.left = '-250px';
    el.style.transition = `left ${dur}s linear`;
    requestAnimationFrame(() => requestAnimationFrame(() => { if (el.isConnected) el.style.left = 'calc(100% + 20px)'; }));
    el.addEventListener('transitionend', retire);
  }
  el.addEventListener('click', e => hitPrompt(el, risky, e));
  arena.appendChild(el);
}
function freeze(el) { const left = getComputedStyle(el).left; el.style.transition = 'none'; el.style.left = left; }
function hitPrompt(el, risky, e) {
  if (!A.live || !el.classList.contains('live')) return;
  el.classList.remove('live');
  freeze(el);
  if (risky) {
    el.classList.add('bad', 'pop');
    scoreAt(5, e);
    A.flagged++; updateBar();
    setTimeout(() => el.remove(), 400);
    if (!A.eventFired && A.flagged === Math.floor(TARGET / 2)) promptEvent();
    if (A.flagged >= TARGET) endPrompts();
  } else {
    el.classList.add('warn');
    el.innerHTML = icon('check') + '<span>Normal work. That is what Copilot is for.</span>';
    setTimeout(() => { if (el.isConnected) { el.classList.add('sink'); setTimeout(() => el.remove(), 500); } }, 1100);
  }
}
function updateBar() {
  const f = document.getElementById('bigFill'), l = document.getElementById('bigLabel');
  if (f) f.style.width = Math.min(100, Math.round(A.flagged / TARGET * 100)) + '%';
  if (l) l.textContent = `${A.flagged} / ${TARGET} blocked` + (A.slipped ? ` · ${A.slipped} slipped through` : '');
}
function clearLive() {
  document.querySelectorAll('#arena .item.live').forEach(c => { c.classList.remove('live'); freeze(c); c.classList.add('sink'); setTimeout(() => c.remove(), 500); });
}
function promptEvent() {

}
function endPrompts() {
  stopArcade();
  document.querySelectorAll('#arena .item').forEach(c => c.remove());
  const l = document.getElementById('bigLabel'); if (l) l.textContent = 'pre-flight passed' + (A.slipped ? ` · ${A.slipped} slipped through, review them in the audit log` : '');
