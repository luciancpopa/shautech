<div class="nojs" id="nojs"><div class="box"><p class="badge">shautech labs</p><h2>This simulator needs JavaScript.</h2><p class="muted">It runs entirely in your browser, nothing is sent anywhere. Enable JavaScript, or <a href="index.html" style="color:var(--accent2)">go back to all labs</a>.</p></div></div>

<script>
/* © 2026 shautech. The Licence Hunt — game logic. */
(function(){
'use strict';
const { icon, say, btn, avatar, sev, scoreAt, addScore, show, goto, toast, mood, util } = Lab;
const { esc, pick, shuffle, clamp } = util;
const $ = s => document.querySelector(s);

/* ---------------- shared state ---------------- */
const SAVINGS_MAX = 120000;          // meter ceiling, €/year
let saved = 0;                        // € per year found so far
let timers = [];                      // every setTimeout/setInterval id of the current level
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
const every = (fn, ms) => { const id = setInterval(fn, ms); timers.push(id); return id; };
function clearTimers(){ timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers = []; }
const eur = n => '€' + Math.round(n).toLocaleString('en-GB');

function addSavings(n){
  saved += n;
  if (Lab.scene) Lab.scene.set('saved', clamp(saved / SAVINGS_MAX, 0, 1));
  const num = $('#savNum'), bar = $('#savBar');
  if (num) num.innerHTML = `${eur(saved)}<small> / year</small>`;
  if (bar) bar.style.width = (clamp(saved / SAVINGS_MAX, 0, 1) * 100) + '%';
}
function savingsBox(label){
  return `
    <div class="savings" aria-live="polite">
      <div><div class="lbl">${esc(label || 'Savings found')}</div><div class="score-big" id="savNum">${eur(saved)}<small> / year</small></div></div>
      <div class="right"><div class="lbl">Against a ${eur(SAVINGS_MAX)} stretch target</div><div class="meter"><i id="savBar" style="width:${clamp(saved / SAVINGS_MAX, 0, 1) * 100}%"></i></div></div>
    </div>`;
}

/* ---------------- ambient scene: the invoice ---------------- */
const scene = {
  state: { level: 0, mood: '', saved: 0 },
  init(s, W, H) {
    s.bars = []; const n = 12;
    for (let i = 0; i < n; i++) s.bars.push({ h: 0.12 + (i / (n - 1)) * 0.16 + Math.sin(i * 1.7) * 0.015 });
    s.cards = [];
    for (let i = 0; i < 22; i++) s.cards.push({ x: Math.random() * W, y: Math.random() * H, v: 8 + Math.random() * 14, w: 14 + Math.random() * 10, a: .12 + Math.random() * .16, ph: Math.random() * 6.3 });
  },
  draw(ctx, s, W, H, t, dt) {
    const C = Lab.colors, D = Lab.draw;
    D.grid(ctx, W, H, 56, 'rgba(255,255,255,.028)');
    // floating licence cards drifting up
    for (const c of s.cards) {
      c.y -= c.v * dt; c.x += Math.sin(t * .6 + c.ph) * 6 * dt;
      if (c.y < -30) { c.y = H + 20; c.x = Math.random() * W; }
      const col = s.level === 6 ? C.violet : C.accent2;
      ctx.save(); ctx.globalAlpha = c.a; ctx.strokeStyle = col; ctx.lineWidth = 1;
      D.rr(ctx, c.x, c.y, c.w, c.w * .68, 3); ctx.stroke();
      ctx.globalAlpha = c.a * 1.4; ctx.fillStyle = col; ctx.font = `700 ${Math.round(c.w * .5)}px "JetBrains Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('€', c.x + c.w / 2, c.y + c.w * .36); ctx.restore();
    }
    // invoice bars: 12 months across the bottom
    const n = s.bars.length, pad = Math.max(24, W * .06), gap = 6, bw = (W - pad * 2 - gap * (n - 1)) / n, base = H - 34;
    const sv = s.saved || 0;
    ctx.save();
    for (let i = 0; i < n; i++) {
      const w = clamp(sv * 15 - (n - 1 - i), 0, 1);           // right-most bars react first
      const h = s.bars[i].h * H * (1 - .55 * w);
      const x = pad + i * (bw + gap);
      const col = w > .5 ? C.mint : C.accent;
      ctx.globalAlpha = .07 + .05 * w; ctx.fillStyle = col; D.rr(ctx, x, base - h, bw, h, 4); ctx.fill();
      ctx.globalAlpha = .22 + .15 * w; ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.globalAlpha = .3; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.moveTo(pad, base + .5); ctx.lineTo(W - pad, base + .5); ctx.stroke();
    ctx.restore();
    D.text(ctx, 'MICROSOFT INVOICE · 12 MONTHS', pad, base + 20, { align: 'left', color: 'rgba(169,177,192,.35)', size: 9 });
    if (sv > 0) D.text(ctx, '-' + Math.round(sv * 55) + '% ON THE RIGHT', W - pad, base + 20, { align: 'right', color: Lab.rgba(C.mint, .45), size: 9 });
    if (s.level === 6) { ctx.save(); ctx.globalAlpha = .06; ctx.fillStyle = C.violet; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  }
};

/* ---------------- L0 briefing ---------------- */
function L0(){
  clearTimers(); mood('');
  show(`
    ${Lab.badge('Level 0 · briefing','play')}
    <h1>The invoice went up <em>30 %</em>.<br>Headcount did not.</h1>
    ${say('the cfo', `Microsoft, annual renewal: <b>€248,400</b>. Last year it was €191,000. We have the same 240 people we had then. Either Microsoft got 30 % better or we are paying for air. Find out which, and bring me a number.`)}
    ${say('your guide', `Nobody did anything wrong on purpose. Licences are bought in a hurry, assigned "just in case" and never looked at again, and each one bills quietly every month. We are going to open the tenant, count what is actually used, and give every euro a reason to exist. Running total of what you find is at the bottom of every level.`, 'tip')}
    <div class="defs">
      <div class="def">${icon('license')}<div><b>Licence vs subscription</b>The subscription is the contract (how many seats, for how long). A licence is one seat assigned to one person.</div></div>
      <div class="def">${icon('user-x')}<div><b>Assigned vs unassigned</b>An unassigned licence is a paid seat sitting on the shelf. You pay for it anyway.</div></div>
      <div class="def">${icon('layers')}<div><b>E3 vs Business Premium</b>Nearly the same toolbox. Premium is for companies under 300 people and costs about 40 % less per seat.</div></div>
      <div class="def">${icon('calendar')}<div><b>Reserved instances</b>Promise Azure you will run a server for 1 or 3 years and the hourly price drops by up to 60 %.</div></div>
      <div class="def">${icon('hard-drive')}<div><b>Orphaned resources</b>Cloud things nobody uses any more (a disk, a test server, an IP) that still bill because nobody deleted them.</div></div>
    </div>
    ${savingsBox('Savings found so far')}
    <div class="spacer"></div>
    <button class="btn blue" onclick="L.goto(1)">${icon('arrow-right')}Open the tenant</button>
  `);
}

/* ---------------- L1 discovery ---------------- */
const FINDS = [
  { ic:'license', nm:'42 unassigned E3 licences', qty:'42 seats', unit:'€34 /mo', e:42*34*12,
    x:'Bought for a hiring wave that never fully happened. 42 seats × €34 × 12 months sit on the shelf. Rule: unassigned seats are reviewed every month and reduced at renewal.' },
  { ic:'user-x', nm:'9 leavers still licensed', qty:'9 people', unit:'€34 /mo', e:9*34*12,
    x:'People who left between March and August. HR told nobody in IT, or IT kept the licence "so the mailbox stays". A leaver is unlicensed on day one; the mailbox is kept another way (level 2).' },
  { ic:'monitor', nm:'E5 on the reception kiosk', qty:'1 device', unit:'€55 /mo', e:55*12,
    x:'The lobby screen that shows the visitor list runs on the most expensive licence Microsoft sells. Someone cloned an admin account to set it up. A shared device needs a tiny licence or none at all.' },
  { ic:'file-text', nm:'Visio + Project on 12 non-users', qty:'12 people', unit:'€41 /mo', e:12*41*12,
    x:'Twelve people hold both Visio and Project and have not opened either in 180 days. They were given "the full set" on day one. Usage reports exist for exactly this question.' },
  { ic:'chart', nm:'Power BI Pro for 60 viewers', qty:'60 people', unit:'€9 /mo', e:60*9*12,
    x:'Sixty people licensed to build reports who only ever receive one PDF a month. Nobody has viewed a live report in 90 days. The 6 people who build reports need Pro; the rest need the PDF.' },
  { ic:'server', nm:'3 Azure VMs from a 2024 test', qty:'3 VMs · 24/7', unit:'€140 /mo each', e:3*140*12,
    x:'A proof of concept from 2024 is still running around the clock. The project ended; the servers did not get the memo. Every test resource gets an owner, an end date and an auto-shutdown schedule.' },
  { ic:'hard-drive', nm:'Unattached managed disk', qty:'512 GB premium', unit:'€70 /mo', e:70*12,
    x:'Someone deleted a VM and left its disk behind. Azure bills the disk whether or not anything reads it. Orphaned disks are the classic cloud leak: silent, small, permanent.' },
  { ic:'database', nm:'2 TB of unused storage', qty:'2 TB hot tier', unit:'€40 /mo', e:40*12,
    x:'Two terabytes of old file-server backups kept in the most expensive storage tier, untouched since migration. Move cold data to archive tier or delete what the retention policy allows.' }
];
let found = {};
function L1(){
  clearTimers(); mood(''); found = {};
  show(`
    ${Lab.badge('Level 1 · discovery','search')}
    <h2>Eight things hiding in the admin centre</h2>
    ${say('your guide', `This is the licence and Azure cost view, lightly simplified. Eight lines bill every month without earning their keep. Click each one to inspect it; every find adds to the savings total and teaches a rule. <b>+10 points each.</b>`, 'tip')}
    <div class="grid grid--auto">
      ${FINDS.map((f,i)=>`<button class="tile" id="tile${i}" onclick="L.find(${i},event)" aria-label="${esc(f.nm)}">${icon(f.ic)}<span class="nm">${esc(f.nm)}</span><span class="eur" id="tileE${i}">tap to inspect</span></button>`).join('')}
    </div>
    <div id="finding"></div>
    <div class="sheet"><table aria-label="Licence inventory">
      <thead><tr><th>Item</th><th>Quantity</th><th>Unit price</th><th>Waste / year</th><th>Status</th></tr></thead>
      <tbody>${FINDS.map((f,i)=>`<tr id="row${i}"><td>${esc(f.nm)}</td><td>${esc(f.qty)}</td><td>${esc(f.unit)}</td><td id="rowE${i}">—</td><td id="rowS${i}">${sev('muted','not audited')}</td></tr>`).join('')}</tbody>
    </table></div>
    ${savingsBox('Savings found so far')}
    <div class="spacer"></div>
    <button class="btn blue" id="l1next" style="display:none" onclick="L.goto(2)">${icon('arrow-right')}All eight logged. Now the decisions</button>
  `);
}
function find(i,e){
  if (found[i]) return; found[i] = true;
  const f = FINDS[i];
  const t = $('#tile'+i); if (t) { t.classList.add('found'); }
  Lab.patch('#tileE'+i, eur(f.e) + ' / yr');
  const r = $('#row'+i); if (r) r.classList.add('hot');
  Lab.patch('#rowE'+i, eur(f.e)); Lab.patch('#rowS'+i, sev('warn','waste found'));
  Lab.patch('#finding', say(f.nm, f.x + ` <b>${eur(f.e)} a year.</b>`, 'warn'));
  addSavings(f.e); scoreAt(10, e);
  if (Object.keys(found).length === FINDS.length) {
    const b = $('#l1next'); if (b) b.style.display = 'inline-flex';
    Lab.patch('#finding', say('audit complete', `Eight lines, <b>${eur(saved)} a year</b>, and not one of them needed a negotiation with Microsoft. That is the usual shape of a licence audit: the waste is in the tenant, not in the price list. Next: the decisions that decide the other half.`, 'tip'));
  }
}

/* ---------------- L2 decisions ---------------- */
const DECISIONS = [
  { q:'38 people hold E5 (€55). The CFO asks: downgrade everyone to E3?',
    opts:[
      { t:'Downgrade all 38 to E3 tonight', s:'Saves €21 per seat, immediately.', v:'meh', pts:5, fb:'It saves money and it also quietly removes advanced threat protection, Teams Phone, eDiscovery and Power BI Pro from people who may rely on them. The security team will find out on the day of the incident. Audit first, then downgrade.' },
      { t:'Check who uses the E5 features, keep E5 only for them', s:'Security team, compliance, the people on Teams Phone; everyone else drops.', v:'good', pts:10, fb:'This is the job. E5 earns its price for the people who use Defender, eDiscovery or Teams Phone every week; for the rest it is an E3 with a surcharge. Typical outcome: 38 becomes 8 and nothing stops working.' },
      { t:'Keep everyone on E5, it is the premium one', s:'Better safe than sorry.', v:'bad', pts:0, fb:'"Premium" is not a security control if nobody switched the features on. You are paying €21 a month per seat for settings that are off. Safety comes from configuration, not from the top price tier.' }
    ]},
  { q:'The company has 240 people. What should the core plan be?',
    opts:[
      { t:'Microsoft 365 Business Premium for the office staff', s:'€20 instead of €34: Office apps, Intune device management, Defender for Business, Entra ID P1.', v:'good', pts:10, sv:0, fb:'Under 300 users, Business Premium is the deal of the catalogue: almost everything a mid-size company needs from E3 plus security features that E3 does not even include, for about 40 % less. The 300-seat cap is the only reason enterprises cannot use it.' },
      { t:'Stay on E3, enterprise sounds safer', s:'We have always been on E3.', v:'bad', pts:0, fb:'E3 is not safer, it is larger. For a 240-person company it means paying €14 more per seat per month and then buying Defender and Intune separately on top. "Enterprise" is a size, not a quality.' },
      { t:'Business Standard for everyone', s:'€12. Office apps and email, that is all we need.', v:'meh', pts:5, fb:'Cheapest on paper, but Standard has no device management and no endpoint protection. You would be saving €8 a seat and taking a step backwards on security that an insurer or auditor will notice. Premium is the sensible floor.' }
    ]},
  { q:'Annual or monthly commitment?',
    opts:[
      { t:'Annual for the stable core, monthly for the flexible 15 %', s:'Roughly 200 seats locked for 12 months, the rest month-to-month.', v:'good', pts:10, sv:11500, fb:'Monthly seats cost about 20 % more for the privilege of cancelling. Most of your workforce is not going anywhere this year, so commit them and keep a small monthly pool for contractors, seasonal staff and surprises. About <b>€11,500 a year</b> on this tenant.' },
      { t:'Everything monthly, we want flexibility', s:'Who knows what next year brings.', v:'meh', pts:5, fb:'Flexibility you pay 20 % for on every seat, including the 200 people who will still be here in December. Flexibility is worth buying for the people who might leave, not for the ones who will not.' },
      { t:'Everything annual, including contractors', s:'Biggest discount possible.', v:'bad', pts:0, fb:'Annual seats cannot be reduced mid-term. The contractor who leaves in March is paid for until next January. The discount on the core does not cover paying nine empty months for every short-term person.' }
    ]},
  { q:'Copilot for Microsoft 365 is €28 a month. For everyone, that is €80,640 a year. Decision?',
    opts:[
      { t:'A 20-seat pilot for 90 days with measured outcomes, then expand by role', s:'€6,720 to learn who it actually helps.', v:'good', pts:10, fb:'Copilot helps some roles a lot and others not at all, and it only works well where the data is tidy and people are trained. A pilot with a success measure (hours saved, documents produced) tells you which roles to buy for. Then you expand with evidence, not enthusiasm.' },
      { t:'Everyone, starting Monday', s:'We cannot afford to fall behind.', v:'bad', pts:0, fb:'€80,640 a year on a habit nobody has formed yet. Six months later the usage report shows 30 % of seats never opened it, and it is on an annual commitment. Falling behind is a real risk; so is paying for 240 seats to find the 60 that matter.' },
      { t:'Nobody. AI is a fad', s:'We will revisit in a few years.', v:'meh', pts:5, fb:'You saved €80k and learned nothing. A small pilot costs less than the Visio licences you just removed and tells you where the value is before competitors do.' }
    ]},
  { q:'Azure: the production servers run 24/7 all year on pay-as-you-go. Options?',
    opts:[
      { t:'Reserved instances (1 or 3 years) for the always-on servers', s:'Same servers, 30–60 % lower hourly price.', v:'good', pts:10, sv:7200, fb:'A reservation is a promise to run that size of server for the term; in exchange the price drops sharply. For servers that genuinely run every hour of the year this is free money. About <b>€7,200 a year</b> here. Pay-as-you-go stays for anything that might be switched off.' },
      { t:'Keep pay-as-you-go everywhere', s:'We like the flexibility.', v:'meh', pts:5, fb:'Pay-as-you-go is the right price for things that come and go. For a file server and a domain controller that have run every hour since 2021 it is a 40 % voluntary surcharge.' },
      { t:'Reserve everything, including the test VMs', s:'Maximum discount.', v:'bad', pts:0, fb:'A reservation commits you to running the server. The 2024 test VMs should be shut down, not locked in for three years at a discount. You would turn a mistake into a contract.' }
    ]},
  { q:'The 9 leavers: their E3 licences were kept "so the mailbox stays". What now?',
    opts:[
      { t:'Convert to a shared mailbox or make it an inactive mailbox under a retention hold, then remove the licence', s:'Data kept, sign-in blocked, €0 a month.', v:'good', pts:10, fb:'A shared mailbox under 50 GB needs no licence and the manager can read it. An inactive mailbox under a retention policy keeps the data for legal and audit purposes, also with no licence. Either way the account cannot sign in. Keeping an active licensed account for a leaver is both a cost and an open door.' },

function arcStart(){

    log:[['p','PS> Register-ScheduledReport -Name LicenceHealth -Schedule "1st of month 07:00" -To finance@, it@'],['ok','report: assigned / unassigned / inactive 90d / orphaned disks+VMs / € per department'],['ok','first run scheduled · next renewal will not be a surprise']] }
];
let stepIdx = 0, renewed = false, logQ = Promise.resolve();
function typeLog(lines){ const log = $('#nlog'); if (!log) return; logQ = logQ.then(() => (log.isConnected ? Lab.typeLines(log, lines, 6) : null)).catch(() => {}); }
function L6(){
  clearTimers(); mood('night'); stepIdx = 0; renewed = false; logQ = Promise.resolve();
  show(`
    ${Lab.badge('Level 6 · renewal night','moon')}
    <h2>Renewal night: four steps, then the switch</h2>
    ${say('your guide', `The contract renews at midnight. Do the steps in order: count, remove, commit, automate. Then flip the switch and the new order goes to Microsoft. <b>+7 per step, +28 for a clean renewal.</b>`, 'tip')}
    <div class="night-grid">
      <div>
        <div class="steps" id="steps">
          ${STEPS.map((s,i)=>`<button class="step${i>0?' locked':''}" id="st${i}" onclick="L.step(${i},event)"><span class="n">${i+1}</span><div><b>${esc(s.t)}</b><small>${esc(s.s)}</small></div></button>`).join('')}
        </div>
        <div class="log" id="nlog" aria-live="polite"><span class="dim">licence report console. waiting for step 1</span></div>
      </div>
      <div class="switch-zone">
        <button class="big-switch" id="bigSwitch" onclick="L.flip(event)" aria-label="Submit the renewal order"><div class="knob" id="knob">RENEW</div></button>
        <div class="dns-line" id="renewLine">Order not submitted. Finish the four steps first.</div>
      </div>
    </div>
    ${savingsBox('Savings found so far')}
    <div class="spacer"></div>
    <div class="center"><button class="btn green" id="l6next" style="display:none" onclick="L.goto(7)">${icon('arrow-right')}Renewed. Now survive Monday morning</button></div>
  `);
}
function step(i,e){
  if (i !== stepIdx) { toast(i > stepIdx ? 'Not yet. Finish step ' + (stepIdx+1) + ' first.' : 'Already done.', 'clock'); return; }
  const s = STEPS[i], el = $('#st'+i); if (!el) return;
  el.classList.add('done'); el.classList.remove('locked'); el.disabled = true;
  stepIdx++; const nx = $('#st'+stepIdx); if (nx) nx.classList.remove('locked');
  scoreAt(s.pts, e);
  if (i === 0) { const log = $('#nlog'); if (log) log.innerHTML = ''; }
  typeLog(s.log);
  if (stepIdx === STEPS.length) Lab.patch('#renewLine', 'Four steps done. Flip the switch to submit the order.');
}
function flip(e){
  if (renewed) return;
  if (stepIdx < STEPS.length) { toast('The order is not ready. ' + (STEPS.length - stepIdx) + ' step(s) left.', 'alert'); return; }
  renewed = true;
  const sw = $('#bigSwitch'); if (sw) sw.classList.add('on'); Lab.patch('#knob', 'RENEWED');
  scoreAt(28, e);
  Lab.patch('#renewLine', saved > 0 ? `Order submitted. New annual run-rate is about ${eur(248400 - saved)} instead of €248,400.` : 'Order submitted. The run-rate drops by whatever the audit found.');
  typeLog([['p','PS> Submit-RenewalOrder -Confirm'],['ok','order accepted · ' + eur(saved) + ' / year removed from the run-rate'],['dim','go to sleep. Monday will have opinions.']]);
  const n = $('#l6next'); if (n) n.style.display = 'inline-flex';
}

/* ---------------- L7 tickets ---------------- */
const TICKETS = [
  { t:'"I lost Visio and I need it for the factory floor plans this week."', who:'Dana, facilities · she was on parental leave during the 180-day usage window',
    opts:[ { o:'Tell her to use PowerPoint shapes instead', ok:false }, { o:'Re-assign Visio today and add an "on leave" exclusion to the inactivity rule', ok:true }, { o:'Give Visio back to all 19 original holders to be safe', ok:false } ],
    ex:'Usage-based cleanup is right 95 % of the time; leave and long projects are the other 5 %. Re-assigning takes a minute. The real fix is the rule: exclude people on leave and ask the manager before removing a specialist tool.' },
  { t:'"My mailbox is read-only since Monday. I cannot send anything."', who:'Andrei, sales · an active employee who was mis-tagged as a leaver in the sweep',
    opts:[ { o:'Create a new account for him and move on', ok:false }, { o:'Re-assign a licence now: a removed mailbox stays fully recoverable for 30 days, nothing is lost', ok:true }, { o:'Ask him to export his email to a file first', ok:false } ],
    ex:'When a licence is removed the mailbox goes read-only and is kept for 30 days. Put the licence back and it is live again within minutes, with every email. The lesson for the script: filter on "sign-in blocked AND left per HR", not on a spreadsheet column.' },
  { t:'"The lobby kiosk cannot sign in. Visitors are staring at a login screen."', who:'Reception · the kiosk account lost its E5 in the cleanup',
    opts:[ { o:'Give the E5 back, it worked before', ok:false }, { o:'Set it up as a shared device account with the smallest fitting licence (F3 or a Teams shared-device licence)', ok:true }, { o:'Unplug the kiosk', ok:false } ],
    ex:'A display in the lobby is a device, not a person. Shared-device sign-in with an F-class or Teams shared-device licence costs a few euros, and the account can only do what a kiosk needs. The E5 was never the fix; it was the nearest thing someone had.' },
  { t:'"We need Copilot for the marketing team. All 12 of us. This quarter."', who:'Head of marketing · saw a demo at a conference',
    opts:[ { o:'Buy 12 seats now, no questions asked', ok:false }, { o:'Bring them into the 90-day pilot with a success measure, expand if it delivers', ok:true }, { o:'Refuse: no AI until next year', ok:false } ],
    ex:'Marketing is a plausible win for Copilot: drafts, campaign variants, summaries. That is exactly what the pilot is for. Twelve seats inside a measured pilot, with training, beats twelve seats on an annual commitment and a hope.' },
  { t:'"A new starter joins sales on Monday and needs a licence."', who:'HR · the first joiner since the audit',
    opts:[ { o:'Assign one by hand from the spare pool and note it in the spreadsheet', ok:false }, { o:'HR puts her in the Sales role group; group-based licensing assigns Business Premium automatically and the true-up catches it', ok:true }, { o:'Buy her an E5 so she has everything', ok:false } ],
    ex:'Group-based licensing means the licence follows the role: join the group, get the plan; leave the group, the seat returns. No spreadsheet, no ghost seats, and the monthly report shows the count move by one. This is how the audit stays done.' },
  { t:'"The test VM is gone. I cannot find it in the portal."', who:'Tudor, developer · it is 07:40 on a Tuesday',
    opts:[ { o:'Restore it from backup immediately', ok:false }, { o:'It is deallocated by the auto-shutdown schedule, not deleted. Start it; it takes about two minutes', ok:true }, { o:'Rebuild it from scratch', ok:false } ],
    ex:'A stopped (deallocated) VM keeps its disk and configuration and costs almost nothing. The schedule turns it off at 19:00; the developer starts it when needed or sets an auto-start for 08:00. Stopped is not gone, and the bill is 90 % smaller.' },
  { t:'"Finance would like that licence report every month, please. With cost per department."', who:'The CFO · in a noticeably better mood',
    opts:[ { o:'Export it by hand on the first of each month', ok:false }, { o:'The scheduled automation from renewal night already produces it; add finance to the recipients and a department cost column', ok:true }, { o:'Give finance admin access to the portal so they can look themselves', ok:false } ],
    ex:'A report nobody has to remember to run is the only report that survives a busy month. Assigned, unassigned, inactive, orphaned resources and cost per department, in finance\'s inbox on the first. Next year the renewal is a formality, not a shock.' }
];
let tdone = 0, firstTry = {};
function L7(){
  clearTimers(); mood(''); tdone = 0; firstTry = {};
  show(`
    ${Lab.badge('Level 7 · monday aftermath','check-circle')}
    <h2>Monday morning: seven tickets</h2>
    ${say('your guide', `Every cleanup has a Monday. Each ticket has a lazy answer, an expensive answer and a right one. <b>+10 first try, +5 on a retry.</b> Clear all seven and the CFO gets the number.`, 'tip')}
    ${TICKETS.map((tk,i)=>`
      <div class="ticket" id="tk${i}">
        <div class="tx">${icon('ticket')}<div><b>${esc(tk.t)}</b><small>${esc(tk.who)}</small></div></div>
        <div class="choices">${tk.opts.map((op,j)=>`<button class="choice" id="tk${i}o${j}" onclick="L.solve(${i},${j},event)">${esc(op.o)}</button>`).join('')}</div>
        <div class="verdict" id="tk${i}v"></div>
      </div>`).join('')}
    ${savingsBox('Savings found')}
    <div class="spacer"></div>
    <div id="finale"></div>
  `);
}
function solve(i,j,e){
  const tk = TICKETS[i], card = $('#tk'+i); if (!card || card.classList.contains('done')) return;
  const b = $(`#tk${i}o${j}`);
  if (tk.opts[j].ok) {
    card.classList.add('done');
    tk.opts.forEach((op,k) => { const x = $(`#tk${i}o${k}`); if (x) { x.disabled = true; if (k === j) x.classList.add('good'); } });
    scoreAt(firstTry[i] === undefined ? 10 : 5, e);
    Lab.patch('#tk'+i+'v', say('solved', tk.ex, 'tip')); $('#tk'+i+'v').classList.add('show');
    tdone++;
    if (tdone === TICKETS.length) later(finale, 400);
  } else {
    firstTry[i] = false;
    if (b) { b.classList.add('bad'); b.disabled = true; later(() => b.classList.remove('bad'), 500); }
  }
}
function finale(){
  const pct = Math.round(saved / 248400 * 100);
  Lab.finale({
    into: '#finale',
    heading: `${eur(saved)} a year back in the budget. The invoice is ${pct} % smaller.`,
    summary: `The CFO's number: <b>${eur(saved)} per year</b>, found without a single call to Microsoft. Keep it that way: <b>1)</b> audit the tenant quarterly, waste grows back; <b>2)</b> leavers lose their licence on day one, the mailbox is kept as shared or inactive; <b>3)</b> the right plan per role, not the nearest one (F3 for frontline, Basic for the browser-only, Premium under 300 people, E5 only where its features are switched on); <b>4)</b> annual commitment for the stable core, monthly for the people who come and go; <b>5)</b> reserved instances for servers that never sleep, auto-shutdown for the ones that should; <b>6)</b> automate the monthly report so nobody has to remember. A 30 % jump with flat headcount is never Microsoft. It is the shelf.`
  });
}
