<div class="nojs" id="nojs"><div class="box"><p class="badge">shautech labs</p><h2>This simulator needs JavaScript.</h2><p class="muted">It runs entirely in your browser, nothing is sent anywhere. Enable JavaScript, or <a href="index.html" style="color:var(--accent2)">go back to all labs</a>.</p></div></div>

<script>
/* © 2026 shautech. The Bouncer Protocol — game logic. */
(function(){
'use strict';
const { icon, say, btn, avatar, sev, scoreAt, addScore, show, goto, toast, mood, util } = Lab;
const { esc, pick, shuffle, clamp } = util;
const $ = s => document.querySelector(s);

/* ---------------- timers (cleared on every level change) ---------------- */
let timers = [];
let rushTimer = null;
function later(fn, ms){ const id = setTimeout(fn, ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; if (rushTimer) { clearInterval(rushTimer); rushTimer = null; } }
function setGate(m){ if (Lab.scene) Lab.scene.set('gate', m); }

/* ---------------- ambient scene: sign-ins meet the policy gate ---------------- */
const scene = {
  state: { level: 0, mood: '', gate: 'none', flash: 0, T: 0 },
  init(s, W, H) {
    const span = Math.min(H * 0.46, 360), y0 = (H - span) / 2, y1 = y0 + span;
    const rackW = 40, gx = W / 2;
    s.g = { gx, y0, y1, span, lx: 14, rx: W - 14 - rackW, rackW };
    const ax = 14 + rackW + 6, bx = W - 14 - rackW - 6, lanes = 6;
    s.lanes = [];
    for (let i = 0; i < lanes; i++) {
      const ya = y0 + span * (0.08 + 0.84 * i / (lanes - 1));
      const gy = y0 + span * (0.14 + 0.72 * Math.random());
      const yb = y0 + span * (0.08 + 0.84 * Math.random());
      const a = Lab.draw.curve([ax, ya], [W * 0.26, ya + (Math.random() - .5) * span * .4], [gx - W * 0.12, gy], [gx, gy], 70);
      const b = Lab.draw.curve([gx, gy], [gx + W * 0.12, gy], [W * 0.74, yb + (Math.random() - .5) * span * .4], [bx, yb], 70);
      s.lanes.push(a.concat(b.slice(1)));
    }
    const n = clamp(Math.round(W / 40), 14, 34);
    s.parts = []; for (let i = 0; i < n; i++) { const p = newPart(s); p.t = Math.random(); s.parts.push(p); }
    s.pulses = [];
  },
  onChange(s, k) { if (k === 'gate') s.flash = 1; },
  draw(ctx, s, W, H, t, dt) {
    if (!s.g) return;
    const C = Lab.colors, g = s.g, GATE = 0.5, HOLD = 0.6;
    s.T += dt; s.flash = Math.max(0, s.flash - dt * 1.1);
    const speed = s.level === 5 ? 1.7 : 1;
    /* racks */
    Lab.draw.rack(ctx, g.lx, g.y0, g.rackW, g.span, { color: Lab.rgba(C.amber, .35), slots: 8, label: 'SIGN-INS' });
    Lab.draw.rack(ctx, g.rx, g.y0, g.rackW, g.span, { color: Lab.rgba(s.mood === 'calm' ? C.mint : C.accent, .4), slots: 8, label: 'YOUR APPS' });
    /* lanes */
    ctx.save(); ctx.lineDashOffset = -t * 9;
    s.lanes.forEach(l => Lab.draw.path(ctx, l, 'rgba(140,194,255,.07)', 1, [2, 7]));
    ctx.restore();
    /* the gate: two pillars + a bar */
    let col, a, label;
    if (s.gate === 'none') { col = C.ink2; a = .12; label = 'NO POLICIES'; }
    else if (s.gate === 'report') { col = C.amber; a = .35 + s.flash * .3; label = 'CA GATE · REPORT-ONLY'; }
    else { col = C.accent; a = .45 + s.flash * .4; label = 'CA GATE · ENFORCED'; }
    if (s.mood === 'night' && s.gate !== 'enforced') col = C.violet;
    ctx.save();
    ctx.fillStyle = 'rgba(16,19,23,.8)'; ctx.strokeStyle = Lab.rgba(col, a); ctx.lineWidth = 1.2;
    [g.gx - 28, g.gx + 16].forEach(x => { Lab.draw.rr(ctx, x, g.y0 - 10, 12, g.span + 20, 5); ctx.fill(); ctx.stroke(); });
    if (s.gate === 'none') {
      ctx.setLineDash([3, 7]); ctx.beginPath(); ctx.moveTo(g.gx - 28, g.y0 - 22); ctx.lineTo(g.gx + 28, g.y0 - 22); ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.fillStyle = Lab.rgba(col, a * .5); Lab.draw.rr(ctx, g.gx - 28, g.y0 - 18, 56, 8, 3); ctx.fill(); ctx.stroke();
      if (s.gate === 'enforced') { ctx.shadowBlur = 12; ctx.shadowColor = Lab.rgba(col, .7); ctx.lineWidth = 1.6; }
      else ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(g.gx, g.y0 - 10); ctx.lineTo(g.gx, g.y1 + 10); ctx.stroke();
    }
    ctx.restore();
    Lab.draw.text(ctx, label, g.gx, g.y0 - 30, { color: Lab.rgba(col, Math.min(a + .3, .8)), size: 9 });
    /* packets */
    for (const p of s.parts) {
      const held = p.hold > s.T;
      if (!held) p.t += p.v * speed * dt;
      const pts = s.lanes[p.lane];
      if (p.t >= GATE && !p.flagged && !p.passed && s.gate !== 'none') {
        const [hx, hy] = Lab.draw.posOn(pts, GATE);
        if (s.gate === 'report') {
          if (p.cls === 'bad') { s.pulses.push({ x: hx, y: hy, r: 2, a: .35, c: C.amber }); s.flash = Math.min(s.flash + .2, 1); }
          p.flagged = true;
        } else {
          if (p.cls === 'bad') { s.pulses.push({ x: hx, y: hy, r: 2, a: .4, c: C.red }); s.flash = Math.min(s.flash + .3, 1); Object.assign(p, newPart(s)); continue; }
          if (p.cls === 'mfa' && !p.hold) { p.hold = s.T + HOLD; p.t = GATE; continue; }
          if (p.cls === 'mfa' && p.hold && p.hold <= s.T) { s.pulses.push({ x: hx, y: hy, r: 2, a: .3, c: C.mint }); p.cls = 'ok'; p.passed = true; p.hold = 0; }
          else if (p.cls === 'ok') p.passed = true;
        }
      }
      if (p.t >= 1) {
        const [ex, ey] = Lab.draw.posOn(pts, 1);
        if (Math.random() < .5) s.pulses.push({ x: ex, y: ey, r: 2, a: .3, c: p.cls === 'bad' ? C.red : C.mint });
        Object.assign(p, newPart(s)); continue;
      }
      const col2 = p.cls === 'ok' ? C.mint : (p.cls === 'mfa' ? C.amber : C.red);
      for (let k = 4; k >= 1; k--) {
        const [qx, qy] = Lab.draw.posOn(pts, p.t - k * .012);
        ctx.fillStyle = Lab.rgba(col2, .14 * (1 - k / 5)); ctx.beginPath(); ctx.arc(qx, qy, Math.max(p.sz * .45 * (1 - k * .15), .3), 0, 7); ctx.fill();
      }
      const [x, y] = Lab.draw.posOn(pts, p.t);
      if (held) { ctx.save(); ctx.strokeStyle = Lab.rgba(C.amber, .7); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, p.sz + 5 + Math.sin(s.T * 10) * 1.5, 0, 7); ctx.stroke(); ctx.restore(); }
      Lab.draw.glyph(ctx, p.k, x, y, p.sz, Lab.rgba(col2, .8));
    }
    s.pulses = s.pulses.filter(q => q.a > .01);
    for (const q of s.pulses) {
      q.r += 34 * dt; q.a -= .5 * dt;
      ctx.strokeStyle = Lab.rgba(q.c, Math.max(q.a, 0)); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.stroke();
    }
  }
};
function roll(s){ const r = Math.random(); if (s.mood === 'calm') return r < .7 ? 'ok' : (r < .92 ? 'mfa' : 'bad'); return r < .4 ? 'ok' : (r < .7 ? 'mfa' : 'bad'); }
function newPart(s){ return { lane: Math.floor(Math.random() * s.lanes.length), t: 0, v: .05 + Math.random() * .07, sz: 3.5 + Math.random() * 2, k: pick(['user', 'user', 'user', 'key']), cls: roll(s), flagged: false, hold: 0, passed: false }; }

/* ---------------- L0 : briefing ---------------- */
function L0(){
  clearTimers(); mood(''); setGate('none');
  show(`
    ${Lab.badge('Level 0 · the new front door', 'play')}
    <h1>Your office has walls.<br>Your cloud has a <em>bouncer</em>.</h1>
    ${say('the boss', 'Quick one. My nephew says our data is "in the cloud", so where is the firewall? What is actually stopping someone in another country from simply logging in as me? Asking for a friend.')}
    ${say('your guide', `Good question. In the cloud there is no wall: anyone on Earth can reach your login page. What stands between them and your data is <b>the bouncer</b>: a set of rules that checks every single sign-in (who you are, where you are coming from, what device you are on) and decides <b>come in</b>, <b>show me more ID</b>, or <b>not tonight</b>.<br><br>In Microsoft terms the bouncer is called <b>Conditional Access</b>. Today you write the rulebook. Look at the background: right now there are no rules, so everything walks straight in, including the red ones.`, 'tip')}
    <div class="spacer"></div>
    <button class="btn blue" onclick="L.goto(1)">${icon('arrow-right')}Hand me the rulebook</button>
  `);
}

/* ---------------- L1 : the six signals ---------------- */
const signals = [
  { ic: 'user',   nm: 'Who is asking',          found: 'The account and its groups. An intern and a Global Admin should not face the same door policy: admins get the strict list.' },
  { ic: 'pin',    nm: 'Where from',             found: 'Country and network. Your office IP at 9 AM is one story; a country you have never traded with at 3 AM is another.' },
  { ic: 'laptop', nm: 'What device',            found: 'A company laptop that is enrolled, encrypted and healthy, or a hotel lobby PC with seven toolbars. The bouncer can tell the difference.' },
  { ic: 'phone',  nm: 'Which client and protocol', found: 'Modern Outlook on a known platform plays by the rules. Ancient protocols like IMAP and POP cannot even do MFA, which is exactly why attackers love them. Remember this one.' },
  { ic: 'alert',  nm: 'How risky it looks',     found: 'Live risk signals: a password seen in a breach dump, "impossible travel", anonymous VPN exit nodes. The bouncer reads the news.' },
  { ic: 'box',    nm: 'What they are opening',  found: 'The lunch menu app and the finance system are not the same door. Sensitive apps can demand extra proof.' }
];
let foundCount = 0;
function L1(){
  clearTimers(); mood('');
  foundCount = 0;
  show(`
    ${Lab.badge('Level 1 · signals', 'radar')}
    <h2>What the bouncer can see</h2>
    ${say('your guide', 'Before writing rules, know your inputs. Every sign-in arrives carrying six signals. Switch each one on to see what it tells you. (+10 each)', 'tip')}
    <div class="signals">
      ${signals.map((o, i) => `<button class="signal" id="sig${i}" onclick="L.signal(${i},event)" aria-pressed="false">${icon(o.ic)}${esc(o.nm)}</button>`).join('')}
    </div>
    <div class="inv" id="inv">${icon('radar')} <b>Signals learned: 0/6</b> — pick one to inspect.</div>
    <div class="spacer"></div>
    <button class="btn blue" id="l1next" style="display:none" onclick="L.goto(2)">${icon('arrow-right')}Signals mastered. On to the big decisions</button>
  `);
}
function signal(i, e){
  const el = $('#sig' + i); if (!el || el.classList.contains('on')) return;
  el.classList.add('on'); el.setAttribute('aria-pressed', 'true');
  foundCount++; scoreAt(10, e);
  Lab.patch('#inv', `${icon(signals[i].ic)} <b>Signal ${foundCount}/${signals.length} · ${esc(signals[i].nm)}:</b> ${signals[i].found}`);
  if (foundCount === signals.length) {
    Lab.patch('#inv', `${icon('check-circle')} <b>All six signals learned.</b> The point of Conditional Access is that it combines them. "Known user + healthy device + usual country" sails through; change any one signal and the door tightens, automatically, at 4 AM, without you.`);
    const n = $('#l1next'); if (n) n.style.display = 'inline-flex';
  }
}

/* ---------------- L2 : rollout decisions ---------------- */
const decisions = [
  { q: 'Where does your rulebook come from?', opts: [
    { t: 'Start from proven baseline templates, adapt to us', s: 'Microsoft and the community already wrote the greatest hits.', v: 'good', pts: 10,
      fb: 'Correct. MFA for all, block legacy auth, protect admins: these are solved problems with ready templates. Your creativity is better spent on the exceptions. (+10)' },
    { t: 'Write every policy from scratch', s: 'Hand-crafted, small-batch security rules.', v: 'meh', pts: 5,
      fb: 'You would arrive at the same baseline three weeks later, with two typos. Start from templates and customise where your business is genuinely different. (+5)' },
    { t: 'No rules. MFA prompts annoy people', s: 'Happy users, open door.', v: 'bad', pts: 0,
      fb: 'A door with no bouncer gets a visit eventually, and you saw in Breach Day what a visit costs. A few prompts a week is the cheapest insurance that exists. (0)' }
  ]},
  { q: 'How do you switch the rules on?', opts: [
    { t: 'Report-only first: watch who would be blocked', s: 'The rules run silently and just take notes.', v: 'good', pts: 10,
      fb: 'The professional move. Report-only mode shows you every would-be block before anyone gets locked out. You find the old scanner and the sales tablets while they still work. (+10)' },
    { t: 'Enforce everything Friday at 5 PM', s: 'Rip the plaster off. See you Monday.', v: 'bad', pts: 0,
      fb: 'Monday, 8 AM: 30 people locked out, the boss among them, and you are on holiday. Enforcement without a report-only phase is how Conditional Access gets a bad reputation. (0)' },
    { t: 'Enforce for everyone except the loud complainers', s: 'Path of least resistance.', v: 'meh', pts: 5,
      fb: 'Now your most-targeted users (executives are always the loudest) have the weakest door. Exceptions by volume of complaint is security by squeaky wheel. (+5)' }
  ]},
  { q: 'The break-glass account: the emergency key when everything goes wrong?', opts: [
    { t: 'Two emergency admin accounts, excluded from CA, credentials in a safe, tested', s: 'For the night a bad policy locks everyone out.', v: 'good', pts: 10,
      fb: 'Yes, and this one is not optional. One misconfigured policy can lock out every admin including you, and then nobody can fix the policy. Two break-glass accounts, monitored for any use, credentials offline. (+10)' },
    { t: 'No exceptions. Ever. Maximum security', s: 'Rules are rules.', v: 'bad', pts: 0,
      fb: 'Brave, until the Friday you enforce a broken policy and realise the only accounts that could repair it are locked out by it. That support ticket takes days. (0)' },
    { t: 'Exclude the whole IT department, to be safe', s: 'IT would never get phished, right?', v: 'meh', pts: 5,
      fb: 'That is not a break-glass, that is a barn door. IT admins are the juiciest phishing targets in the building. Two named accounts, not a department. (+5)' }
  ]}
];
const philosophies = [
  { ic: 'target', t: 'Balanced: strict where it hurts, invisible where it does not', s: 'Tight rules on admins and finance, frictionless for daily work.',
    fb: 'The crowd favourite: users barely notice the bouncer on a normal day, and that is exactly why they do not fight him on the abnormal one. (+10)' },
  { ic: 'shield-check', t: 'Zero-trust maximalist: verify everything, always', s: 'Every session proves itself, every time.',
    fb: 'The gold standard if you invest in making it smooth: compliant devices and phishing-resistant MFA make "always verify" nearly invisible. Budget for the tuning. (+10)' },
  { ic: 'chart', t: 'Start small, tighten monthly', s: 'Baseline now, one notch stricter each review.',
    fb: 'The pragmatist’s path: a modest baseline today beats a perfect policy set next quarter. The review calendar does the rest. (+10)' }
];
let di = 0;
function L2(){
  clearTimers(); mood('');
  di = 0;
  show(`
    ${Lab.badge('Level 2 · decide', 'map')}
    <h2>Three calls before the first rule</h2>
    ${say('your guide', 'Conditional Access failures are almost never technical. They are rollout failures. These three decisions prevent all the famous ones.', 'tip')}
    <div id="dzone"></div>
  `);
  renderDecision();
}
function renderDecision(){
  const d = decisions[di];
  Lab.patch('#dzone', `
    <h3 style="margin-top:14px">Decision ${di + 1}/${decisions.length}: ${esc(d.q)}</h3>
    <div class="choices">
      ${d.opts.map((o, i) => `<button class="choice" id="ch${i}" onclick="L.pick(${i},event)"><b>${esc(o.t)}</b><small>${esc(o.s)}</small></button>`).join('')}
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="spacer"></div>
    <button class="btn blue" id="dnext" style="display:none"></button>
  `);
}
function pickOpt(i, e){
  const d = decisions[di], o = d.opts[i];
  d.opts.forEach((x, j) => { const el = $('#ch' + j); if (!el) return; el.disabled = true; if (j === i) el.classList.add(o.v); });
  if (o.pts > 0) scoreAt(o.pts, e);
  Lab.patch('#verdict', say(o.v === 'good' ? 'nice' : 'hmm', o.fb, o.v === 'good' ? 'tip' : (o.v === 'bad' ? 'alert' : 'warn')));
  const v = $('#verdict'); if (v) v.classList.add('show');
  const b = $('#dnext'); if (!b) return;
  b.style.display = 'inline-flex';
  if (di < decisions.length - 1) { b.innerHTML = icon('arrow-right') + 'Next decision'; b.onclick = () => { di++; renderDecision(); }; }
  else { b.innerHTML = icon('arrow-right') + 'One more thing: your door philosophy'; b.onclick = renderPhilosophy; }
}
function renderPhilosophy(){
  Lab.patch('#dzone', `
    <h3 style="margin-top:14px">Pick your door philosophy</h3>
    ${say('your guide', 'No wrong answers here, only what fits your users, budget and appetite. Choose one.', 'tip')}
    <div class="choices">
      ${philosophies.map((o, i) => `<button class="choice" id="tl${i}" onclick="L.pickTool(${i},event)"><b>${icon(o.ic)} ${esc(o.t)}</b><small>${esc(o.s)}</small></button>`).join('')}
    </div>
    <div class="verdict" id="tverdict"></div>
    <div class="spacer"></div>

}
function solve(i, j, e){
  const tk = tickets[i], card = $('#tk' + i); if (!card || card.classList.contains('done')) return;
  const b = $('#tk' + i + 'o' + j); if (!b) return;
  if (tk.opts[j].ok) {
    card.classList.add('done');
    tk.opts.forEach((op, k) => { const x = $('#tk' + i + 'o' + k); if (!x) return; x.disabled = true; if (k === j) x.classList.add('good'); });
    scoreAt(firstTry[i] === undefined ? 10 : 5, e);
    Lab.patch('#tk' + i + 'v', say('solved', tk.ex, 'tip'));
    const v = $('#tk' + i + 'v'); if (v) v.classList.add('show');
    tdone++;
    if (tdone === tickets.length) later(() => Lab.finale({ heading: 'The door holds.', into: '#finale' }), 400);
  } else {
    firstTry[i] = false; b.classList.add('bad'); b.disabled = true;
    later(() => b.classList.remove('bad'), 450);
  }
}
