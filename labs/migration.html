<div class="nojs" id="nojs"><div class="box"><p class="badge">shautech labs</p><h2>This simulator needs JavaScript.</h2><p class="muted">It runs entirely in your browser, nothing is sent anywhere. Enable JavaScript, or <a href="index.html" style="color:var(--accent2)">go back to all labs</a>.</p></div></div>

<script src="../assets/js/lab-engine.js"></script>
<script>
/* © 2026 shautech. Operation Moving Clouds — game logic. */
(function(){
'use strict';
const { icon, say, btn, avatar, sev, scoreAt, addScore, show, goto, toast, mood, util } = Lab;
const { esc, pick, shuffle, clamp } = util;
const $ = id => document.getElementById(id);

/* ---------------- timers: every level clears what the previous one left behind ---------------- */
let timers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
const every = (fn, ms) => { const id = setInterval(fn, ms); timers.push(id); return id; };
function clearTimers(){ timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers = []; }

/* what travels the wire in the background — set from the game as the player touches things */
function flow(k){ if (Lab.scene) Lab.scene.set('flow', k); }

/* ---------------- ambient scene: two tenant racks, dashed lanes, packets left -> right ---------------- */
const KINDS = {
  dot: ['dot'],
  mail: ['mail'],
  files: ['file'],
  chat: ['dot', 'mail'],
  users: ['user'],
  sites: ['file', 'dot'],
  calendar: ['file'],
  license: ['key'],
  mix: ['mail', 'file', 'user', 'key', 'dot']
};
const scene = {
  state: { level: 0, mood: '', flow: 'dot', lanes: [], pkts: [], pulses: [], g: null },
  init(s, W, H) {
    const D = Lab.draw;
    const rw = W < 600 ? 34 : 56, rh = Math.min(H * .5, 360), ry = (H - rh) / 2 + 34;
    const g = { rw, rh, ry, x0: 12, x1: W - 12 - rw, ax: 12 + rw + 2, bx: W - 12 - rw - 2 };
    s.g = g; s.lanes = [];
    const LANES = 6;
    for (let i = 0; i < LANES; i++) {
      const ya = g.ry + g.rh * (0.08 + 0.84 * i / (LANES - 1));
      const yb = g.ry + g.rh * (0.08 + 0.84 * Math.random());
      const p0 = [g.ax, ya], p3 = [g.bx, yb];
      const p1 = [W * (0.30 + Math.random() * 0.08), ya + (Math.random() * 2 - 1) * H * 0.18];
      const p2 = [W * (0.62 + Math.random() * 0.08), yb + (Math.random() * 2 - 1) * H * 0.18];
      s.lanes.push(D.curve(p0, p1, p2, p3, 120));
    }
    const n = clamp(Math.round(W / 34), 16, 50);
    s.pkts = Array.from({ length: n }, () => ({
      l: Math.floor(Math.random() * LANES), t: Math.random(), v: 0.04 + Math.random() * 0.07,
      s: 3 + Math.random() * 2.2, k: pick(KINDS[s.flow] || KINDS.dot), alt: Math.random() < 0.16
    }));
    s.pulses = [];
  },
  onChange(s, k, v) {
    if (k === 'flow' && KINDS[v]) s.pkts.forEach(p => { p.k = pick(KINDS[v]); });
  },
  draw(ctx, s, W, H, t, dt) {
    const D = Lab.draw, C = Lab.colors, g = s.g; if (!g) return;
    const night = s.level === 6 || s.mood === 'night';
    const calm = s.mood === 'calm' || s.level >= 8;
    const main = night ? C.violet : calm ? C.mint : C.accent;
    const alt = calm ? C.accent2 : C.mint;
    // racks
    const led = i => Lab.rgba(main, 0.25 + 0.5 * (Math.sin(t * 1.8 + i * 1.7) * 0.5 + 0.5));
    const ledB = i => Lab.rgba(alt, 0.25 + 0.5 * (Math.sin(t * 1.8 + i * 1.7 + 3) * 0.5 + 0.5));
    const narrow = W < 600;
    ctx.save(); ctx.globalAlpha = narrow ? .35 : 1;
    D.rack(ctx, g.x0, g.ry, g.rw, g.rh, { color: Lab.rgba(main, .45), fill: 'rgba(16,19,23,.6)', label: narrow ? 'SRC' : 'SOURCE', led });
    D.rack(ctx, g.x1, g.ry, g.rw, g.rh, { color: Lab.rgba(alt, .45), fill: 'rgba(16,19,23,.6)', label: narrow ? 'DST' : 'DESTINATION', led: ledB });
    ctx.restore();
    // dashed lanes with a slow crawl
    ctx.save(); ctx.lineDashOffset = -t * 9;
    s.lanes.forEach(pts => D.path(ctx, pts, Lab.rgba(main, .14), 1, [2, 7]));
    ctx.restore();
    // packets
    for (const p of s.pkts) {
      p.t += p.v * dt;
      if (p.t >= 1) {
        const end = D.posOn(s.lanes[p.l], 1);
        if (Math.random() < .5) s.pulses.push({ x: end[0], y: end[1], r: 2, a: .3, alt: p.alt });
        p.t = 0; p.l = Math.floor(Math.random() * s.lanes.length); p.v = 0.04 + Math.random() * 0.07;
        p.k = pick(KINDS[s.flow] || KINDS.dot); p.alt = Math.random() < 0.16;
      }
      const lane = s.lanes[p.l], col = p.alt ? alt : main;
      for (let k = 4; k >= 1; k--) {
        const q = D.posOn(lane, p.t - k * 0.012);
        ctx.beginPath(); ctx.arc(q[0], q[1], Math.max(p.s * .25 * (1 - k * .15), .3), 0, 7);
        ctx.fillStyle = Lab.rgba(col, .18 * (1 - k / 5)); ctx.fill();
      }
      const h = D.posOn(lane, p.t);
      D.glyph(ctx, p.k, h[0], h[1], p.s, Lab.rgba(col, .8));
    }
    // arrival pulses at the destination rack
    s.pulses = s.pulses.filter(q => q.a > .01);
    for (const q of s.pulses) {
      q.r += 34 * dt; q.a -= .5 * dt;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.strokeStyle = Lab.rgba(q.alt ? alt : main, Math.max(q.a, 0)); ctx.lineWidth = 1; ctx.stroke();
    }
  }
};

/* ================= L0 : BRIEFING ================= */
function L0(){
  clearTimers(); mood('');
  show(`
    ${Lab.badge('Level 0 · briefing','play')}
    <h1>You have just been handed <em>today's migration</em>.</h1>
    ${say('the boss', `Big news: our company, <b>PixelSoft</b>, has been acquired by <b>MegaCorp</b>. We need to move <i>everything</i> — email, files, accounts, teams — from our cloud into theirs. It is called a <b>tenant-to-tenant migration</b>. You will handle it, right? Thanks, I have a meeting.`)}
    ${say('your guide', `You do not need to be technical for this. A "tenant" is simply <b>a company's own space in the cloud</b> — think of an apartment building where the company rents one unit, holding its email, files and users. We are moving everything from building A to building B without losing anything on the way. Step by step.`, 'tip')}
    <div class="spacer"></div>
    <button class="btn blue" onclick="L.goto(1)">${icon('arrow-right')}Accept the mission</button>
  `);
}

/* ================= L1 : DISCOVERY ================= */
const objects = [
  { ic: 'mail',    nm: 'The email server',   flow: 'mail',  found: '48 mailboxes, some holding 15 years of messages. Yes, including the jokes from 2011.' },
  { ic: 'folder',  nm: 'The company files',  flow: 'files', found: '820 GB of documents. Half of them are named "final_FINAL_v3_good.docx".' },
  { ic: 'chat',    nm: 'The chat teams',     flow: 'chat',  found: '12 Teams teams, including a semi-secret one called "Coffee Break".' },
  { ic: 'users',   nm: 'The employee list',  flow: 'users', found: '48 user accounts, plus 3 accounts of colleagues who left two years ago. Noted.' },
  { ic: 'globe',   nm: 'The internal sites', flow: 'sites', found: '5 internal sites. One was last updated in 2019.' },
  { ic: 'printer', nm: 'The corner printer', flow: 'dot',   found: 'Good news: the printer does not migrate to the cloud. It stays here, jamming paper in peace.' }
];
const collectItems = [
  { ic: 'users',   b: 'Users and groups',       flow: 'users',   d: 'Who exists, who is actually active, who has left (goodbye, ghost accounts).' },
  { ic: 'mail',    b: 'Mailboxes',              flow: 'mail',    d: 'Size of each mailbox, plus shared mailboxes (info@, sales@) and distribution lists.' },
  { ic: 'folder',  b: 'OneDrive files',         flow: 'files',   d: 'How big each person\'s storage is and who shares what with whom.' },
  { ic: 'layers',  b: 'SharePoint sites',       flow: 'sites',   d: 'Sites, document libraries and, crucially, the permissions on them.' },
  { ic: 'chat',    b: 'Teams and channels',     flow: 'chat',    d: 'Which teams exist, who owns them, and where their files live.' },
  { ic: 'at',      b: 'Domains and DNS records', flow: 'sites',  d: 'The company\'s email address entries in the "internet address book".' },
  { ic: 'license', b: 'Licenses',               flow: 'license', d: 'What everyone has today versus what they will need in the new cloud.' },
  { ic: 'plug',    b: 'Connected apps',         flow: 'dot',     d: 'Printers and scanners that send email, the CRM, website forms — anything wired to the old cloud.' }
];
let foundCount = 0, collectDone = 0;
function L1(){
  clearTimers(); mood('');
  foundCount = 0; collectDone = 0;
  show(`
    ${Lab.badge('Level 1 · discovery','search')}
    <h2>You cannot move what you do not know you have</h2>
    ${say('your guide', `The first step of any migration is <b>the inventory</b>. We walk through the "digital office" and write down everything that exists. Click each object to discover it (+10 points each).`, 'tip')}
    <div class="grid grid--auto">
      ${objects.map((o, i) => `
        <button class="tile" id="obj${i}" onclick="L.discover(${i},event)">${icon(o.ic)}<span class="nm">${esc(o.nm)}</span></button>`).join('')}
    </div>
    <div class="inv" id="inv">${icon('list-check')}<b>Inventory:</b> empty for now — click the objects.</div>
    <div id="sheetZone"></div>
    <div class="spacer"></div>
    <button class="btn" id="l1sheetBtn" style="display:none" onclick="L.showSheet()">${icon('sheet')}Open the inventory sheet</button>
    <button class="btn blue" id="l1next" style="display:none" onclick="L.goto(2)">${icon('arrow-right')}Inventory complete — on to the plan</button>
  `);
}
function discover(i, e){
  const el = $('obj' + i); if (!el || el.classList.contains('found')) return;
  el.classList.add('found'); foundCount++;
  flow(objects[i].flow);
  scoreAt(10, e);
  Lab.patch('#inv', `${icon('list-check')}<b>Discovered:</b> ${esc(objects[i].found)}<br><small class="small">(${foundCount}/${objects.length} objects found)</small>`);
  if (foundCount === objects.length) {
    Lab.patch('#inv', `${icon('list-check')}<b>All objects found.</b> Clicking around is not enough, though — a real discovery ends with a <b>written inventory</b>. Let's see what that actually looks like.`);
    const b = $('l1sheetBtn'); if (b) b.style.display = 'inline-flex';
  }
}
function showSheet(){
  const b = $('l1sheetBtn'); if (b) b.style.display = 'none';
  Lab.patch('#sheetZone', `
    ${say('your guide', `This is what collected data looks like: a plain but priceless <b>spreadsheet</b>. In real life it is exported automatically with reports or scripts — nobody counts emails by hand. Notice how it already <b>predicts problems</b>: Mia's mailbox is flagged for a reason.`, 'tip')}
    <div class="sheet">
      <table>
        <tr><th>Who / what</th><th>Mailbox</th><th>OneDrive</th><th>Notes</th></tr>
        <tr><td>Anna (Accounting)</td><td>9.8 GB</td><td>4.2 GB</td><td>15 years of email, all "important"</td></tr>
        <tr><td>Rudy (Design)</td><td>2.1 GB</td><td>410 GB</td><td>giant design files — will migrate slowly</td></tr>
        <tr class="hot"><td>Mia (Reception)</td><td>14.6 GB ${sev('warn','flag')}</td><td>0.3 GB</td><td>huge attachments — flag for cleanup</td></tr>
        <tr><td>Vlad (IT)</td><td>1.2 GB</td><td>12 GB</td><td>perfect first test pilot</td></tr>
        <tr><td>…44 more people</td><td>…</td><td>…</td><td>collected the same way</td></tr>
        <tr><td>info@ (shared mailbox)</td><td>6.4 GB</td><td>—</td><td>3 people use it — do not forget it</td></tr>
        <tr><td>"Coffee Break" (Team)</td><td>—</td><td>2.1 GB</td><td>semi-secret but beloved — must survive</td></tr>
      </table>
    </div>
    ${say('the checklist', `And here is <b>what to collect</b>, category by category. Tick each one to confirm it is on your list (+5 points each).`, 'tip')}
    <div class="clist">
      ${collectItems.map((c, i) => `
        <button class="citem" id="ci${i}" onclick="L.checkItem(${i},event)">
          <span class="box">${icon('check')}</span>
          <span><b>${icon(c.ic)} ${esc(c.b)}</b>${esc(c.d)}</span>
        </button>`).join('')}
    </div>`);
}
function checkItem(i, e){
  const el = $('ci' + i); if (!el || el.classList.contains('checked')) return;
  el.classList.add('checked'); collectDone++;
  flow(collectItems[i].flow);
  scoreAt(5, e);
  if (collectDone === collectItems.length) { const n = $('l1next'); if (n) n.style.display = 'inline-flex'; }
}

/* ================= L2 : PLANNING DECISIONS ================= */
const decisions = [
  { q: 'How do we move the data of all 48 people?',
    opts: [
      { t: 'Big bang', s: 'Move everything, for everyone, in a single weekend.', v: 'meh', pts: 5,
        fb: 'It works for small companies, but if a problem shows up, it shows up for everyone at once. Brave — maybe too brave. (+5)' },
      { t: 'In waves', s: 'Move small groups, one at a time, starting with the least demanding people.', v: 'good', pts: 10,
        fb: 'Exactly. Waves mean that if something breaks, it breaks for 5 people, not 48 — and you learn from every wave. (+10)' },
      { t: 'Everyone moves themselves', s: 'Send them a PDF guide and wish them luck.', v: 'bad', pts: 0,
        fb: 'Half of them would not read the guide; the other half would "move" their files onto a USB stick. (0)' }
    ] },
  { q: 'When do we do the final cutover (the moment everyone switches to the new system)?',
    opts: [
      { t: 'Monday morning', s: 'Everyone is fresh and full of energy.', v: 'bad', pts: 0,
        fb: 'On Monday morning everyone wants to read their email — which is being moved at that very moment. Guaranteed chaos. (0)' },
      { t: 'Saturday night', s: 'Nobody is working, and we have the whole weekend as a safety net.', v: 'good', pts: 10,
        fb: 'Correct. The cutover always happens when the impact is lowest — and you still have Sunday to fix surprises. (+10)' },
      { t: 'On Christmas Day', s: 'A surprise gift for everyone.', v: 'bad', pts: 0,
        fb: 'Technically it is quiet, but who fixes things if they break? Nobody on call knows the admin password. (0)' }
    ] },
  { q: 'Do we tell people in advance what is about to happen?',
    opts: [
      { t: 'No, keep it a surprise', s: 'On Monday they will have a new system. Ta-da.', v: 'bad', pts: 0,
        fb: 'The "surprise" turns into 48 calls to IT before lunch. Communication is not optional. (0)' },
      { t: 'Yes, early and clearly', s: 'Emails, a simple guide and a Q&amp;A session.', v: 'good', pts: 10,
        fb: 'Yes. The biggest part of a successful migration is not technical — it is making sure nobody is caught off guard. (+10)' },
      { t: 'Only the managers', s: 'Everyone else hears it from them, like a game of telephone.', v: 'meh', pts: 5,
        fb: 'Better than nothing, but the message gets distorted on the way: "is everything getting deleted?!". Tell everyone. (+5)' }
    ] }
];
const tools = [
  { ic: 'box', t: 'A third-party migration tool', s: 'ShareGate, BitTitan MigrationWiz, Quest, AvePoint…',
    fb: 'A great choice for most companies: friendly dashboards, progress reports, mapping wizards and a support line to call at 2 AM. It costs money, but it saves nerves — and nerves are expensive too. (+10)' },
  { ic: 'terminal', t: 'PowerShell scripts', s: 'Free, powerful, fully under your control — if your team speaks "script".',
    fb: 'The do-it-yourself route: free and infinitely flexible, but you write, test and babysit everything. Perfect if your team has scripting skills and time. (+10)' },
  { ic: 'building', t: 'Microsoft\'s built-in tools', s: 'Native cross-tenant migration, no extra vendor.',
    fb: 'The native route: Microsoft\'s own cross-tenant migration covers mailboxes and OneDrive without buying anything extra. It needs careful setup and has fewer bells and whistles. (+10)' }
];
let di = 0;
function L2(){
  clearTimers(); mood('');
  di = 0;
  show(`
    ${Lab.badge('Level 2 · planning','map')}
    <h2>The big decisions</h2>
    ${say('your guide', `Now that we know <b>what</b> we are moving, we decide <b>how</b>. Every choice has consequences — choose carefully.`, 'tip')}
    <div id="dzone"></div>
  `);
  renderDecision();
}
function renderDecision(){
  const d = decisions[di];
  Lab.patch('#dzone', `
    <h3 class="q">Decision ${di + 1} of ${decisions.length}: ${esc(d.q)}</h3>
    <div class="choices">
      ${d.opts.map((o, i) => `<button class="choice" id="ch${i}" onclick="L.pick(${i},event)"><b>${esc(o.t)}</b><small>${o.s}</small></button>`).join('')}
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="spacer"></div>
    <button class="btn blue" id="dnext" style="display:none"></button>
  `);
}
function pickOpt(i, e){
  const d = decisions[di], o = d.opts[i];
  d.opts.forEach((x, j) => { const el = $('ch' + j); if (!el) return; el.disabled = true; if (j === i) el.classList.add(o.v); });
  if (o.pts > 0) scoreAt(o.pts, e);
  Lab.patch('#verdict', say(o.v === 'good' ? 'good call' : 'not quite', esc(o.fb), o.v === 'good' ? 'tip' : 'warn'));
  const v = $('verdict'); if (v) v.classList.add('show');
  const b = $('dnext'); if (!b) return;
  b.style.display = 'inline-flex';
  if (di < decisions.length - 1) { b.innerHTML = icon('arrow-right') + 'Next decision'; b.onclick = () => { di++; renderDecision(); }; }
  else { b.innerHTML = icon('arrow-right') + 'One more thing: pick your toolbox'; b.onclick = renderToolbox; }
}
function renderToolbox(){
  Lab.patch('#dzone', `
    <h3 class="q">Final call: what do we migrate <em style="font-style:normal;color:var(--accent)">with</em>?</h3>
    ${say('your guide', `Good news: there is no wrong answer here. All three options do the same job — <b>get the truck from cloud A to cloud B</b>. You choose based on budget, company size and your team's skills. Pick one.`, 'tip')}
    <div class="choices">
      ${tools.map((o, i) => `<button class="choice" id="tl${i}" onclick="L.pickTool(${i},event)"><b>${icon(o.ic)} ${esc(o.t)}</b><small>${esc(o.s)}</small></button>`).join('')}
    </div>
    <div class="verdict" id="tverdict"></div>
    <div class="spacer"></div>
    <button class="btn blue" id="tnext" style="display:none" onclick="L.goto(3)">${icon('arrow-right')}Toolbox packed — to preparation</button>
  `);
}
function pickTool(i, e){
  tools.forEach((x, j) => { const el = $('tl' + j); if (!el) return; el.disabled = true; if (j === i) el.classList.add('good'); });
  scoreAt(10, e);

function pilotGo(i, e){

function spawnItem(){
  const arena = $('arena');

  if (arena.querySelectorAll('.item:not(.fly)').length >= 4) return;
  const type = pick(ITEM_TYPES);
  const it = document.createElement('button');
  it.className = 'item'; it.setAttribute('aria-label', 'Send ' + type.ic + ' to the new cloud');
  it.innerHTML = icon(type.ic);
  const aw = arena.clientWidth || 600, ah = arena.clientHeight || 340;
  const narrow = aw < 520, pad = narrow ? 100 : 150, sz = narrow ? 42 : 48;
  const x = pad + Math.random() * Math.max(40, aw - pad * 2 - sz);
  const y = (narrow ? 92 : 100) + Math.random() * Math.max(20, ah - (narrow ? 92 : 100) - sz - 44);
  it.style.left = Math.round(x) + 'px'; it.style.top = Math.round(y) + 'px';
