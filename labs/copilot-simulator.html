<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Secrets — shautech labs</title>
<meta name="description" content="Operation «Open Secrets» — an interactive Copilot readiness simulator by shautech. Copilot doesn't leak data, it finds what was already leaked: hunt the oversharing, label what matters, and roll out AI properly." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0B0D'/%3E%3Crect x='5' y='5' width='22' height='22' rx='5' fill='none' stroke='%234D9FFF' stroke-width='2'/%3E%3Ctext x='16' y='22' font-family='ui-monospace,monospace' font-size='18' font-weight='700' text-anchor='middle' fill='%234D9FFF'%3E%E2%80%BA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0D;
    --bg-2:#0d0f13;
    --panel:#101317;
    --panel-2:#15181f;
    --line:rgba(255,255,255,0.08);
    --line-2:rgba(255,255,255,0.14);
    --text:#F4F6F8;
    --muted:#98A0AA;
    --muted-2:#646C76;
    --accent:#4D9FFF;
    --accent-soft:#7CBBFF;
    --accent-ink:#04132B;
    --glow:rgba(77,159,255,0.30);
    --crit:#FF7A7A;
    --warn:#FFB65C;
    --violet:#8A86FF;
    --r:14px;
    --ease:cubic-bezier(.2,.7,.2,1);
    --blue:var(--accent);
    --green:#5FD68F;
    --green-ink:#06180D;
    --amber:var(--warn);
    --red:var(--crit);
    --ink:var(--text);
    --ink-soft:var(--muted);
    --card:var(--panel);
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    color:var(--text);
    background:var(--bg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(120% 90% at 70% -10%,#000 0%,transparent 60%);
            mask-image:radial-gradient(120% 90% at 70% -10%,#000 0%,transparent 60%);
    opacity:.5;
  }
  body::after{
    content:"";position:fixed;top:-20%;right:-10%;width:60vw;height:60vw;z-index:0;
    pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,rgba(138,134,255,.18) 0%,transparent 60%);
    filter:blur(40px);opacity:.6;transition:background 1.2s var(--ease);
  }
  body.night::after{background:radial-gradient(circle,rgba(138,134,255,.24) 0%,transparent 60%);}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  a{color:inherit;text-decoration:none}

  /* ambient flow — Copilot asks on the left, your tenant answers on the right */
  #copbg{
    position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
    background:
      radial-gradient(55% 46% at -10% 52%,rgba(138,134,255,.08),transparent 70%),
      radial-gradient(55% 46% at 110% 48%,rgba(77,159,255,.07),transparent 70%);
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }

  /* ---------- TOP BAR ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:40;
    background:rgba(10,11,13,.85);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:10px 18px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .logo{font-family:var(--mono);font-weight:700;font-size:1rem;letter-spacing:-.01em;display:inline-flex;align-items:center;white-space:nowrap;}
  .logo .mark{
    display:inline-grid;place-items:center;width:1.5em;height:1.5em;margin-right:.5em;
    border:1.5px solid var(--accent);border-radius:6px;color:var(--accent);font-size:.82em;
  }
  .logo .lab{color:var(--muted);font-weight:500;}
  .sim-name{font-family:var(--mono);font-size:.72rem;color:var(--muted-2);letter-spacing:.02em;white-space:nowrap;}
  @media(max-width:860px){.sim-name{display:none;}}
  .lvlmap{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap;}
  .lvl{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted-2);min-width:56px;
  }
  .lvl .bubble{
    width:32px;height:32px;border-radius:9px;
    background:var(--panel);border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;font-size:14px;
    transition:all .25s var(--ease);
  }
  .lvl.now{color:var(--accent-soft);}
  .lvl.now .bubble{border-color:var(--accent);transform:scale(1.12);box-shadow:0 0 14px var(--glow),0 0 0 1px var(--accent);}
  .lvl.done{color:var(--muted);}
  .lvl.done .bubble{background:rgba(77,159,255,.10);border-color:var(--accent);}
  .lvl.done .bubble::after{content:"✓";color:var(--accent-soft);font-weight:700;font-family:var(--mono);}
  .lvl.done .bubble em{display:none;}
  .hud{display:flex;gap:10px;align-items:center;}
  .pill{
    font-family:var(--mono);font-size:13px;font-weight:600;
    background:var(--panel-2);color:var(--muted);
    border:1px solid var(--line-2);
    padding:7px 13px;border-radius:20px;
    transition:transform .15s;
  }
  .pill b{color:var(--accent-soft);}

  /* ---------- STAGE ---------- */
  .stage{
    position:absolute;top:96px;bottom:0;left:0;right:0;
    overflow-y:auto;z-index:1;
    padding:26px clamp(16px,5vw,70px) 40px;
  }
  .screen{max-width:880px;margin:0 auto;animation:pop .4s var(--ease) both;}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:none;}}

  .badge{
    display:inline-flex;align-items:center;gap:.6em;
    font-family:var(--mono);font-size:.74rem;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    margin-bottom:14px;
  }
  .badge::before{content:"//";color:var(--violet);letter-spacing:0;}
  h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(28px,4.6vw,44px);line-height:1.08;margin-bottom:10px;letter-spacing:-.02em;font-weight:700;}
  h2{font-family:"Space Grotesk",sans-serif;font-size:clamp(21px,3.2vw,30px);margin-bottom:8px;letter-spacing:-.015em;font-weight:600;}
  .say{
    background:var(--panel);border:1px solid var(--line-2);border-radius:12px;
    padding:16px 18px 14px;font-size:15px;line-height:1.55;color:var(--text);
    position:relative;margin:18px 0 14px;
    box-shadow:0 10px 30px -18px rgba(0,0,0,.8);
    max-width:680px;
  }
  .say::before{
    content:attr(data-who);
    position:absolute;top:-10px;left:14px;
    font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    background:var(--panel-2);border:1px solid var(--accent);color:var(--accent-soft);
    padding:2px 9px;border-radius:6px;
  }
  .say.tip::before{border-color:var(--green);color:var(--green);}
  .say.alert::before{border-color:var(--crit);color:var(--crit);}
  .say.ai::before{border-color:var(--violet);color:var(--violet);}
  .say b{color:var(--text);}
  .muted{color:var(--muted);font-size:14px;line-height:1.55;max-width:660px;}

  .btn{
    font-family:var(--mono);font-size:.92rem;font-weight:600;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:.6em;
    background:transparent;color:var(--text);border:1px solid var(--line-2);
    padding:.8em 1.3em;border-radius:10px;cursor:pointer;
    transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s,border-color .25s,color .25s;
    white-space:normal;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent-soft);transform:translateY(-2px);}
  .btn.blue{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .btn.blue:hover{transform:translateY(-2px);box-shadow:0 14px 36px -10px var(--glow),0 0 0 1px var(--accent-soft);color:var(--accent-ink);}
  .btn.green{background:var(--green);color:var(--green-ink);border-color:transparent;}
  .btn.green:hover{transform:translateY(-2px);box-shadow:0 14px 36px -10px rgba(95,214,143,.4),0 0 0 1px var(--green);color:var(--green-ink);}
  .btn.small{font-size:.8rem;padding:.6em 1.1em;border-radius:9px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn:focus-visible,.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .float-pts{
    position:fixed;font-family:var(--mono);font-weight:700;font-size:18px;color:var(--green);
    pointer-events:none;z-index:99;animation:rise .9s ease-out forwards;
    text-shadow:0 0 12px rgba(95,214,143,.6);
  }
  @keyframes rise{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-46px);}}

  /* ---------- LEVEL 1 : OVERSHARING HUNT ---------- */
  .office{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px;margin-top:18px;
  }
  .obj{
    background:var(--panel);border:1px solid var(--line-2);border-radius:12px;
    padding:14px 8px;text-align:center;cursor:pointer;user-select:none;
    transition:transform .2s var(--ease),border-color .2s,box-shadow .2s;
    font-family:inherit;color:var(--text);
  }
  .obj:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px -14px var(--glow);}
  .obj .ico{font-size:34px;display:block;margin-bottom:6px;}
  .obj .nm{font-size:12.5px;font-weight:600;}
  .obj.found{background:rgba(255,122,122,.07);border-color:var(--crit);cursor:default;}
  .obj.found:hover{transform:none;box-shadow:none;}
  .obj.found .nm::after{content:" ⚑";color:var(--crit);}
  .inv{
    margin-top:16px;background:var(--panel-2);border:1px dashed var(--line-2);
    border-radius:12px;padding:12px 16px;font-family:var(--mono);font-size:13px;
    min-height:44px;color:var(--muted);line-height:1.7;max-width:680px;
  }
  .inv b{color:var(--text);}

  /* ---------- LEVEL 2 + 7 : DECISIONS / TICKETS ---------- */
  .choices{display:grid;gap:12px;margin-top:14px;max-width:640px;}
  .choice{
    background:var(--panel);border:1px solid var(--line-2);border-radius:12px;
    padding:14px 16px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);
    font-size:14.5px;transition:transform .2s var(--ease),border-color .2s;
  }
  .choice:hover{transform:translateX(4px);border-color:var(--accent);}
  .choice b{display:block;font-size:15px;margin-bottom:2px;}
  .choice small{color:var(--muted);}
  .choice.good{background:rgba(95,214,143,.08);border-color:var(--green);}
  .choice.meh{background:rgba(255,182,92,.08);border-color:var(--warn);}
  .choice.bad{background:rgba(255,122,122,.08);border-color:var(--crit);}
  .choice:disabled{cursor:default;transform:none;}
  .verdict{margin-top:12px;font-size:14px;line-height:1.5;display:none;max-width:640px;}
  .warnnote{
    margin-top:10px;background:rgba(255,182,92,.07);border:1px dashed rgba(255,182,92,.45);
    border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.45;color:#E9C89B;
  }
  .warnnote b{color:var(--warn);}
  .ticket{
    background:var(--panel);border:1px solid var(--line-2);border-radius:12px;
    padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;
    flex-wrap:wrap;
  }
  .ticket .tx{flex:1;min-width:200px;font-size:14px;}
  .ticket .tx b{display:block;font-size:14.5px;}
  .ticket .tx small{color:var(--muted);}
  .ticket.done{background:rgba(95,214,143,.05);border-color:var(--green);}

  /* ---------- LEVEL 3 : LABEL THE FILES ---------- */
  .label-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;margin-top:16px;}
  .filerow{
    display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;margin-bottom:10px;
  }
  .filerow.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .filerow .face{font-size:26px;}
  .filerow .who{flex:1;}
  .filerow .who b{display:block;font-size:14px;font-family:var(--mono);font-weight:600;}
  .filerow .who small{color:var(--muted);font-size:12px;}
  .lbl-slot{
    width:126px;height:34px;border:1px dashed var(--line-2);border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10.5px;color:var(--muted-2);cursor:pointer;
    transition:border-color .2s;letter-spacing:.06em;text-transform:uppercase;
  }
  .lbl-slot:hover{border-color:var(--accent);}
  .lbl-slot.pub{border-style:solid;border-color:var(--green);background:rgba(95,214,143,.08);color:var(--green);font-weight:600;cursor:default;}
  .lbl-slot.int{border-style:solid;border-color:var(--accent);background:rgba(77,159,255,.08);color:var(--accent-soft);font-weight:600;cursor:default;}
  .lbl-slot.conf{border-style:solid;border-color:var(--crit);background:rgba(255,122,122,.08);color:var(--crit);font-weight:600;cursor:default;}
  .chip-stack{position:sticky;top:0;display:flex;flex-direction:column;gap:8px;}
  .chip-stack .stack-lbl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);}
  .chip{
    background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;
    padding:9px 14px;font-family:var(--mono);font-size:11.5px;font-weight:600;cursor:pointer;
    letter-spacing:.06em;text-transform:uppercase;
    user-select:none;transition:transform .2s var(--ease),background .2s,color .2s;
  }
  .chip:hover{transform:translateY(-2px);}
  .chip.c-pub{border-color:var(--green);color:var(--green);}
  .chip.c-int{border-color:var(--accent);color:var(--accent-soft);}
  .chip.c-conf{border-color:var(--crit);color:var(--crit);}
  .chip.sel.c-pub{background:var(--green);color:var(--green-ink);}
  .chip.sel.c-int{background:var(--accent);color:var(--accent-ink);}
  .chip.sel.c-conf{background:var(--crit);color:#2A0E12;}

  /* ---------- LEVEL 4 : FIX BOARD ---------- */
  .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:16px;}
  .act{
    display:flex;gap:10px;align-items:flex-start;text-align:left;font-family:inherit;
    background:var(--panel);border:1px solid var(--line-2);border-radius:10px;
    padding:12px 14px;font-size:13.5px;cursor:pointer;line-height:1.45;color:var(--muted);
    transition:transform .2s var(--ease),border-color .2s;
  }
  .act:hover{transform:translateY(-2px);border-color:var(--accent);}
  .act b{display:block;color:var(--text);font-size:14px;}
  .act.done{background:rgba(95,214,143,.07);border-color:var(--green);cursor:default;}
  .act.done:hover{transform:none;}
  .act.done b::after{content:" ✓";color:var(--green);}
  .act.nope{animation:shake .4s;border-color:var(--crit);background:rgba(255,122,122,.07);}

  /* ---------- LEVEL 5 : PROMPT ARCADE ---------- */
  .arena{
    position:relative;height:340px;margin-top:16px;
    background:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px),
      linear-gradient(180deg,var(--panel-2),var(--bg-2));
    background-size:48px 48px,48px 48px,100% 100%;
    border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;
  }
  .side-lbl{
    position:absolute;top:12px;font-family:var(--mono);font-size:11px;font-weight:600;
    text-align:center;width:110px;color:var(--muted);
  }
  .side-lbl small{color:var(--muted-2);}
  .side-lbl .c{font-size:44px;display:block;line-height:1.2;}
  .lbl-src{left:8px;} .lbl-src .c{filter:drop-shadow(0 0 18px rgba(138,134,255,.5));}
  .lbl-dst{right:8px;} .lbl-dst .c{filter:drop-shadow(0 0 18px var(--glow));}
  .mailcard{
    position:absolute;z-index:5;max-width:200px;text-align:left;
    background:var(--panel);border:1px solid var(--line-2);border-radius:10px;
    padding:8px 11px;font-family:var(--mono);font-size:11px;line-height:1.45;color:var(--text);
    cursor:pointer;animation:bob 1.8s ease-in-out infinite;
    box-shadow:0 8px 22px -10px rgba(0,0,0,.7);
  }
  .mailcard:hover{border-color:var(--violet);}
  .mailcard i{color:var(--violet);font-style:normal;display:block;font-size:10px;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .mailcard.zap{animation:zap .5s ease-in forwards;pointer-events:none;border-color:var(--green);}
  @keyframes zap{to{transform:scale(.25);opacity:0;}}
  .mailcard.oops{border-color:var(--warn);color:var(--warn);pointer-events:none;}
  .mailcard.fade{transition:opacity .8s;opacity:0;}
  .bigbar{
    position:absolute;bottom:12px;left:14px;right:14px;height:22px;
    background:var(--bg);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;
  }
  .bigbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--green));transition:width .3s;box-shadow:0 0 14px rgba(138,134,255,.4);}
  .bigbar span{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text);
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .event-banner{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    background:rgba(138,134,255,.12);border:1px solid var(--violet);color:var(--text);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    font-weight:700;font-size:14px;
    padding:10px 16px;border-radius:12px;
    display:none;z-index:10;text-align:center;max-width:min(92%,460px);
  }
  .event-banner small{color:var(--muted);font-weight:400;}
  .event-banner.ok{background:rgba(95,214,143,.12);border-color:var(--green);}
  .event-banner .btn{margin-top:8px;}

  /* ---------- LEVEL 6 : ROLLOUT SWITCH ---------- */
  .switch-zone{
    display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:24px;
  }
  .big-switch{
    width:130px;height:190px;background:var(--panel-2);border:1px solid var(--line-2);
    border-radius:20px;position:relative;cursor:pointer;
    font-family:inherit;transition:border-color .3s,box-shadow .3s;
  }
  .big-switch:hover{border-color:var(--accent);}
  .big-switch.on{border-color:var(--green);box-shadow:0 0 24px rgba(95,214,143,.25);}
  .big-switch .knob{
    position:absolute;left:10px;right:10px;height:74px;top:96px;
    background:var(--muted-2);border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:#101317;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.06em;
    transition:top .35s cubic-bezier(.5,1.6,.5,1), background .35s, color .35s;
  }
  .big-switch.on .knob{top:12px;background:var(--green);color:var(--green-ink);}
  .dns-line{font-family:var(--mono);font-size:13px;min-height:20px;color:var(--muted);text-align:center;}

  /* ---------- FINALE ---------- */
  .confetti{position:fixed;top:-20px;font-size:20px;z-index:98;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
  .rank-big{
    font-family:"Space Grotesk",sans-serif;font-size:clamp(30px,5vw,48px);font-weight:700;
    color:var(--accent-soft);margin:8px 0;letter-spacing:-.02em;
    text-shadow:0 0 30px var(--glow);
  }

  .center{text-align:center;}
  .spacer{height:18px;}
</style>
</head>
<body>

<canvas id="copbg" aria-hidden="true"></canvas>

<header id="topbar">

<script>
/* ═══════════════ AMBIENT BACKGROUND : copilot queries ⇄ tenant answers ═══════════════ */
(()=>{
  const cv=document.getElementById('copbg'), ctx=cv.getContext('2d');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SAMPLES=140;
  let W=0,H=0,paths=[],parts=[],pulses=[],dashOff=0,last=0,raf=null,T=0;
  let leakP=0.45, retKind='doc';

  const KINDS={doc:['doc'],link:['link'],user:['user'],site:['site'],bits:['bit','one','zero'],check:['check','lock'],mix:['doc','link','user','bit']};
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  window.COPBG={
    set(t){ if(!KINDS[t])return; retKind=t;
      parts.forEach(p=>{ if(p.role==='r') p.k=pick(KINDS[t]); }); },
    leak(p){ leakP=Math.max(0,Math.min(1,p)); }
  };

  const pal=()=>({q:'138,134,255', ok:'95,214,143', bad:'255,122,122',
    qHead:'#C6C2FF', okHead:'#A5EFC4', badHead:'#FFB3B3',
    trace:'rgba(154,148,255,.05)'});

  const rack=()=>{
    const rw=44, rh=Math.min(H*0.52,380), ry=(H-rh)/2;
    return {rw,rh,ry, x0:12, x1:W-12-rw, ax:12+rw+2, bx:W-12-rw-2};
  };
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function drawRacks(c){
    const g=rack();
    [{x:g.x0,label:'COPILOT · ASSISTANT',rgb:c.q},{x:g.x1,label:'YOUR TENANT',rgb:'77,159,255'}].forEach((r,ri)=>{
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,.10)';
      ctx.fillStyle='rgba(16,19,23,.55)';
      rr(r.x,g.ry,g.rw,g.rh,10);ctx.fill();ctx.stroke();
      const rows=Math.floor((g.rh-24)/24);
      for(let i=0;i<rows;i++){
        for(let j=0;j<2;j++){
          const tw=Math.sin(T*1.8+i*1.7+j*2.6+ri*3)*0.5+0.5;
          ctx.fillStyle=`rgba(${r.rgb},${(0.08+tw*0.28).toFixed(3)})`;
          ctx.fillRect(r.x+10+j*15, g.ry+16+i*24, 9, 4);
        }
      }
      ctx.translate(ri===1 ? r.x-8 : r.x+g.rw+14, g.ry+g.rh/2);
      ctx.rotate(-Math.PI/2);
      ctx.font='600 9px "JetBrains Mono",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(152,160,170,.45)';
      ctx.fillText(r.label.split('').join(' '),0,0);
      ctx.restore();
    });
  }

  function cubic(p0,p1,p2,p3,t){
    const u=1-t;
    return {x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,
            y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y};
  }
  function buildPaths(){
    paths=[];
    const g=rack(), lanes=6;
    for(let i=0;i<lanes;i++){
      const ya=g.ry+g.rh*(0.08+0.84*i/(lanes-1));
      const yb=g.ry+g.rh*(0.08+0.84*Math.random());
      const p0={x:g.ax,y:ya}, p3={x:g.bx,y:yb};
      const p1={x:W*(0.30+Math.random()*0.08), y:ya+(Math.random()*2-1)*H*0.20};
      const p2={x:W*(0.62+Math.random()*0.08), y:yb+(Math.random()*2-1)*H*0.20};
      const pts=[];
      for(let s=0;s<=SAMPLES;s++) pts.push(cubic(p0,p1,p2,p3,s/SAMPLES));
      const line=new Path2D();
      pts.forEach((p,k)=>k?line.lineTo(p.x,p.y):line.moveTo(p.x,p.y));
      paths.push({pts,line});
    }
  }
  const posOn=(path,t)=>{
    const f=Math.min(Math.max(t,0),1)*SAMPLES;
    const i=Math.floor(f), j=Math.min(i+1,SAMPLES), k=f-i;
    const a=path.pts[i], b=path.pts[j];
    return {x:a.x+(b.x-a.x)*k, y:a.y+(b.y-a.y)*k};
  };
  function newPart(role){
    return {
      role, /* 'q' = query heading right, 'r' = answer heading left */
      p:Math.floor(Math.random()*paths.length),
      t:Math.random(),
      v:0.045+Math.random()*0.075,
      s:1.2+Math.random()*1.5,
      k: role==='q' ? 'spark' : pick(KINDS[retKind]),
      leak: role==='r' && Math.random()<leakP
    };
  }
  function seedParticles(){
    const n=Math.max(20,Math.min(42,Math.round(W/36)));
    parts=Array.from({length:n},(_,i)=>newPart(i%2?'q':'r'));
  }
  function glyph(k,x,y,s,rgb,head){
    ctx.save();
    ctx.translate(x,y);
    ctx.strokeStyle=`rgba(${rgb},.9)`;
    ctx.fillStyle=`rgba(${rgb},.13)`;
    ctx.lineWidth=1;
    ctx.shadowBlur=8;ctx.shadowColor=`rgba(${rgb},.8)`;
    switch(k){
      case 'spark':{ /* 4-point star: a question in flight */
        ctx.strokeStyle=head;
        ctx.beginPath();
        ctx.moveTo(0,-1.8*s);ctx.lineTo(0,1.8*s);
        ctx.moveTo(-1.8*s,0);ctx.lineTo(1.8*s,0);
        ctx.moveTo(-1*s,-1*s);ctx.lineTo(1*s,1*s);
        ctx.moveTo(-1*s,1*s);ctx.lineTo(1*s,-1*s);
        ctx.stroke();
        break;}
      case 'doc':{
        const w=2.4*s,h=3*s,f=0.8*s;
        ctx.beginPath();
        ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2-f,-h/2);ctx.lineTo(w/2,-h/2+f);
        ctx.lineTo(w/2,h/2);ctx.lineTo(-w/2,h/2);ctx.closePath();
        ctx.fill();ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-w/2+0.5*s,-0.2*s);ctx.lineTo(w/2-0.5*s,-0.2*s);
        ctx.moveTo(-w/2+0.5*s,0.6*s);ctx.lineTo(w/2-0.5*s,0.6*s);
        ctx.stroke();
        break;}
      case 'link':{
        ctx.beginPath();ctx.ellipse(-0.9*s,0.45*s,1.15*s,0.6*s,-Math.PI/4,0,7);ctx.stroke();
        ctx.beginPath();ctx.ellipse(0.9*s,-0.45*s,1.15*s,0.6*s,-Math.PI/4,0,7);ctx.stroke();
        break;}
      case 'user':{
        ctx.beginPath();ctx.arc(0,-0.8*s,0.9*s,0,7);ctx.stroke();
        ctx.beginPath();ctx.arc(0,1.9*s,1.8*s,Math.PI*1.18,Math.PI*1.82);ctx.stroke();
        break;}
      case 'site':{
        const r=1.8*s;
        ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
        ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();
        ctx.beginPath();ctx.ellipse(0,0,r*0.45,r,0,0,7);ctx.stroke();
        break;}
      case 'bit':{
        const w=1.7*s;
        ctx.globalAlpha=.85;ctx.fillStyle=head;
        ctx.fillRect(-w/2,-w/2,w,w);
        break;}
      case 'one': case 'zero':{
        ctx.font=`600 ${Math.max(8,4.5*s)}px "JetBrains Mono",monospace`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.globalAlpha=.8;ctx.fillStyle=head;
        ctx.fillText(k==='one'?'1':'0',0,0);
        break;}
      case 'lock':{
        const w=2.6*s,h=2*s;
        ctx.beginPath();ctx.rect(-w/2,-0.1*s,w,h);ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.arc(0,-0.1*s,0.8*s,Math.PI,0);ctx.stroke();
        break;}
      case 'check':{
        ctx.strokeStyle=head;ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(-1.2*s,0.1*s);ctx.lineTo(-0.3*s,1*s);ctx.lineTo(1.4*s,-1*s);
        ctx.stroke();
        break;}
      default:{
        ctx.globalAlpha=.8;ctx.fillStyle=head;
        ctx.beginPath();ctx.arc(0,0,s,0,7);ctx.fill();
      }
    }
    ctx.restore();
  }
  function resize(){
    const dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildPaths();seedParticles();
    if(reduced) draw(0);
  }
  function draw(dt){
    T+=dt;
    ctx.clearRect(0,0,W,H);
    const c=pal();
    drawRacks(c);
    dashOff-=7*dt;
    ctx.save();
    ctx.strokeStyle=c.trace;ctx.lineWidth=1;
    ctx.setLineDash([2,7]);ctx.lineDashOffset=dashOff;
    paths.forEach(p=>ctx.stroke(p.line));
    ctx.restore();
    for(const pt of parts){
      const dir = pt.role==='q' ? 1 : -1;
      pt.t+=pt.v*dt*dir;
      if(pt.role==='q' && pt.t>=1){ /* question reached the tenant */
        const end=posOn(paths[pt.p],1);
        if(Math.random()<0.4) pulses.push({x:end.x,y:end.y,r:2,a:0.25,rgb:c.q});
        Object.assign(pt,newPart('q'));pt.t=0;
      }
      if(pt.role==='r' && pt.t<=0){ /* answer arrived back at Copilot */
        const end=posOn(paths[pt.p],0);
        if(Math.random()<0.55) pulses.push({x:end.x,y:end.y,r:2,a:0.32,rgb:pt.leak?c.bad:c.ok});
        Object.assign(pt,newPart('r'));pt.t=1;
      }
      const path=paths[pt.p];
      const rgb = pt.role==='q' ? c.q : (pt.leak ? c.bad : c.ok);
      const head= pt.role==='q' ? c.qHead : (pt.leak ? c.badHead : c.okHead);
      for(let k=5;k>=1;k--){
        const q=posOn(path,pt.t-dir*k*0.011);
        ctx.beginPath();
        ctx.arc(q.x,q.y,Math.max(pt.s*0.7*(1-k*0.13),.2),0,7);
        ctx.fillStyle=`rgba(${rgb},${0.16*(1-k/6)})`;
        ctx.fill();
      }
      const hp=posOn(path,pt.t);
      glyph(pt.k,hp.x,hp.y,pt.s,rgb,head);
    }
    pulses=pulses.filter(p=>p.a>0.01);
    for(const p of pulses){
      p.r+=34*dt;p.a-=0.5*dt;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,7);
      ctx.strokeStyle=`rgba(${p.rgb},${Math.max(p.a,0)})`;
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }
  function loop(now){
    const dt=Math.min((now-last)/1000||0,0.05);
    last=now;
    draw(dt);
    raf=requestAnimationFrame(loop);
  }
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){cancelAnimationFrame(raf);raf=null;}
    else if(!reduced && !raf){last=performance.now();raf=requestAnimationFrame(loop);}
  });
  resize();
  if(!reduced) raf=requestAnimationFrame(loop);
})();

/* ═══════════════ CORE ═══════════════ */
let score = 0;
let level = 0;
const LEVELS = [
  {icon:"🎬", name:"Start"},
  {icon:"🔦", name:"Discover"},
  {icon:"🧭", name:"Decide"},
  {icon:"🏷️", name:"Label"},
  {icon:"🔧", name:"Fix"},
  {icon:"💬", name:"Prompts"},
  {icon:"🚦", name:"Rollout"},
  {icon:"🎓", name:"Govern"}
];
const mapEl = document.getElementById('lvlmap');
LEVELS.forEach((l,i)=>{
  const d=document.createElement('div');
  d.className='lvl';d.id='lvl'+i;
  d.innerHTML=`<div class="bubble"><em>${l.icon}</em></div><span>${l.name}</span>`;
  mapEl.appendChild(d);
});
function refreshMap(){
  LEVELS.forEach((l,i)=>{
    const el=document.getElementById('lvl'+i);
    el.classList.toggle('now', i===level);
    el.classList.toggle('done', i<level);
  });
}
function fitStage(){
  document.getElementById('stage').style.top=(document.getElementById('topbar').offsetHeight+6)+'px';
}
window.addEventListener('resize',fitStage);
fitStage();
function addScore(n, x, y){
  score+=n;
  document.getElementById('score').textContent=score;
  const pill=document.getElementById('scorePill');
  pill.style.transform='scale(1.15)';setTimeout(()=>pill.style.transform='scale(1)',150);
  if(x!==undefined){
    const f=document.createElement('div');f.className='float-pts';f.textContent='+'+n;
    f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);
    setTimeout(()=>f.remove(),900);
  }
}
const screen = document.getElementById('screen');
function show(html){
  screen.style.animation='none';screen.offsetHeight;screen.style.animation='';
  screen.innerHTML=html;
  document.body.classList.toggle('night', level===6);
  document.querySelector('.stage').scrollTop=0;
  refreshMap();
}
function goto(n){ level=n; RENDER[n](); }

const objects=[
  {ico:"🧾", nm:"The HR site", flow:"doc", found:"«HR-Salaries» — shared with Everyone since 2019. Copilot would happily summarize it for the intern."},
  {ico:"🔗", nm:"«Anyone» links", flow:"link", found:"83 files with anonymous «anyone with the link» access — including the price list your competitor would love to read."},
  {ico:"👻", nm:"The ghost accounts", flow:"user", found:"3 ex-employees still have access to everything. One of them works for a competitor now. Oops."},
  {ico:"📁", nm:"The «final_FINAL» chaos", flow:"doc", found:"9 copies of the same contract in 9 places, each with different permissions. Which one would Copilot quote? Exactly. Nobody knows."},
  {ico:"🗄️", nm:"The 2016 archive site", flow:"site", found:"An old project site, open to everyone, full of scanned IDs and contracts. Nobody remembered it exists. Copilot never forgets."},
  {ico:"🤝", nm:"External sharing", flow:"user", found:"37 folders still shared with former vendors, an old accountant… and one mystery Gmail address nobody recognizes."}
];
let foundCount=0;
function L1(){
  foundCount=0;
  show(`
    <div class="badge">LEVEL 1 · DISCOVER 🔦</div>
    <h2>Find what Copilot would find</h2>
    <div class="say tip" data-who="YOUR GUIDE">
      Before switching Copilot on, we ask one question: <b>"what can people already see that they shouldn't?"</b>
      — because that's exactly what Copilot will surface, politely and instantly.
      Shine the flashlight: click each corner of the tenant. (+10 ⭐ per skeleton)
    </div>
    <div class="office">
      ${objects.map((o,i)=>`
        <button class="obj clickable" id="obj${i}" onclick="discover(${i},event)">
          <span class="ico">${o.ico}</span><span class="nm">${o.nm}</span>
        </button>`).join('')}
    </div>
    <div class="inv" id="inv">🔦 <b>Findings:</b> (none yet — start clicking!)</div>
    <div class="spacer"></div>
    <button class="btn blue" id="l1next" style="display:none" onclick="goto(2)">Skeletons catalogued! Now decide →</button>
  `);
}
function discover(i,e){
  const el=document.getElementById('obj'+i);
  if(el.classList.contains('found'))return;
  el.classList.add('found');
  foundCount++;
  COPBG.set(objects[i].flow);
  addScore(10,e.clientX,e.clientY);
  document.getElementById('inv').innerHTML='🔦 <b>Finding '+foundCount+'/'+objects.length+':</b> '+objects[i].found;
  if(foundCount===objects.length){
    document.getElementById('inv').innerHTML='🔦 <b>All 6 skeletons found.</b> Scary? A little. Normal? Completely — every tenant older than a year looks like this. The difference between companies isn\'t whether this exists; it\'s whether someone LOOKED before turning the AI loose on it.';
    document.getElementById('l1next').style.display='inline-flex';
  }
}

let di=0;
function L2(){
  di=0;
  show(`
    <div class="badge">LEVEL 2 · DECIDE 🧭</div>
    <h2>The readiness plan</h2>
    <div class="say tip" data-who="YOUR GUIDE">
      Now we know what's exposed. Three calls to make before anyone touches a rollout button.
    </div>
    <div id="dzone"></div>
  `);
  renderDecision();
}
function renderDecision(){
  const d=decisions[di];
  document.getElementById('dzone').innerHTML=`
    <h2 style="font-size:19px;margin-top:14px">Decision ${di+1}/${decisions.length}: ${d.q}</h2>
    <div class="choices">
      ${d.opts.map((o,i)=>`
        <button class="choice" id="ch${i}" onclick="pick(${i},event)">
          <b>${o.t}</b><small>${o.s}</small>
        </button>`).join('')}
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="spacer"></div>
    <button class="btn blue" id="dnext" style="display:none"></button>
  `;
}
function pick(i,e){
  const d=decisions[di], o=d.opts[i];
  d.opts.forEach((x,j)=>{
    const el=document.getElementById('ch'+j);
    el.disabled=true;
    if(j===i) el.classList.add(o.v);
  });
  if(o.pts>0) addScore(o.pts,e.clientX,e.clientY);
  const v=document.getElementById('verdict');
  v.innerHTML=`<div class="say" data-who="${o.v==='good'?'NICE':'HMM'}">${o.fb}</div>`;
  v.style.display='block';
  const btn=document.getElementById('dnext');
  btn.style.display='inline-flex';
  if(di<decisions.length-1){ btn.textContent='Next decision →'; btn.onclick=()=>{di++;renderDecision();}; }
  else { btn.textContent='One more thing: pick your toolkit →'; btn.onclick=renderToolbox; }
}
const tools=[
  {t:"🧰 The built-in reports & Purview", s:"Sharing reports, access reviews, sensitivity labels — already in the tenant.",
   fb:"The honest default: most of what you need for readiness is already licensed and switched off. Reports find the oversharing, Purview labels what matters. (+10 ⭐)"},

const RISKY=[

];
let flagged=0, PROMPT_TARGET=12, promptTimer=null, promptEventFired=false, promptLive=false, pcSeq=0;

    </div>

    <button class="btn blue" id="l5next" style="display:none" onclick="goto(6)">Test passed! To the rollout →</button>
  `);
  promptTimer=setInterval(spawnPrompt,1100);
  spawnPrompt();spawnPrompt();
}
function spawnPrompt(){
  if(!promptLive)return;
  const arena=document.getElementById('arena');
  if(!arena){clearInterval(promptTimer);return;}
  if(arena.querySelectorAll('.mailcard:not(.zap):not(.oops)').length>=3)return;
  const isRisky=Math.random()<0.65;
  const txt=isRisky?RISKY[Math.floor(Math.random()*RISKY.length)]:SAFE[Math.floor(Math.random()*SAFE.length)];
  const card=document.createElement('button');
  card.className='mailcard clickable';
  card.id='pc'+(pcSeq++);
  card.innerHTML=`<i>› prompt</i>"${txt}"`;
  card.style.left=(16+Math.random()*44)+'%';
  card.style.top=(16+Math.random()*52)+'%';
  card.onclick=(e)=>{
    if(!promptLive||card.classList.contains('zap')||card.classList.contains('oops'))return;
    if(isRisky){
      card.classList.add('zap');
      addScore(5,e.clientX,e.clientY);
      flagged++;
      updatePromptBar();
      setTimeout(()=>card.remove(),520);
      if(!promptEventFired && flagged===Math.floor(PROMPT_TARGET/2)) promptEvent();
      if(flagged>=PROMPT_TARGET) endPrompts();
    } else {
      card.classList.add('oops');
      card.innerHTML=`<i>checked ✓</i>Normal work — that's what it's for!`;
      setTimeout(()=>{card.classList.add('fade');setTimeout(()=>card.remove(),850);},1200);
    }
  };
  arena.appendChild(card);
  if(!isRisky){
    setTimeout(()=>{
      if(card.isConnected && !card.classList.contains('oops')){
        card.classList.add('fade');setTimeout(()=>card.remove(),850);
      }
    },5200);
  }
}
function updatePromptBar(){
  const p=Math.min(100,Math.round(flagged/PROMPT_TARGET*100));
  document.getElementById('bigFill').style.width=p+'%';
  document.getElementById('bigLabel').textContent=`${flagged} / ${PROMPT_TARGET} flagged`;
}
function promptEvent(){
  promptEventFired=true;promptLive=false;
  document.querySelectorAll('.mailcard').forEach(c=>c.style.opacity=.25);
  const b=document.getElementById('eventBanner');
  b.classList.remove('ok');

  promptLive=false;clearInterval(promptTimer);
  document.querySelectorAll('.mailcard').forEach(c=>c.remove());

    v.style.display='block';
    tdone++;
    if(tdone===tickets.length) finale();
  } else {
    firstTry[i]=false;
    btn.classList.add('bad');
    btn.disabled=true;
    setTimeout(()=>btn.classList.remove('bad'),450);
  }
}
function finale(){
  for(let i=0;i<40;i++){
    const c=document.createElement('div');c.className='confetti';
    c.textContent=["🎉","⭐","🤖","🎊","✨"][i%5];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(2+Math.random()*2.5)+'s';
    c.style.animationDelay=(Math.random()*0.8)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5500);
  }
  const MAX=410;
  let rank="Curious Rookie 🐣", msg="You made it to AI-ready — replay and hunt for more stars!";
  if(score>=370){rank="AI-Ready Legend 🏆";msg="Flawless! You could run the readiness workshop yourself.";}
  else if(score>=300){rank="Governance Guru 🧭";msg="Sharp! You know exactly what stands between a demo and a rollout.";}
  else if(score>=220){rank="Prompt Pilot ✈️";msg="Nice work! Another run and you'll catch every call.";}
  level=8;refreshMap();
  document.getElementById('lvl7').classList.add('done');
  document.getElementById('finale').innerHTML=`
    <div class="center" style="margin-top:10px">
      <h2>🎉 Open Secrets: closed!</h2>
      <div class="rank-big">${rank}</div>
      <div style="font-family:var(--mono);font-weight:600;color:var(--muted)">SCORE: ${score} / ~${MAX} ⭐</div>
      <p class="muted" style="margin:10px auto;max-width:520px">${msg}</p>
      <div class="say tip" data-who="REMEMBER" style="text-align:left;margin:22px auto 18px">
        The whole Copilot readiness story in one breath:
        <b>1)</b> Copilot respects permissions — so broken permissions ARE the risk →
        <b>2)</b> find the oversharing before it does → <b>3)</b> prioritize by damage, owners decide sensitivity →
        <b>4)</b> label what matters → <b>5)</b> fix the shares (private sites, no anonymous links, evict the ghosts, access reviews) →
        <b>6)</b> red-team your own prompts → <b>7)</b> pilot first, waves after, dashboards on, wins written down.
        And the one habit for everyone: <b>click the sources</b>. 🤖
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn blue" onclick="location.reload()">↺ Play again</button>
        <a class="btn green" href="../index.html#contact">Run this live with your team →</a>
      </div>
    </div>`;
}

const RENDER=[L0,L1,L2,L3,L4,L5,L6,L7];
refreshMap();
L0();
