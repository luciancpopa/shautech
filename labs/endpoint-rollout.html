<script>
/* © 2026 shautech. Patch Night — game logic. */
(function(){
'use strict';
const { icon, say, btn, avatar, sev, scoreAt, addScore, show, goto, toast, mood, util } = Lab;
const { esc, pick, shuffle, clamp } = util;
const $ = s => document.querySelector(s);
const setProgress = v => { if (Lab.scene) Lab.scene.set('progress', clamp(v, 0, 1)); };

/* ---------------- ambient scene: the fleet from above ---------------- */
const scene = {
  state: { level: 0, mood: '', progress: 0, waveT: 99 },
  init(s, W, H) {
    const cols = W < 600 ? 8 : 12, rows = 6, n = cols * rows;
    const cw = W / (cols + 1), ch = (H * 0.46) / (rows + 1);
    const order = shuffle([...Array(n).keys()]);
    s.devs = [];
    for (let i = 0; i < n; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      s.devs.push({ x: cw * (col + 1), y: H * 0.5 + ch * (row + 1), rank: order[i] / n, ph: Math.random() * 6.28 });
    }
    s.w = Math.min(cw * 0.5, 26); s.h = s.w * 0.66;
  },
  onChange(s, k) { if (k === 'progress') s.waveT = 0; },
  draw(ctx, s, W, H, t, dt) {
    s.waveT += dt;
    const C = Lab.colors, night = s.level === 6 || s.mood === 'night';
    if (night) { ctx.fillStyle = Lab.rgba(C.violet, .045); ctx.fillRect(0, 0, W, H); }
    if (!s.devs) return;
    const p = s.progress || 0, w = s.w, h = s.h;
    ctx.lineWidth = 1;
    for (const d of s.devs) {
      let col, a, arc = 0;
      if (d.rank < p) { col = C.mint; a = night ? .42 : .5; }
      else if (d.rank < p + 0.07) { col = C.accent; a = .7; arc = 1 - (d.rank - p) / 0.07; }
      else if (d.rank < p + 0.35) { col = C.amber; a = .32; }
      else { col = C.ink3; a = .26; }
      const pulse = arc ? 1 + 0.08 * Math.sin(t * 4 + d.ph) : 1;
      const ww = w * pulse, hh = h * pulse, x = d.x - ww / 2, y = d.y - hh / 2;
      ctx.strokeStyle = Lab.rgba(col, a);
      ctx.fillStyle = Lab.rgba(col, a * .14);
      Lab.draw.rr(ctx, x, y, ww, hh, 3); ctx.fill(); ctx.stroke();
      // screen hinge line + status LED
      ctx.strokeStyle = Lab.rgba(col, a * .5); ctx.beginPath(); ctx.moveTo(x + 3, y + hh - 4); ctx.lineTo(x + ww - 3, y + hh - 4); ctx.stroke();
      ctx.fillStyle = Lab.rgba(col, Math.min(1, a + .25)); ctx.beginPath(); ctx.arc(x + ww - 4, y + 4, 1.4, 0, 7); ctx.fill();
      if (arc) {
        ctx.strokeStyle = Lab.rgba(C.accent, .75); ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.arc(d.x, d.y, w * .82, -Math.PI / 2, -Math.PI / 2 + arc * Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
      }
    }
    // the upgrade wave: a thin vertical sweep across the fleet when progress changes, plus a faint idle sweep
    const sweep = (fx, alpha) => {
      const x = fx * W, g = ctx.createLinearGradient(0, H * .48, 0, H);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, Lab.rgba(night ? C.violet : C.accent, alpha)); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, H * .48); ctx.lineTo(x, H); ctx.stroke(); ctx.lineWidth = 1;
    };
    if (s.waveT < 2.6) sweep(s.waveT / 2.6, .55 * (1 - s.waveT / 2.6) + .1);
    sweep(((t * 0.045) % 1.25) - 0.12, .12);
    // fleet counter
    Lab.draw.text(ctx, `fleet  ${Math.round(p * 1000)} / 1000 compliant`, W - 18, H - 16, { align: 'right', color: Lab.rgba(p >= 1 ? C.mint : C.ink2, .6) });
  }
};

/* ---------------- L0 : briefing ---------------- */
const DEFS = [
  ['cloud', 'Intune', 'Microsoft’s cloud service that configures, secures and updates laptops and phones wherever they are, no office network needed.'],
  ['box', 'Autopilot', 'A new laptop is shipped straight to the user; on first boot it joins the company, installs its apps and policies by itself.'],
  ['layers', 'Co-management', 'A device is managed by the old on-site tool (SCCM) and Intune at the same time while you move workloads to the cloud.'],
  ['shield-check', 'Compliance policy', 'The list of rules a device must meet (encrypted, up to date, antivirus on) before it is allowed to open company data.'],
  ['lock', 'BitLocker', 'Full-disk encryption built into Windows. A lost laptop becomes a useless brick instead of a data breach, if the recovery key is stored safely.'],
  ['key', 'LAPS', 'Local Administrator Password Solution: every device gets its own unique local admin password, rotated automatically and stored in Entra.']
];
function L0(){
  mood('');
  setProgress(0);
  show(`
    ${Lab.badge('Level 0 · briefing','play')}
    <h1>Welcome to <em>Patch Night</em>. The fleet is yours.</h1>
    ${say('the cfo', `We have <b>1,000 laptops</b>. Windows 10 support ended, the auditors noticed, and the cyber-insurance renewal has a question about “endpoint compliance” that I cannot answer.
      Half the fleet was bought by departments on their own card, everyone is a local administrator, and I have been told the word <b>“Autopilot”</b> three times today.
      Get us to Windows 11, managed and encrypted. And do it <b>without stopping sales for a single hour</b>. No weekend outage, no “please come to IT with your laptop”.`)}
    ${say('your guide', `You do not need to be an engineer to run this well. Modern endpoint work is mostly <b>inventory, sequencing and communication</b>, with a handful of policies behind it.
      Six words you will hear all evening, in one sentence each:`, 'tip')}
    <div class="defs">
      ${DEFS.map(d => `<div class="def">${icon(d[0])}<span><b>${d[1]}</b>${d[2]}</span></div>`).join('')}
    </div>
    <div class="spacer"></div>
    <button class="btn blue" onclick="L.goto(1)">${icon('arrow-right')}Accept the mission</button>
  `);
}

/* ---------------- L1 : discovery ---------------- */
const TILES = [
  { ic:'laptop',    nm:'Windows 10 laptops',      found:'<b>612 laptops</b> on Windows 10. 470 are in SCCM; 142 report to nothing at all. Most have TPM 2.0, but a 2019 batch of 86 does not.' },
  { ic:'building',  nm:'Lobby kiosks',            found:'<b>9 kiosks</b> running Windows 7. Yes, 7. The visitor check-in app has not been updated since the vendor was a different company.' },
  { ic:'monitor',   nm:'Marketing’s Macs',        found:'<b>38 Macs</b>. Nobody manages them, nobody encrypts them, and two of them have the entire brand archive.' },
  { ic:'phone',     nm:'BYOD phones',             found:'<b>~400 personal phones</b> with Outlook and Teams. Some run an OS version older than the intern.' },
  { ic:'scan',      nm:'Warehouse scanners',      found:'<b>60 handheld scanners</b> on an embedded Windows build. They hold the logistics system together. Treat with respect.' },
  { ic:'briefcase', nm:'The CEO’s “special” laptop', found:'<b>1 laptop</b>, bought at an airport, never joined to anything, local admin, and “must never restart during a call”.' },
  { ic:'cpu',       nm:'Domain-joined desktop pool', found:'<b>280 desktops</b> in finance and support, domain-joined and SCCM-managed. Tidy, but 70 are down to a few GB of free disk.' }
];
const COLLECT = [
  ['cpu',        'Hardware readiness',  'TPM 2.0, supported CPU, 4 GB RAM, 64 GB disk. Windows 11 refuses to install without them; find out now, not on the night.'],
  ['settings',   'Management state',    'Who manages each device today: SCCM, Intune, both, or nobody. “Nobody” is your real project.'],
  ['key',        'Local administrators', 'Which accounts hold admin rights on which devices. Usually the answer is “everyone, since 2016”.'],
  ['boxes',      'Application inventory', 'Every installed app and whether the vendor supports it on Windows 11. The kiosk app is the first one to ask about.'],
  ['lock',       'Encryption and keys', 'Which disks are already encrypted and, crucially, where the recovery keys live. A key nobody can find is the same as no key.'],
  ['user-check', 'Identity join type',  'On-site domain, Entra joined, or hybrid. It decides which Autopilot and compliance features you can use.']
];
let found = 0, collected = 0;
function L1(){
  found = 0; collected = 0;
  setProgress(0.02);
  show(`
    ${Lab.badge('Level 1 · discovery','search')}
    <h2>You cannot upgrade what you have not counted</h2>
    ${say('your guide', `Everyone wants to start with the shiny part (Autopilot). Start with the boring part: <b>the inventory</b>. Click each group of devices to find out what is really out there. (+5 per group)`, 'tip')}
    <div class="grid grid--auto">
      ${TILES.map((t, i) => `<button class="tile" id="tile${i}" onclick="L.disc(${i},event)">${icon(t.ic)}<span class="nm">${t.nm}</span></button>`).join('')}
    </div>
    <div class="inv" id="inv">${icon('sheet')} <b>Inventory:</b> empty. Click the device groups.</div>
    <div id="sheetZone"></div>
    <div class="spacer"></div>
    <button class="btn" id="sheetBtn" style="display:none" onclick="L.sheet()">${icon('sheet')}Open the readiness sheet</button>
    <button class="btn blue" id="l1next" style="display:none" onclick="L.goto(2)">${icon('arrow-right')}Inventory done. To the decisions</button>
  `);
}
function disc(i, e){
  const el = $('#tile' + i); if (!el || el.classList.contains('found')) return;
  el.classList.add('found'); found++;
  scoreAt(5, e);
  setProgress(0.02 + found * 0.01);
  Lab.patch('#inv', `${icon('sheet')} <b>Found:</b> ${TILES[i].found}<br><small class="small">${found}/${TILES.length} groups inventoried</small>`);
  if (found === TILES.length) {
    Lab.patch('#inv', `${icon('check-circle')} <b>Every group counted.</b> Roughly 1,000 Windows devices plus the Macs and phones. Clicking around is not an inventory, though. A real one ends in a sheet.`);
    const b = $('#sheetBtn'); if (b) b.style.display = 'inline-flex';
  }
}
function sheet(){
  const b = $('#sheetBtn'); if (b) b.style.display = 'none';
  Lab.patch('#sheetZone', `
    ${say('your guide', `This is the readiness sheet, exported from SCCM and Intune (and a script for the orphans). It is dull and it is the most valuable document of the project, because it already shows the <b>blockers</b>: the highlighted rows cannot go to Windows 11 as they are.`, 'tip')}
    <div class="sheet"><table>
      <tr><th>Device group</th><th>Count</th><th>OS today</th><th>TPM 2.0</th><th>Disk free</th><th>Managed</th><th>Note</th></tr>
      <tr><td>Laptops, 2021+ models</td><td>526</td><td>Windows 10 22H2</td><td>yes</td><td>&gt; 40 GB</td><td>SCCM 384 · none 142</td><td>in-place upgrade candidates</td></tr>
      <tr class="hot"><td>Laptops, 2019 batch</td><td>86</td><td>Windows 10 21H2</td><td>no</td><td>&gt; 30 GB</td><td>SCCM</td><td>hardware refresh, cannot run Windows 11</td></tr>
      <tr class="bad"><td>Lobby kiosks</td><td>9</td><td>Windows 7</td><td>no</td><td>8 GB</td><td>none</td><td>out of support twice over; app not Windows 11 ready</td></tr>
      <tr><td>Marketing Macs</td><td>38</td><td>macOS 14</td><td>n/a</td><td>ok</td><td>none</td><td>enrol in Intune, add Defender, enable FileVault</td></tr>
      <tr><td>BYOD phones</td><td>~400</td><td>iOS / Android, mixed</td><td>n/a</td><td>n/a</td><td>none</td><td>app protection, not device management</td></tr>
      <tr><td>Warehouse scanners</td><td>60</td><td>Windows 10 IoT LTSC</td><td>yes</td><td>ok</td><td>SCCM</td><td>LTSC is supported until 2029, leave them alone</td></tr>
      <tr class="hot"><td>CEO laptop</td><td>1</td><td>Windows 10 Home</td><td>yes</td><td>ok</td><td>none</td><td>Home edition cannot join Entra; needs a managed replacement</td></tr>
      <tr class="hot"><td>Desktop pool, finance &amp; support</td><td>280</td><td>Windows 10 22H2</td><td>yes</td><td>70 under 10 GB</td><td>SCCM</td><td>disk cleanup before upgrade or the install fails halfway</td></tr>
    </table></div>
    ${say('the checklist', `Here is <b>what a discovery must collect</b>, so the sheet above can exist. Tick each one to confirm it is on your list. (+5 each)`, 'tip')}
    <div class="clist">
      ${COLLECT.map((c, i) => `<button class="citem" id="ci${i}" onclick="L.check(${i},event)"><span class="box">${icon('check')}</span>${icon(c[0])}<span><b>${c[1]}</b>${c[2]}</span></button>`).join('')}
    </div>
  `);
}
function check(i, e){
  const el = $('#ci' + i); if (!el || el.classList.contains('checked')) return;
  el.classList.add('checked'); collected++;
  scoreAt(5, e);
  if (collected === COLLECT.length) {
    setProgress(0.12);
    const n = $('#l1next'); if (n) { n.style.display = 'inline-flex'; n.scrollIntoView({ behavior: Lab.reduced ? 'auto' : 'smooth', block: 'nearest' }); }
  }
}

/* ---------------- L2 : decisions ---------------- */
const DECISIONS = [
  { q:'How do we get 1,000 devices onto Windows 11?',
    opts:[
      { t:'In-place upgrade for everything', s:'Run the Windows 11 upgrade on every device as it sits today.', v:'meh', pts:5,
        fb:'Fast and cheap for the healthy, managed devices. But the 142 orphan laptops carry their junk, their local admins and their unknown apps straight into the new OS. You upgrade the problem instead of fixing it.' },
      { t:'Two lanes: upgrade the managed, reset the unmanaged', s:'In-place upgrade for devices already in SCCM/Intune; Autopilot reset for the orphans so they come back clean and managed.', v:'good', pts:10,
        fb:'Right. Eligible, managed devices take the upgrade in place over a lunch break. The unmanaged half gets a one-time Autopilot reset: user data synced to OneDrive first, device wiped, rebuilt by itself into a managed Windows 11 state.' },
      { t:'Email everyone the Windows 11 download link', s:'They are adults. They can click “Upgrade now”.', v:'bad', pts:0,
        fb:'Some will, most will not, a few will upgrade their personal gaming PC by mistake. You also learn nothing about who succeeded. Self-service is fine for choosing a wallpaper, not for an operating system.' }
    ]},
  { q:'In what order do devices get the upgrade?',
    opts:[
      { t:'Big bang', s:'Push to all 1,000 on Friday night. Monday is Windows 11 day.', v:'bad', pts:0,
        fb:'If 3% fail, that is 30 people who cannot work on Monday, all at once, all calling the same two helpdesk staff. Big bang is how an upgrade becomes an outage.' },
      { t:'Rings: pilot, early adopters, broad', s:'50 IT and friendly volunteers first, then 200, then everyone, with a pause rule between rings.', v:'good', pts:10,
        fb:'Exactly. Every ring teaches you something before the next one. The pause rule (“stop if more than 5% fail”) is what turns a surprise into a small, contained incident instead of a company-wide one.' },
      { t:'Department by department, sales last', s:'Finance this week, support next week, sales when they are quiet.', v:'meh', pts:5,
        fb:'Better than big bang, but a department is not a test group. If finance has a problem, it is every accountant at month-end. Rings mix roles and locations on purpose so that one failure does not take out one team.' }
    ]},
  { q:'The upgrade needs a restart. How do we handle it during business hours?',
    opts:[
      { t:'Force restart as soon as the install finishes', s:'Done means done. 15-minute warning, then reboot.', v:'bad', pts:0,
        fb:'That is the sales call that drops mid-demo, and the spreadsheet that was not saved. The CFO said “without stopping sales”; a forced restart at 14:00 is exactly that.' },
      { t:'Deadline with a grace period', s:'Install silently in the background; the user gets 5 days and clear notifications to restart when it suits them. After the deadline, Windows restarts outside active hours.', v:'good', pts:10,
        fb:'This is the modern pattern. The heavy lifting happens while people work; the restart is theirs to schedule for almost a week, and a quiet-hours deadline guarantees it eventually happens. Nobody is surprised, everybody is upgraded.' },
      { t:'Never force anything, just ask nicely', s:'A toast notification, forever, until they feel like it.', v:'meh', pts:5,
        fb:'Kind, but 10% of the fleet will still be on Windows 10 at the next audit. A grace period is kindness with an end date.' }
    ]},
  { q:'SCCM manages 730 devices today. What is the management plan?',
    opts:[
      { t:'Keep SCCM only', s:'It works. Why change?', v:'meh', pts:5,
        fb:'It does work, for devices that come into the office. The 142 orphans and anyone working from home never see the SCCM server. You also need Intune for compliance policy and Conditional Access, which SCCM alone cannot give you.' },

const ARC = { raf: null, timer: null, spawn: null, items: [], on: false, pts: 0, t: 0, dur: 50, up: 0, fail: 0, total: 44, spawned: 0, arena: null, id: 0 };
const ARC_CAP = 80;
const AMBER = [['battery-low', 'low battery'], ['hard-drive', 'disk full'], ['cpu', 'no TPM 2.0']];
function arcScore(n, e){
  if (n > 0) { const room = ARC_CAP - ARC.pts; n = Math.min(n, Math.max(0, room)); if (!n) return; }

}
function stopArcade(){

}

      <div class="house house--r" id="houseR">${icon('shield-check')}Windows 11<small>compliant</small></div>

function arcStart(){
  const arena = $('#arena'); if (!arena || ARC.on) return;
  const banner = $('#aBanner'); if (banner) banner.classList.remove('show');

  ARC.total = Lab.reduced ? 30 : 44;
  const interval = (ARC.dur * 1000 - 9000) / ARC.total;
  ARC.timer = setInterval(() => {
    if (!document.body.contains(arena)) return stopArcade();
    ARC.t++;
    const left = ARC.dur - ARC.t; Lab.patch('#aT', String(Math.max(0, left)));
    if (left <= 0) arcEnd();
  }, 1000);
  ARC.spawn = setInterval(() => {
    if (!document.body.contains(arena)) return stopArcade();
    if (ARC.spawned >= ARC.total) { clearInterval(ARC.spawn); ARC.spawn = null; return; }
    spawnItem(arena); ARC.spawned++;
  }, interval);
  spawnItem(arena); ARC.spawned++;
  let last = performance.now();
  const tick = now => {
    if (!ARC.on) return;
    if (!document.body.contains(arena)) return stopArcade();
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    const W = arena.clientWidth, goal = W - 84;
    for (const it of ARC.items) {
      if (it.gone) continue;
      it.x += it.v * dt * W;
      it.el.style.left = it.x + 'px';
      if (it.x >= goal) arrive(it);
    }
    ARC.raf = requestAnimationFrame(tick);
  };
  ARC.raf = requestAnimationFrame(tick);
}
function spawnItem(arena){
  const r = Math.random(), kind = r < 0.56 ? 'ok' : r < 0.84 ? 'warn' : 'bad';
  const it = { id: ARC.id++, kind, x: 60, v: (Lab.reduced ? 0.085 : 0.1) + Math.random() * 0.05, gone: false };
  const el = document.createElement('button');
  el.className = 'item' + (kind === 'warn' ? ' warn' : kind === 'bad' ? ' bad' : '');

  else if (kind === 'bad') { label = 'unknown device, block it'; el.innerHTML = icon('laptop') + `<span class="mini">${icon('alert')}</span>`; }
  else el.innerHTML = icon('laptop');

function hit(it, e){

  else { it.el.classList.add('sink'); toast('That one was healthy. It will still upgrade, just later.', 'info'); ARC.up++; }

}
function arrive(it){
  it.gone = true;
  it.el.classList.add('pop');
  if (it.kind === 'ok') { arcScore(1); ARC.up++; }
  else if (it.kind === 'warn') { arcScore(-3); ARC.fail++; flash(`Upgrade failed on a device with ${it.issue}. Rolled back to Windows 10.`); }
  else { arcScore(-5); ARC.fail++; flash('An unknown device enrolled and got company access. Block those.'); }

}
let flashT = null;
function flash(msg){
  const b = $('#aBanner'); if (!b) return;

function hud(){

function arcEnd(){

function stepHTML(i){
  const s = STEPS[i], state = i < stepIdx ? 'ok' : i === stepIdx ? '' : 'locked';
  return `<div class="step ${state}" id="step${i}">
    <span class="num">${i < stepIdx ? icon('check') : i + 1}</span>
    <span class="body"><b>${s.t}</b><small>${s.s}</small>
      ${i === stepIdx ? `<div class="choices">${s.opts.map((o, j) => `<button class="choice" id="st${i}o${j}" onclick="L.step(${i},${j},event)">${o.t}</button>`).join('')}</div><div class="verdict" id="stv${i}"></div>` : ''}
    </span></div>`;
}
function step(i, j, e){
  if (i !== stepIdx) return;
  const s = STEPS[i], o = s.opts[j], el = $('#step' + i); if (!el) return;
  s.opts.forEach((x, k) => { const b = $(`#st${i}o${k}`); if (!b) return; b.disabled = true; if (k === j) b.classList.add(o.ok ? 'good' : 'bad'); });
  if (o.ok) scoreAt(10, e);
  logLines(o.log);
  Lab.patch('#stv' + i, say(o.ok ? 'right' : 'costly', `${s.ex} <b>(+${o.ok ? 10 : 0})</b>`, o.ok ? 'tip' : 'alert'));
  const v = $('#stv' + i); if (v) v.classList.add('show');
  el.classList.add('ok'); el.querySelector('.num').innerHTML = icon('check');
  stepIdx++;
  setProgress(0.86 + stepIdx * 0.02);
  if (stepIdx < STEPS.length) {
    const next = $('#step' + stepIdx); if (next) next.outerHTML = stepHTML(stepIdx);
    Lab.hydrateIcons($('#steps'));
  } else {
    const sw = $('#bigSwitch'); if (sw) sw.disabled = false;
    Lab.patch('#swLine', 'All four settled. Flip the switch: compliance goes from report-only to enforced.');
    if (sw) sw.scrollIntoView({ behavior: Lab.reduced ? 'auto' : 'smooth', block: 'nearest' });
  }
}
function flip(){
  if (flipped || stepIdx < STEPS.length) return; flipped = true;
  const sw = $('#bigSwitch'); if (sw) { sw.classList.add('on'); sw.disabled = true; }
  Lab.patch('#knob', 'ENFORCE');
  addScore(20, innerWidth / 2, innerHeight / 2);
  Lab.patch('#swLine', 'Compliance enforced. Non-compliant devices now lose access after their grace period. (+20)');
  setProgress(0.97);
  logLines([
    ['p', '22:00  compliance policy: report-only -> ENFORCED'],
    ['dim', 'conditional access: require compliant device = on'],
    ['', 'fleet 1,000 · compliant 941 · in grace 47 · non-compliant 12'],
    ['warn', '12 non-compliant: 9 kiosks (isolated), 2 refresh-list laptops, 1 Home-edition laptop (replacement shipped)'],
    ['dim', '22:00-23:30  ring-2 restarts outside active hours: 388 restarted, 0 recovery prompts'],
    ['ok', '23:41  rollout night closed. No sales hour lost.']
  ]);
  logQ.then(() => { const n = $('#l6next'); if (n) n.style.display = 'inline-flex'; });
}

function solve(i, j, e){

    tk.opts.forEach((op, k) => { const x = $(`#tk${i}o${k}`); if (!x) return; x.disabled = true; if (k === j) x.classList.add('good'); });

    scoreAt(pts, e);

    firstTry[i] = false;
