<div class="nojs" id="nojs"><div class="box"><p class="badge">shautech labs</p><h2>This simulator needs JavaScript.</h2><p class="muted">It runs entirely in your browser, nothing is sent anywhere. Enable JavaScript, or <a href="index.html" style="color:var(--accent2)">go back to all labs</a>.</p></div></div>

<script>
/* © 2026 shautech. Restore Point — game logic. */
(function(){
'use strict';
const { icon, say, btn, avatar, sev, scoreAt, addScore, show, goto, toast, mood, util } = Lab;
const { esc, pick, shuffle, clamp } = util;
const D = Lab.draw, C = Lab.colors;
const $ = s => document.querySelector(s);

/* ---------------- ambient scene: file server (left) -> backup vault (right) ---------------- */
const scene = {
  state: { level: 0, mood: '', infected: false, restored: 0, inf: 0 },
  init(s, W, H) {
    const small = W < 700;
    const rw = small ? 36 : 58, rh = clamp(H * 0.42, 170, 320), ry = H * 0.56 - rh / 2;
    const lx = small ? 8 : Math.round(W * 0.11), rx = small ? W - 8 - rw : Math.round(W * 0.9) - rw;
    s.g = { rw, rh, ry, lx, rx, slots: 10, small };
    s.lanes = [0, 1].map(i => {
      const y0 = ry + rh * (0.32 + 0.36 * i), y1 = ry + rh * (0.32 + 0.36 * (1 - i));
      const bend = small ? 30 : 70;
      return D.curve([lx + rw, y0], [W * 0.42, y0 + (i ? bend : -bend)], [W * 0.58, y1 + (i ? -bend : bend)], [rx, y1], 110);
    });
    const n = small ? 14 : 24;
    s.parts = Array.from({ length: n }, () => ({ lane: Math.random() < .5 ? 0 : 1, t: Math.random(), v: .05 + Math.random() * .06, s: 4 + Math.random() * 2, back: false, bad: false }));
  },
  draw(ctx, s, W, H, t, dt) {
    const g = s.g; if (!g) return;
    if (s.infected) s.inf = Math.min(1, s.inf + dt * 0.12); else s.inf = Math.max(0, s.inf - dt * 0.6);
    const inf = s.inf, res = clamp(s.restored || 0, 0, 1), n = g.slots;
    D.grid(ctx, W, H, 64, 'rgba(255,255,255,.025)');
    /* red haze while infected */
    if (inf > 0.01) {
      const cx = g.lx + g.rw / 2, cy = g.ry + g.rh / 2;
      const a = inf * (1 - res) * (0.07 + 0.03 * Math.sin(t * 2.2));
      const gr = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * 0.32);
      gr.addColorStop(0, Lab.rgba(C.red, Math.max(0, a))); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    }
    /* lanes */
    s.lanes.forEach(p => D.path(ctx, p, res > 0.5 ? 'rgba(124,242,196,.16)' : 'rgba(140,194,255,.14)', 1, [3, 8]));
    /* racks */
    const redSlots = Math.round(inf * n), mintSlots = Math.round(res * n);
    const leftCol = res > 0.5 ? 'rgba(124,242,196,.4)' : (inf > 0.5 ? 'rgba(255,92,122,.4)' : 'rgba(77,159,255,.4)');
    const fill = 'rgba(16,19,23,.45)';
    D.rack(ctx, g.lx, g.ry, g.rw, g.rh, { slots: n, label: g.small ? '' : 'FS01 · FILE SERVER', color: leftCol, fill,
      led: i => (i < mintSlots ? C.mint : (i < redSlots ? C.red : C.accent)) });
    D.rack(ctx, g.rx, g.ry, g.rw, g.rh, { slots: n, label: g.small ? '' : 'BACKUP VAULT', color: 'rgba(124,242,196,.38)', fill, led: () => C.mint });
    /* lock glyphs on the infected LEDs */
    for (let i = mintSlots; i < redSlots; i++) {
      const sy = g.ry + 10 + i * ((g.rh - 20) / n) + 5;
      D.glyph(ctx, 'lock', g.lx + g.rw / 2 - 4, sy, 4, Lab.rgba(C.red, .55 + .2 * Math.sin(t * 3 + i)));
    }
    /* vault padlock badge */
    D.glyph(ctx, 'shield', g.rx + g.rw / 2, g.ry + g.rh + 22, 7, 'rgba(124,242,196,.45)');
    /* packets */
    for (const p of s.parts) {
      p.t += dt * p.v * (p.back ? -1 : 1);
      if (!p.back && p.t >= 1) { p.t = 0; p.lane = Math.random() < .5 ? 0 : 1; p.back = Math.random() < res; p.bad = !p.back && Math.random() < inf * 0.7; if (p.back) p.t = 1; }
      if (p.back && p.t <= 0) { p.t = 1; p.lane = Math.random() < .5 ? 0 : 1; p.back = Math.random() < res; p.bad = !p.back && Math.random() < inf * 0.7; if (!p.back) p.t = 0; }
      const [x, y] = D.posOn(s.lanes[p.lane], p.t);
      const col = p.back ? Lab.rgba(C.mint, .8) : (p.bad ? Lab.rgba(C.red, .8) : Lab.rgba(C.accent2, .7));
      D.glyph(ctx, p.bad ? 'lock' : 'file', x, y, p.s, col);
    }
  }
};
const sset = (k, v) => { if (Lab.scene) Lab.scene.set(k, v); };

/* ---------------- shared cleanup for timers ---------------- */
let arc = null, nightTimer = null;
function cleanup() {
  if (arc) { arc.live = false; if (arc.raf) cancelAnimationFrame(arc.raf); arc = null; }
  if (nightTimer) { clearInterval(nightTimer); nightTimer = null; }
}

/* ---------------- L0 : briefing ---------------- */
function L0() {
  cleanup(); mood('alert'); sset('infected', true); sset('restored', 0);
  show(`
    ${Lab.badge('Level 0 · Friday, 17:40', 'play')}
    <h1>Every file just turned <em>.locked</em>.</h1>
    ${say('the boss', `Everyone is leaving for the weekend and the F: drive is full of files called <b>Q3-forecast.xlsx.locked</b>.
      There is a <b>README_RESTORE.txt</b> on every desktop asking for 4 bitcoin, "price doubles Sunday midnight".
      The SharePoint "Projects" library looks the same. You are the IT lead. Tell me we have backups.`, 'alert')}
    ${say('your guide', `Welcome to <b>Restore Point</b> at Vector Freight, 140 people, trucks across Europe, one file server too many.
      Ransomware is not a storage problem, it is a <b>recovery</b> problem: companies with a tested copy the attacker cannot reach have a bad weekend;
      companies without one have a bad year. Three terms you will hear all night:`, 'tip')}
    <div class="defs">
      <div class="def">${icon('layers')}<div><b>3-2-1 BACKUP</b>Three copies of your data, on two different kinds of storage, one of them somewhere else. The modern version is <b>3-2-1-1-0</b>: plus one copy offline or immutable, and zero errors on a tested restore.</div></div>
      <div class="def">${icon('lock')}<div><b>IMMUTABLE</b>A copy that nobody can change or delete before its retention date passes, not even an administrator holding stolen passwords.</div></div>
      <div class="def">${icon('clock')}<div><b>RPO / RTO</b>RPO: how much work you can afford to lose (the gap between the last good backup and the incident). RTO: how long you can afford to be down.</div></div>
    </div>
    <div class="spacer"></div>
    <button class="btn blue" onclick="L.goto(1)">${icon('arrow-right')}Take the incident</button>
  `);
}

/* ---------------- L1 : discovery ---------------- */
const assets = [
  { ic: 'server', nm: 'FS01 file server', st: 'on-prem', prot: 'Encrypted', imm: 'No', last: 'Azure vault, Thu 23:10', verdict: 'Isolate now, rebuild later', cls: 'bad',
    ex: `<b>FS01, 2.1 TB, every share.</b> The encryption started 16:52 from a service account. Windows shadow copies have been deleted, which ransomware always does first. The server itself is lost as a <i>system</i>; what matters is which clean copy of its <i>data</i> exists elsewhere.` },
  { ic: 'cloud', nm: 'Microsoft 365', st: 'OneDrive · SharePoint · Exchange', prot: 'Versions only', imm: 'No', last: 'Version history (93 days)', verdict: 'Roll back library versions; buy a real backup', cls: 'warn',
    ex: `<b>The "Projects" library was encrypted through a synced OneDrive client</b> on an infected PC, the files were simply uploaded in their locked form. Good news: SharePoint keeps previous versions and a 93-day recycle bin, so a library-level restore to Thursday is possible.
      Hard truth for the boss: <b>Microsoft 365 retention is not a backup.</b> Retention policies keep what is deleted for compliance; they do not protect you from a tenant-wide attack, a malicious admin, a licence lapse or a sync disaster, and Microsoft's own terms say so. A third-party Microsoft 365 backup is a line item, not a luxury.` },
  { ic: 'hard-drive', nm: 'NAS + USB disks', st: 'server room', prot: 'NAS encrypted · USB offline', imm: 'USB only (air gap)', last: 'USB, Tue 18:00', verdict: 'Fallback only, stale', cls: 'warn',
    ex: `<b>The NAS was mapped as drive B: on FS01 with write access</b>, so the backup share got encrypted a minute after the data did. A backup the server can write to is just a second copy of the problem.
      The USB disk rotated weekly sits in the drawer, last swapped Tuesday: <b>offline, so it survived</b>, but it is three days old (RPO 72 h) and nobody has ever tried restoring from it.` },
  { ic: 'cloud-check', nm: 'Azure Backup vault', st: 'cloud · geo-redundant', prot: 'Yes', imm: 'Yes (soft delete + immutability)', last: 'Thu 23:10', verdict: 'Primary restore source', cls: 'ok',
    ex: `<b>Nightly backup of the FS01 VM, the SQL databases and the domain controllers' system state</b>, with soft delete and an immutability lock enabled. The attacker had domain admin, tried to delete these at 17:05, and the vault refused. This is the <b>"1" in 3-2-1-1</b>: the copy nobody can touch. RPO about 19 hours. Last restore test: never. Tonight changes that.` },
  { ic: 'laptop', nm: "Daniel's laptop", st: 'the backup guy · on holiday', prot: 'n/a', imm: 'No', last: 'n/a', verdict: 'Single point of knowledge', cls: 'warn',
    ex: `<b>Daniel is in Greece with no signal.</b> His laptop holds the backup console password in a text file, the only copy of the restore procedure, and the vault's recovery key export. All of it was also synced to FS01. A backup nobody but one person knows how to restore has an RTO of "when Daniel is back". Recovery documentation belongs in a <b>printed, offline runbook</b> and a password vault with break-glass access.` },
  { ic: 'network', nm: 'Domain controllers', st: 'DC01 · DC02', prot: 'Compromised', imm: 'System state in vault', last: 'Thu 23:10', verdict: 'Treat every password as stolen', cls: 'bad',
    ex: `<b>The ransom note is on DC01's desktop.</b> The attacker ran the encryption with a domain admin account, which means they had every credential in the company. Containment is not finished until <b>every</b> password, service account and the Kerberos ticket-signing key is reset, and the DCs are rebuilt or restored from a point before the intrusion.` }
];
let found = 0;
function L1() {
  cleanup(); mood('alert'); found = 0;
  show(`
    ${Lab.badge('Level 1 · discovery', 'search')}
    <h2>What do we <em>actually</em> have?</h2>
    ${say('your guide', `Before any decision: inventory. Click each system to learn whether it is protected, whether the copy is immutable, and how old the last clean point is. (+10 each, +10 for the full picture)`, 'tip')}
    <div class="grid grid--3" id="tiles">
      ${assets.map((a, i) => `
        <button class="tile" id="tile${i}" onclick="L.found(${i},event)">${icon(a.ic)}<span class="nm">${a.nm}</span><span class="st">${a.st}</span></button>`).join('')}
    </div>
    <div class="inv" id="inv"><b>Inventory 0/6</b> · click a system above.</div>
    <div id="sheet"></div>
    <div class="spacer"></div>
    <button class="btn blue" id="l1next" style="display:none" onclick="L.goto(2)">${icon('arrow-right')}Picture clear. Decisions</button>
  `);
}
function foundAsset(i, e) {
  const a = assets[i], el = $('#tile' + i);
  if (!el || el.classList.contains('found')) return;
  el.classList.add('found'); if (a.cls === 'bad') el.classList.add('bad');
  found++; scoreAt(10, e);
  Lab.patch('#inv', `<b>Inventory ${found}/6</b> · ${sev(a.cls === 'ok' ? 'ok' : a.cls === 'bad' ? 'crit' : 'warn', a.verdict)}<br>${a.ex}`);
  if (found === assets.length) {
    addScore(10);
    Lab.patch('#sheet', `
      <div class="sheet"><table>
        <thead><tr><th>Asset</th><th>Protected?</th><th>Immutable?</th><th>Last clean point</th><th>Verdict</th></tr></thead>
        <tbody>${assets.map(x => `<tr class="${x.cls === 'bad' ? 'bad' : x.cls === 'warn' ? 'hot' : ''}"><td>${x.nm}</td><td>${x.prot}</td><td>${x.imm}</td><td>${x.last}</td><td>${x.verdict}</td></tr>`).join('')}</tbody>
      </table></div>
      ${say('the picture', `Six systems, <b>one</b> copy the attacker could not reach: the immutable Azure vault, 19 hours old. The NAS proves the point in reverse: online backups the server can write to die with the server. Microsoft 365 will recover through version history this time, and gets a proper backup next week. Inventory complete, +10.`, 'tip')}`);
    const nb = $('#l1next'); if (nb) nb.style.display = 'inline-flex';
  }
}

/* ---------------- L2 : decisions ---------------- */
const decisions = [
  { q: 'The note says 4 BTC, doubling Sunday. Pay or not?', opts: [
    { t: 'Do not pay by default. We have a clean immutable copy: report, recover, rebuild.', s: 'Payment is a last resort decided with insurer and legal, not under a countdown.', v: 'good', pts: 10,
      fb: 'Right. You have a copy the attacker could not touch, so paying buys nothing you do not already own. Decryptors from criminals are slow, buggy, and arrive roughly two times out of three; paying marks you as a payer, may breach sanctions law, and the data they copied is still theirs. Paying is a business decision for the insurer and legal counsel, never a reflex at 17:45.' },
    { t: 'Open a channel with the attacker through a negotiator to stall, but pay nothing yet.', s: 'Buys time and learns what they took.', v: 'meh', pts: 5,
      fb: 'Defensible, but only with the insurer and legal in the room: negotiators can learn what was stolen and slow the clock. On your own it costs hours you need for recovery, and the countdown is theatre designed to rush you.' },
    { t: 'Pay now, before the price doubles. Cheaper than a week of downtime.', s: 'Be pragmatic, get the key, move on.', v: 'bad', pts: 0,
      fb: 'The countdown worked on you. No guarantee of a working key, the stolen data stays stolen, you may have just funded a sanctioned group, and the group now knows you pay. With an immutable copy in the vault you paid for something you already had.' } ] },
  { q: 'FS01 and DC01 are still encrypting. Isolate or shut down?', opts: [
    { t: 'Isolate: disable the switch ports and VPN, keep the machines powered on.', s: 'Cut the network, not the power.', v: 'good', pts: 10,
      fb: 'Containment with the evidence intact. Pulling the network stops the spread and the attacker\'s remote control; keeping power preserves memory, running processes and logs that show how they got in. Isolation first, forensics second, rebuild third.' },
    { t: 'Hard power-off everything in the server room, right now.', s: 'No electricity, no encryption.', v: 'meh', pts: 5,
      fb: 'It does stop the encryption, and if you have no way to isolate it is better than nothing. But you lose the memory evidence that tells you what happened, risk corrupting disks mid-write, and some strains encrypt faster on the next boot. Prefer the network cable.' },
    { t: 'Leave it running and start deleting the .locked files so people can see what is left.', s: 'Clean as you go.', v: 'bad', pts: 0,
      fb: 'Still connected means still spreading, and you are now destroying evidence and anything a decryptor or forensic tool could have recovered. Never clean before you contain.' } ] },
  { q: 'It is 18:05. Who do you call, in what order?', opts: [
    { t: 'Insurer hotline, then legal/DPO, note the time: the GDPR 72-hour clock started when we became aware. Then CERT and police.', s: 'The calls that have deadlines attached, first.', v: 'good', pts: 10,
      fb: 'Correct order. Cyber insurers require notice within hours and usually bring an incident-response firm with them. The DPO decides whether personal data is at risk; if so, the supervisory authority must be told within <b>72 hours of awareness</b>, Friday 17:40 to Monday 17:40, weekend included. The national CERT and the police want the ransom note and indicators; they may know the group and whether a decryptor exists.' },
    { t: 'Call the police, then post on LinkedIn to warn partners we have been hit.', s: 'Transparency, fast.', v: 'meh', pts: 5,
      fb: 'The police call is right. The public post is early: you do not yet know what was taken, your insurer may require approval of external statements, and customers will call a helpdesk that has no answers. Inform partners directly, with facts, after the first assessment.' },
    { t: 'Nobody yet. Fix it over the weekend, brief people Monday.', s: 'Why worry everyone before we know?', v: 'bad', pts: 0,
      fb: 'Silence is the most expensive option: it can void the insurance, burns the 72-hour GDPR window over a weekend, and every hour the attacker\'s stolen data gets closer to publication. The people on the phone exist precisely for Friday evenings.' } ] },
  { q: 'Restore the servers from last night, or rebuild?', opts: [
    { t: 'Rebuild servers from clean OS images, then restore only the DATA from the Thursday 23:10 immutable point.', s: 'Fresh systems, old data.', v: 'good', pts: 10,
      fb: 'Yes. The first suspicious login was Tuesday 02:14; any VM snapshot after that may contain the attacker\'s tools and scheduled tasks. Rebuilding the operating systems from known-good images and restoring data gives you a clean house with the furniture back. Slower RTO, no encore.' },
    { t: 'Restore the whole FS01 VM from Thursday night and reconnect, fastest path.', s: 'Everything exactly as it was.', v: 'meh', pts: 5,
      fb: 'Fast, and if the attacker only got in Friday it would be enough. But the logs say Tuesday, so Thursday\'s image includes their backdoor. You would restore the infection with the files. Full-VM restores are fine only when the point predates the intrusion.' },
    { t: 'Use the NAS copy, it is the newest.', s: 'Minutes of lost work instead of a day.', v: 'bad', pts: 0,
      fb: 'The NAS was encrypted with the server. Newer does not matter when the copy is unreadable; an online backup the attacker can write to is not a backup, it is a second victim.' } ] }
];
let di = 0;
function L2() {
  cleanup(); mood('alert'); di = 0;
  show(`
    ${Lab.badge('Level 2 · decisions', 'route')}
    <h2>Four calls that decide the <em>weekend</em>.</h2>
    ${say('your guide', `The first hour decides whether this is a story you tell or a story told about you. Pick the best option for each situation.`, 'tip')}
    <div id="dzone"></div>
  `);
  renderDecision();
}
function renderDecision() {
  const d = decisions[di];
  Lab.patch('#dzone', `
    <h3 style="margin-top:16px">Decision ${di + 1}/${decisions.length}: ${d.q}</h3>
    <div class="choices">
      ${d.opts.map((o, i) => `<button class="choice" id="ch${i}" onclick="L.decide(${i},event)"><b>${o.t}</b><small>${o.s}</small></button>`).join('')}
    </div>

    opts: [ { o: 'Modern email filtering with link and attachment scanning, a report button for staff, and short regular practice', ok: true }, { o: 'Block all external email', ok: false }, { o: 'Ban attachments', ok: false } ],
    ex: 'Filtering catches most, the report button catches the rest: you do not need everyone to spot every phish, you need one person to report it fast, and a culture where reporting is thanked.' },
  { t: 'Last ticket: what do we write down, so the next night shift is not improvised?', who: 'the boss, closing the laptop', ic: 'file-text',
    opts: [ { o: 'A one-page incident runbook: who to call, where the backups are, restore order, printed and stored offline, rehearsed yearly', ok: true }, { o: 'Nothing, we will remember', ok: false }, { o: 'A 60-page policy document nobody reads', ok: false } ],
    ex: 'The runbook was the thing Vector Freight missed most on Friday: it was on Daniel\'s laptop, encrypted. One page, printed, in the safe and in the password vault, with a tabletop rehearsal once a year. Memory of an incident has a half-life of about four days.' }
];
let tdone = 0, tTry = {};
function L7() {
  cleanup(); mood('calm'); tdone = 0; tTry = {};
  show(`
    ${Lab.badge('Level 7 · Monday aftermath', 'check-circle')}
    <h2>Monday, 09:00. Seven tickets that make sure this <em>never repeats</em>.</h2>
    ${say('your guide', `An incident you do not learn from is just damage. Close the seven tickets with the right fix. First try +10, retry +5.`, 'tip')}
    ${tickets.map((tk, i) => `
      <div class="ticket" id="tk${i}">
        <div class="tx">${icon(tk.ic)}<div><b>${tk.t}</b><small>${tk.who}</small></div></div>
        <div class="choices">${tk.opts.map((op, j) => `<button class="choice" id="tk${i}o${j}" onclick="L.solve(${i},${j},event)">${op.o}</button>`).join('')}</div>
        <div class="verdict" id="tk${i}v"></div>
      </div>`).join('')}
    <div class="spacer"></div>
    <div id="finale"></div>
  `);
}
function solve(i, j, e) {
  const tk = tickets[i], card = $('#tk' + i), b = $(`#tk${i}o${j}`);
  if (!card || !b || card.classList.contains('done')) return;
  if (tk.opts[j].ok) {
    card.classList.add('done');
    tk.opts.forEach((_, k) => { const x = $(`#tk${i}o${k}`); if (x) { x.disabled = true; if (k === j) x.classList.add('good'); } });
    scoreAt(tTry[i] ? 5 : 10, e);
    Lab.patch('#tk' + i + 'v', say('solved', tk.ex, 'tip')); const v = $('#tk' + i + 'v'); if (v) v.classList.add('show');
    tdone++;
    if (tdone === tickets.length) {
      sset('infected', false); sset('restored', 1);
      Lab.finale({ into: '#finale', heading: 'Restore Point: recovered.' });
    }
  } else {
    tTry[i] = true; b.classList.add('bad'); b.disabled = true;
    setTimeout(() => b.classList.remove('bad'), 500);
  }
}
